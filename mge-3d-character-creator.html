<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Character Creator - MGE STEM Studio</title>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <style>
        :root {
            --mge-primary: #ff6b6b;
            --mge-secondary: #4ecdc4;
            --mge-accent: #ffe66d;
            --mge-dark: #2d3436;
            --glass: rgba(255, 255, 255, 0.8);
            --glass-border: rgba(255, 255, 255, 0.4);
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f2f5;
        }

        #c {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* UI Overlays */
        .ui-panel {
            position: absolute;
            background: var(--glass);
            backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 1.5rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            z-index: 10;
            transition: transform 0.3s ease;
        }

        .left-panel {
            top: 20px;
            left: 20px;
            bottom: 20px;
            width: 80px;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            align-items: center;
        }

        .top-panel {
            top: 20px;
            left: 120px;
            right: 120px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .right-panel {
            top: 20px;
            right: 20px;
            bottom: 20px;
            width: 100px;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            overflow-y: auto;
            padding-right: 10px;
        }

        .bottom-panel {
            bottom: 20px;
            left: 120px;
            right: 120px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-around;
        }

        /* Tool Buttons */
        .tool-btn {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            border: none;
            background: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            transition: all 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .tool-btn:hover {
            transform: scale(1.1);
            background: var(--mge-secondary);
            color: white;
        }

        .tool-btn.active {
            background: var(--mge-primary);
            color: white;
            box-shadow: 0 0 15px var(--mge-primary);
        }

        .color-circle {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 2px solid white;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .color-circle:hover {
            transform: scale(1.2);
        }

        .color-circle.active {
            outline: 3px solid var(--mge-primary);
            outline-offset: 2px;
        }

        .part-btn {
            width: 60px;
            height: 60px;
            background: white;
            border-radius: 10px;
            border: 2px solid transparent;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            transition: all 0.2s;
        }

        .part-btn:hover {
            border-color: var(--mge-secondary);
            background: #f8f9fa;
        }

        .part-label {
            font-size: 0.6rem;
            margin-top: 2px;
            font-weight: bold;
            color: #666;
        }

        /* STEM Tip Styling */
        #stem-tip {
            font-weight: 700;
            color: var(--mge-dark);
            font-size: 1rem;
            animation: fadeInOut 10s infinite;
        }

        @keyframes fadeInOut {
            0%, 100% { opacity: 0; transform: translateY(-5px); }
            10%, 90% { opacity: 1; transform: translateY(0); }
        }

        /* Canvas Overlay for help */
        #help-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            text-align: center;
            color: rgba(0,0,0,0.2);
            font-weight: 800;
            font-size: 2rem;
            text-transform: uppercase;
            letter-spacing: 5px;
        }

        /* Custom Scrollbar for Right Panel */
        .right-panel::-webkit-scrollbar {
            width: 6px;
        }
        .right-panel::-webkit-scrollbar-track {
            background: transparent;
        }
        .right-panel::-webkit-scrollbar-thumb {
            background: rgba(0,0,0,0.1);
            border-radius: 10px;
        }

        .slider-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        input[type=range] {
            width: 60px;
            transform: rotate(-90deg);
            margin: 20px 0;
        }

        .badge-new {
            position: absolute;
            top: -10px;
            left: -10px;
            background: #ff4757;
            color: white;
            font-size: 0.6rem;
            padding: 2px 6px;
            border-radius: 10px;
            font-weight: 900;
            box-shadow: 0 4px 10px rgba(255, 71, 87, 0.4);
            z-index: 15;
        }
    </style>
</head>
<body>
    <canvas id="c"></canvas>

    <div class="ui-panel left-panel">
        <button class="tool-btn active" id="tool-draw" title="Draw Volume">🖌️</button>
        <button class="tool-btn" id="tool-erase" title="Eraser">🧽</button>
        <button class="tool-btn" id="tool-mirror" title="Toggle Mirror Mode">🪞</button>
        
        <div class="slider-container">
            <span style="font-size: 0.8rem; font-weight: bold;">SIZE</span>
            <input type="range" id="brush-size" min="0.1" max="2" step="0.1" value="0.5">
        </div>

        <div style="display: flex; flex-direction: column; gap: 8px;">
            <div class="color-circle active" style="background: #ff6b6b;" data-color="#ff6b6b"></div>
            <div class="color-circle" style="background: #4ecdc4;" data-color="#4ecdc4"></div>
            <div class="color-circle" style="background: #ffe66d;" data-color="#ffe66d"></div>
            <div class="color-circle" style="background: #a78bfa;" data-color="#a78bfa"></div>
            <div class="color-circle" style="background: #ffffff;" data-color="#ffffff"></div>
            <div class="color-circle" style="background: #2d3436;" data-color="#2d3436"></div>
        </div>
    </div>

    <div class="ui-panel top-panel">
        <div id="stem-tip">STEM Tip: 3D characters are made of basic geometric shapes!</div>
    </div>

    <div class="ui-panel right-panel">
        <div style="font-size: 0.7rem; font-weight: 900; text-align: center; margin-bottom: 5px;">FEATURES</div>
        <button class="part-btn" data-part="eye">👁️<span class="part-label">EYE</span></button>
        <button class="part-btn" data-part="mouth">👄<span class="part-label">MOUTH</span></button>
        <button class="part-btn" data-part="ear">👂<span class="part-label">EAR</span></button>
        <button class="part-btn" data-part="horn">🦄<span class="part-label">HORN</span></button>
        <button class="part-btn" data-part="wing">🦋<span class="part-label">WING</span></button>
        <button class="part-btn" data-part="tail">🐈<span class="part-label">TAIL</span></button>
        <button class="part-btn" data-part="hat">🎩<span class="part-label">HAT</span></button>
        <button class="part-btn" data-part="glasses">🕶️<span class="part-label">SPECS</span></button>
    </div>

    <div class="ui-panel bottom-panel">
        <button class="tool-btn" id="btn-undo" title="Undo">↩️</button>
        <button class="tool-btn" style="width: auto; padding: 0 20px; font-size: 1rem; font-weight: bold;" id="btn-clear">CLEAR CANVAS</button>
        <button class="tool-btn" style="width: auto; padding: 0 20px; font-size: 1rem; font-weight: bold; background: var(--mge-secondary); color: white;" id="btn-export">SAVE CHARACTER</button>
    </div>

    <div id="help-overlay">DRAG TO DRAW IN 3D</div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        let scene, camera, renderer, controls;
        let brushColor = '#ff6b6b';
        let brushSize = 0.5;
        let currentTool = 'draw';
        let mirrorMode = false;
        let drawingGroup, partsGroup;
        let history = [];
        let raycaster = new THREE.Raycaster();
        let mouse = new THREE.Vector2();
        let isDrawing = false;
        let lastPosition = new THREE.Vector3();

        const stemTips = [
            "STEM Tip: 3D characters are made of basic geometric shapes!",
            "Digital sculptures use thousands of tiny triangles called polygons.",
            "Mirroring helps you create symmetrical characters faster!",
            "The X, Y, and Z axes represent Width, Height, and Depth.",
            "Character silhouettes help identify heroes from far away.",
            "In 3D, 'Volume' is the amount of space an object takes up.",
            "Texture and color help define the personality of your creation!"
        ];

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xf0f2f5);
            scene.fog = new THREE.Fog(0xf0f2f5, 10, 50);

            camera = new THREE.Camera();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 5, 10);

            renderer = new THREE.WebGLRenderer({ canvas: document.querySelector('#c'), antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxDistance = 20;
            controls.minDistance = 5;

            // Lights
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 1);
            dirLight.position.set(5, 10, 5);
            dirLight.castShadow = true;
            scene.add(dirLight);

            const pointLight = new THREE.PointLight(0xffffff, 0.5);
            pointLight.position.set(-5, 5, -5);
            scene.add(pointLight);

            // Helpers
            const gridHelper = new THREE.GridHelper(20, 20, 0x000000, 0xcccccc);
            gridHelper.position.y = -2;
            scene.add(gridHelper);

            drawingGroup = new THREE.Group();
            scene.add(drawingGroup);

            partsGroup = new THREE.Group();
            scene.add(partsGroup);

            window.addEventListener('resize', onWindowResize);
            
            // Mouse/Touch events
            renderer.domElement.addEventListener('mousedown', onMouseDown);
            renderer.domElement.addEventListener('mousemove', onMouseMove);
            renderer.domElement.addEventListener('mouseup', onMouseUp);
            
            renderer.domElement.addEventListener('touchstart', (e) => {
                e.preventDefault();
                const touch = e.touches[0];
                onMouseDown({ clientX: touch.clientX, clientY: touch.clientY, button: 0 });
            }, { passive: false });

            renderer.domElement.addEventListener('touchmove', (e) => {
                const touch = e.touches[0];
                onMouseMove({ clientX: touch.clientX, clientY: touch.clientY });
            }, { passive: false });

            renderer.domElement.addEventListener('touchend', onMouseUp);

            // STEM Tip Cycle
            let tipIndex = 0;
            setInterval(() => {
                tipIndex = (tipIndex + 1) % stemTips.length;
                document.getElementById('stem-tip').innerText = stemTips[tipIndex];
            }, 10000);

            setupUI();
            animate();
        }

        function setupUI() {
            // Tools
            document.getElementById('tool-draw').onclick = () => setTool('draw');
            document.getElementById('tool-erase').onclick = () => setTool('erase');
            document.getElementById('tool-mirror').onclick = () => {
                mirrorMode = !mirrorMode;
                document.getElementById('tool-mirror').classList.toggle('active', mirrorMode);
            };

            // Size
            document.getElementById('brush-size').oninput = (e) => {
                brushSize = parseFloat(e.target.value);
            };

            // Colors
            document.querySelectorAll('.color-circle').forEach(el => {
                el.onclick = () => {
                    document.querySelectorAll('.color-circle').forEach(c => c.classList.remove('active'));
                    el.classList.add('active');
                    brushColor = el.dataset.color;
                };
            });

            // Parts
            document.querySelectorAll('.part-btn').forEach(btn => {
                btn.onclick = () => addFeature(btn.dataset.part);
            });

            // Actions
            document.getElementById('btn-clear').onclick = () => {
                while(drawingGroup.children.length > 0) drawingGroup.remove(drawingGroup.children[0]);
                while(partsGroup.children.length > 0) partsGroup.remove(partsGroup.children[0]);
                history = [];
            };

            document.getElementById('btn-undo').onclick = () => {
                if (drawingGroup.children.length > 0) {
                    const last = drawingGroup.children[drawingGroup.children.length - 1];
                    drawingGroup.remove(last);
                } else if (partsGroup.children.length > 0) {
                    const last = partsGroup.children[partsGroup.children.length - 1];
                    partsGroup.remove(last);
                }
            };

            document.getElementById('btn-export').onclick = () => {
                alert("Character Saved to MGE Gallery! (Simulation)");
            };
        }

        function setTool(tool) {
            currentTool = tool;
            document.querySelectorAll('.tool-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`tool-${tool}`).classList.add('active');
            controls.enabled = (tool === 'view'); // Usually we want orbit always or toggle
        }

        function onMouseDown(event) {
            if (event.button !== 0) return;
            isDrawing = true;
            document.getElementById('help-overlay').style.display = 'none';
            controls.enabled = false;
            
            updateMouse(event);
            addSplatAtMouse();
        }

        function onMouseMove(event) {
            if (!isDrawing) return;
            updateMouse(event);
            addSplatAtMouse();
        }

        function onMouseUp() {
            isDrawing = false;
            controls.enabled = true;
        }

        function updateMouse(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
        }

        function addSplatAtMouse() {
            raycaster.setFromCamera(mouse, camera);
            
            // We'll draw on a plane that faces the camera at the center
            const plane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
            plane.applyMatrix4(camera.matrixWorld);
            
            const intersectPoint = new THREE.Vector3();
            raycaster.ray.intersectPlane(plane, intersectPoint);

            if (lastPosition.distanceTo(intersectPoint) < brushSize * 0.3) return;
            lastPosition.copy(intersectPoint);

            if (currentTool === 'draw') {
                createVolume(intersectPoint);
            } else if (currentTool === 'erase') {
                eraseVolume(intersectPoint);
            }
        }

        function createVolume(pos) {
            const geo = new THREE.SphereGeometry(brushSize, 16, 16);
            const mat = new THREE.MeshStandardMaterial({ 
                color: brushColor, 
                roughness: 0.7, 
                metalness: 0.1,
                flatShading: false
            });
            
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.copy(pos);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            drawingGroup.add(mesh);

            if (mirrorMode) {
                const mirrorMesh = mesh.clone();
                mirrorMesh.position.x *= -1;
                drawingGroup.add(mirrorMesh);
            }
        }

        function eraseVolume(pos) {
            const radius = brushSize * 1.5;
            for (let i = drawingGroup.children.length - 1; i >= 0; i--) {
                const child = drawingGroup.children[i];
                if (child.position.distanceTo(pos) < radius) {
                    drawingGroup.remove(child);
                }
            }
            // Also erase parts
            for (let i = partsGroup.children.length - 1; i >= 0; i--) {
                const child = partsGroup.children[i];
                if (child.position.distanceTo(pos) < radius) {
                    partsGroup.remove(child);
                }
            }
        }

        function addFeature(type) {
            // Add feature at the center or where the camera is looking
            const vector = new THREE.Vector3(0, 0, -5);
            vector.applyQuaternion(camera.quaternion);
            vector.add(camera.position);

            let group = new THREE.Group();
            
            switch(type) {
                case 'eye':
                    const white = new THREE.Mesh(new THREE.SphereGeometry(0.3, 16, 16), new THREE.MeshStandardMaterial({color: 0xffffff}));
                    const pupil = new THREE.Mesh(new THREE.SphereGeometry(0.1, 16, 16), new THREE.MeshStandardMaterial({color: 0x000000}));
                    pupil.position.z = 0.25;
                    group.add(white, pupil);
                    break;
                case 'horn':
                    const horn = new THREE.Mesh(new THREE.ConeGeometry(0.2, 0.8, 16), new THREE.MeshStandardMaterial({color: 0xffd700}));
                    group.add(horn);
                    break;
                case 'ear':
                    const ear = new THREE.Mesh(new THREE.TorusGeometry(0.3, 0.1, 16, 32), new THREE.MeshStandardMaterial({color: brushColor}));
                    group.add(ear);
                    break;
                default:
                    // Use a text or simple placeholder
                    const box = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.5), new THREE.MeshStandardMaterial({color: brushColor}));
                    group.add(box);
            }

            group.position.copy(vector);
            partsGroup.add(group);

            if (mirrorMode) {
                const mirrorGroup = group.clone();
                mirrorGroup.position.x *= -1;
                partsGroup.add(mirrorGroup);
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        init();
    </script>
    <script src="mge-esc-overlay.js"></script>
</body>
</html>
