<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <g id="enemy-root">
    <!-- Blob Main Shape -->
    <path d="M 130,400 
             C 50,360 50,200 160,160
             C 200,145 312,145 352,160
             C 462,200 462,360 382,400
             C 340,420 170,420 130,400 Z" fill="#32cd32" stroke="#228b22" stroke-width="5"/>
    
    <!-- Antennae -->
    <path d="M 200,158 L 180,90" stroke="#32cd32" stroke-width="18" stroke-linecap="round"/>
    <circle cx="180" cy="90" r="25" fill="#32cd32" stroke="#228b22" stroke-width="3"/>
    
    <path d="M 312,158 L 332,90" stroke="#32cd32" stroke-width="18" stroke-linecap="round"/>
    <circle cx="332" cy="90" r="25" fill="#32cd32" stroke="#228b22" stroke-width="3"/>
    
    <!-- Pixel/Circuit Patterns -->
    <rect x="100" y="280" width="20" height="20" fill="#00ffff" opacity="0.8"/>
    <rect x="125" y="285" width="15" height="15" fill="#00ffff" opacity="0.8"/>
    <rect x="380" y="250" width="18" height="18" fill="#00ffff" opacity="0.8"/>
    <rect x="360" y="275" width="12" height="12" fill="#00ffff" opacity="0.8"/>
    
    <!-- Eyes -->
    <circle cx="205" cy="230" r="45" fill="#ffffff" stroke="#000" stroke-width="3"/>
    <circle cx="307" cy="240" r="40" fill="#ffffff" stroke="#000" stroke-width="3"/>
    
    <!-- Big goofy pupils -->
    <circle cx="210" cy="230" r="16" fill="#000"/>
    <circle cx="298" cy="240" r="14" fill="#000"/>
    
    <!-- Mouth/Teeth -->
    <path d="M 190,310 Q 256,360 322,310 C 300,340 212,340 190,310 Z" fill="#8b0000" stroke="#000" stroke-width="3"/>
    <rect x="235" y="318" width="18" height="18" rx="4" fill="#fff" stroke="#000"/>
    <rect x="265" y="320" width="16" height="16" rx="4" fill="#fff" stroke="#000"/>
    
    <!-- Little pink tongue piece visible -->
    <path d="M 240,340 Q 256,350 272,340" stroke="#ff69b4" stroke-width="5" stroke-linecap="round" fill="none"/>
    
  </g>
</svg>
