<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <g id="bird-root">
    <!-- Tail -->
    <path d="M 90,300 L 30,280 L 70,340 L 20,360 L 80,380 Z" fill="#8B0000" stroke="#000" stroke-width="4" />
    
    <!-- Body -->
    <circle cx="256" cy="270" r="180" fill="#ff3b30" stroke="#000" stroke-width="4"/>
    
    <!-- Belly -->
    <path d="M 100,320 C 140,410 372,410 412,320" fill="none" stroke="none" /> <!-- placeholder for logic -->
    
    <!-- Crest (Top feathers) -->
    <path d="M 200,110 Q 220,30 260,50 Q 270,30 310,70 Q 290,100 290,120" fill="#ff3b30" stroke="#000" stroke-width="4"/>

    <!-- Face Area -->
    <!-- Eyes -->
    <circle cx="210" cy="240" r="45" fill="#ffffcc" stroke="#000" stroke-width="3"/>
    <circle cx="302" cy="240" r="45" fill="#ffffcc" stroke="#000" stroke-width="3"/>
    
    <!-- Pupils -->
    <circle cx="210" cy="240" r="12" fill="#000"/>
    <circle cx="302" cy="240" r="12" fill="#000"/>

    <!-- Eyebrows -->
    <path d="M 160,190 L 240,225" stroke="#333" stroke-width="24" stroke-linecap="round"/>
    <path d="M 352,190 L 272,225" stroke="#333" stroke-width="24" stroke-linecap="round"/>

    <!-- Beak -->
    <path d="M 220,280 Q 256,270 292,280 L 320,320 L 256,350 L 192,320 Z" fill="#ffa500" stroke="#000" stroke-width="4"/>
    <path d="M 192,320 Q 256,315 320,320" stroke="#000" stroke-width="2" fill="none" />

    <!-- Goggles Strap -->
    <path d="M 76,260 Q 60,240 76,220 L 120,220 Q 130,240 120,260 Z" fill="#333"/>
    <path d="M 436,260 Q 452,240 436,220 L 392,220 Q 382,240 392,260 Z" fill="#333"/>

    <!-- Goggles Glass/Frame -->
    <path d="M 130,170 L 382,170 C 410,170 410,280 382,280 L 330,280 L 256,250 L 182,280 L 130,280 C 102,280 102,170 130,170 Z" fill="rgba(135,206,250,0.5)" stroke="#555" stroke-width="10"/>
    
    <!-- Glass highlights -->
    <path d="M 150,190 L 190,190 L 170,230 Z" fill="rgba(255,255,255,0.4)" />
  </g>
</svg>
