<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kids Paint & Animate!</title>
    <style>
        :root {
            --primary: #FF6B6B;
            --secondary: #4ECDC4;
            --accent: #FFE66D;
            --dark: #2C3E50;
            --light: #F7FFF7;
        }

        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif; /* Kid friendly font */
            background-color: var(--secondary);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--dark);
        }

        h1 {
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            margin-bottom: 10px;
        }

        .container {
            background: rgba(255, 255, 255, 0.9);
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 900px;
            width: 100%;
        }

        .toolbar {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 15px;
            padding: 10px;
            background: #fff;
            border-radius: 15px;
            border: 3px solid var(--accent);
        }

        .tool-group {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 5px 15px;
            background: var(--light);
            border-radius: 10px;
            border: 2px solid #ddd;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.1s;
            box-shadow: 0 4px 0 #d9534f;
        }

        button:hover {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #d9534f;
        }

        button:active {
            transform: translateY(4px);
            box-shadow: none;
        }

        button.active-tool {
            background-color: var(--dark);
            box-shadow: 0 4px 0 #1a252f;
        }

        input[type="color"] {
            width: 40px;
            height: 40px;
            padding: 0;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        input[type="range"] {
            width: 100px;
        }

        .canvas-container {
            position: relative;
            width: 800px;
            height: 600px;
            border: 5px solid var(--dark);
            border-radius: 15px;
            overflow: hidden;
            background-color: white;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.1);
        }

        #trace-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            opacity: 0.3;
            pointer-events: none;
            display: none;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            cursor: crosshair;
        }

        #onion-canvas {
            pointer-events: none;
            opacity: 0.2;
        }

        .animation-timeline {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            padding: 15px;
            background: white;
            border-radius: 15px;
            border: 3px solid var(--primary);
            width: 100%;
            overflow-x: auto;
            align-items: center;
        }

        .frame {
            width: 60px;
            height: 45px;
            border: 2px solid #ccc;
            border-radius: 5px;
            cursor: pointer;
            background: white;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }

        .frame.active {
            border-color: var(--primary);
            border-width: 4px;
        }

        .trace-control {
            display: flex;
            gap: 10px;
            align-items: center;
            width: 100%;
            justify-content: center;
            margin-top: 10px;
        }

        input[type="text"] {
            padding: 10px;
            border-radius: 10px;
            border: 2px solid #ccc;
            font-size: 16px;
            width: 300px;
        }
    </style>
</head>
<body>

    <h1>🎨 Kids Paint & Animate Studio ✨</h1>
    
    <div class="container">
        
        <!-- Tools -->
        <div class="toolbar">
            <div class="tool-group">
                <input type="color" id="color-picker" value="#000000">
                <label for="brush-size">Size:</label>
                <input type="range" id="brush-size" min="1" max="50" value="10">
            </div>
            
            <div class="tool-group">
                <button id="btn-draw" class="active-tool">✏️ Draw</button>
                <button id="btn-erase">🧽 Erase</button>
                <button id="btn-clear">🗑️ Clear Canvas</button>
            </div>

            <div class="tool-group">
                <button id="btn-onion">🧅 Onion Skin: OFF</button>
                <button id="btn-save-img">💾 Save Picture</button>
                <button id="btn-save-sprite">🎞️ Save Sprite Sheet</button>
            </div>
        </div>

        <div class="trace-control tool-group">
            <label><strong>Trace Mode:</strong></label>
            <input type="text" id="trace-url" placeholder="Paste image URL here...">
            <button id="btn-load-trace">Load Image</button>
            <button id="btn-clear-trace">Clear Trace</button>
        </div>

        <!-- Canvas Area -->
        <div class="canvas-container">
            <img id="trace-img" src="" alt="Trace Image">
            <canvas id="onion-canvas" width="800" height="600"></canvas>
            <canvas id="main-canvas" width="800" height="600"></canvas>
        </div>

        <!-- Animation Timeline -->
        <div class="animation-timeline" id="timeline">
            <button id="btn-play">▶️ Play</button>
            <button id="btn-stop" style="display:none;">⏹️ Stop</button>
            <button id="btn-add-frame">➕ Add Frame</button>
            <button id="btn-dup-frame">📋 Duplicate</button>
            <button id="btn-del-frame">❌ Delete</button>
            <div style="width: 2px; height: 40px; background: #ccc; margin: 0 10px;"></div>
            <div id="frames-container" style="display: flex; gap: 5px;">
                <!-- Frames go here -->
            </div>
        </div>

    </div>

    <script>
        const canvas = document.getElementById('main-canvas');
        const ctx = canvas.getContext('2d');
        const onionCanvas = document.getElementById('onion-canvas');
        const onionCtx = onionCanvas.getContext('2d');
        const traceImg = document.getElementById('trace-img');
        
        let isDrawing = false;
        let currentMode = 'draw'; // draw or erase
        let frames = [];
        let currentFrameIndex = 0;
        let isPlaying = false;
        let playInterval;
        let onionSkinEnabled = false;

        // Initialize first frame
        saveCurrentFrameToData();
        updateTimeline();

        // --- Drawing Logic ---
        function startPosition(e) {
            isDrawing = true;
            draw(e);
        }

        function endPosition() {
            if (isDrawing) {
                isDrawing = false;
                ctx.beginPath();
                saveCurrentFrameToData();
                updateTimelineThumbnail();
            }
        }

        function getMousePos(canvas, evt) {
            var rect = canvas.getBoundingClientRect();
            return {
                x: (evt.clientX - rect.left) / (rect.right - rect.left) * canvas.width,
                y: (evt.clientY - rect.top) / (rect.bottom - rect.top) * canvas.height
            };
        }

        function draw(e) {
            if (!isDrawing || isPlaying) return;

            const pos = getMousePos(canvas, e);
            const size = document.getElementById('brush-size').value;
            
            ctx.lineWidth = size;
            ctx.lineCap = 'round';

            if (currentMode === 'draw') {
                ctx.strokeStyle = document.getElementById('color-picker').value;
                ctx.globalCompositeOperation = 'source-over';
            } else if (currentMode === 'erase') {
                ctx.globalCompositeOperation = 'destination-out';
                ctx.strokeStyle = "rgba(0,0,0,1)";
            }

            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(pos.x, pos.y);
        }

        canvas.addEventListener('mousedown', startPosition);
        canvas.addEventListener('mouseup', endPosition);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseout', endPosition);

        // Touch support
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            const mouseEvent = new MouseEvent("mousedown", {
                clientX: touch.clientX,
                clientY: touch.clientY
            });
            canvas.dispatchEvent(mouseEvent);
        });
        canvas.addEventListener('touchend', (e) => {
            e.preventDefault();
            const mouseEvent = new MouseEvent("mouseup", {});
            canvas.dispatchEvent(mouseEvent);
        });
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            const mouseEvent = new MouseEvent("mousemove", {
                clientX: touch.clientX,
                clientY: touch.clientY
            });
            canvas.dispatchEvent(mouseEvent);
        });

        // --- Toolbar Logic ---
        document.getElementById('btn-draw').addEventListener('click', (e) => {
            currentMode = 'draw';
            document.getElementById('btn-draw').classList.add('active-tool');
            document.getElementById('btn-erase').classList.remove('active-tool');
        });

        document.getElementById('btn-erase').addEventListener('click', (e) => {
            currentMode = 'erase';
            document.getElementById('btn-erase').classList.add('active-tool');
            document.getElementById('btn-draw').classList.remove('active-tool');
        });

        document.getElementById('btn-clear').addEventListener('click', () => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            saveCurrentFrameToData();
            updateTimelineThumbnail();
        });

        // --- Tracing Logic ---
        document.getElementById('btn-load-trace').addEventListener('click', () => {
            const url = document.getElementById('trace-url').value;
            if (url) {
                traceImg.src = url;
                traceImg.style.display = 'block';
            }
        });

        document.getElementById('btn-clear-trace').addEventListener('click', () => {
            traceImg.src = '';
            traceImg.style.display = 'none';
            document.getElementById('trace-url').value = '';
        });

        // --- Animation Logic ---
        function saveCurrentFrameToData() {
            if (frames.length === 0) {
                frames.push(canvas.toDataURL());
            } else {
                frames[currentFrameIndex] = canvas.toDataURL();
            }
        }

        function loadFrame(index) {
            currentFrameIndex = index;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const img = new Image();
            img.onload = () => {
                ctx.drawImage(img, 0, 0);
                drawOnionSkin();
            };
            img.src = frames[index];
            updateTimelineSelection();
        }

        function drawOnionSkin() {
            onionCtx.clearRect(0, 0, onionCanvas.width, onionCanvas.height);
            if (onionSkinEnabled && currentFrameIndex > 0 && !isPlaying) {
                const img = new Image();
                img.onload = () => {
                    onionCtx.drawImage(img, 0, 0);
                };
                img.src = frames[currentFrameIndex - 1];
            }
        }

        document.getElementById('btn-add-frame').addEventListener('click', () => {
            frames.splice(currentFrameIndex + 1, 0, document.createElement('canvas').toDataURL());
            loadFrame(currentFrameIndex + 1);
            updateTimeline();
        });

        document.getElementById('btn-dup-frame').addEventListener('click', () => {
            frames.splice(currentFrameIndex + 1, 0, frames[currentFrameIndex]);
            loadFrame(currentFrameIndex + 1);
            updateTimeline();
        });

        document.getElementById('btn-del-frame').addEventListener('click', () => {
            if (frames.length > 1) {
                frames.splice(currentFrameIndex, 1);
                if (currentFrameIndex >= frames.length) {
                    currentFrameIndex = frames.length - 1;
                }
                loadFrame(currentFrameIndex);
                updateTimeline();
            } else {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                saveCurrentFrameToData();
                updateTimelineThumbnail();
            }
        });

        document.getElementById('btn-onion').addEventListener('click', (e) => {
            onionSkinEnabled = !onionSkinEnabled;
            e.target.textContent = onionSkinEnabled ? '🧅 Onion Skin: ON' : '🧅 Onion Skin: OFF';
            e.target.style.backgroundColor = onionSkinEnabled ? 'var(--dark)' : 'var(--primary)';
            drawOnionSkin();
        });

        document.getElementById('btn-play').addEventListener('click', () => {
            if (frames.length <= 1) return;
            isPlaying = true;
            document.getElementById('btn-play').style.display = 'none';
            document.getElementById('btn-stop').style.display = 'block';
            onionCtx.clearRect(0, 0, onionCanvas.width, onionCanvas.height); // hide onion during play
            
            let playIndex = 0;
            playInterval = setInterval(() => {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                const img = new Image();
                img.onload = () => ctx.drawImage(img, 0, 0);
                img.src = frames[playIndex];
                
                // Highlight timeline
                document.querySelectorAll('.frame').forEach((el, i) => {
                    el.classList.toggle('active', i === playIndex);
                });

                playIndex = (playIndex + 1) % frames.length;
            }, 200); // 5 FPS
        });

        document.getElementById('btn-stop').addEventListener('click', () => {
            isPlaying = false;
            clearInterval(playInterval);
            document.getElementById('btn-play').style.display = 'block';
            document.getElementById('btn-stop').style.display = 'none';
            loadFrame(currentFrameIndex); // restore working frame
        });

        // --- Timeline UI ---
        function updateTimeline() {
            const container = document.getElementById('frames-container');
            container.innerHTML = '';
            frames.forEach((frameData, index) => {
                const f = document.createElement('div');
                f.className = 'frame';
                f.style.backgroundImage = `url(${frameData})`;
                if (index === currentFrameIndex) f.classList.add('active');
                f.addEventListener('click', () => loadFrame(index));
                container.appendChild(f);
            });
        }

        function updateTimelineThumbnail() {
            const container = document.getElementById('frames-container');
            const activeFrame = container.children[currentFrameIndex];
            if (activeFrame) {
                activeFrame.style.backgroundImage = `url(${frames[currentFrameIndex]})`;
            }
        }

        function updateTimelineSelection() {
            const container = document.getElementById('frames-container');
            Array.from(container.children).forEach((f, i) => {
                f.classList.toggle('active', i === currentFrameIndex);
            });
        }

        // --- Saving Logic ---
        document.getElementById('btn-save-img').addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = 'my-masterpiece.png';
            link.href = canvas.toDataURL();
            link.click();
        });

        document.getElementById('btn-save-sprite').addEventListener('click', () => {
            if (frames.length === 0) return;
            // Create a wide canvas to put all frames side-by-side
            const spriteCanvas = document.createElement('canvas');
            spriteCanvas.width = canvas.width * frames.length;
            spriteCanvas.height = canvas.height;
            const sCtx = spriteCanvas.getContext('2d');
            
            let loaded = 0;
            frames.forEach((frameData, index) => {
                const img = new Image();
                img.onload = () => {
                    sCtx.drawImage(img, index * canvas.width, 0);
                    loaded++;
                    if (loaded === frames.length) {
                        const link = document.createElement('a');
                        link.download = 'my-animation-spritesheet.png';
                        link.href = spriteCanvas.toDataURL();
                        link.click();
                    }
                };
                img.src = frameData;
            });
        });

    </script>
</body>
</html>
