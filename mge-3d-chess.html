<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmic Chess - Mr. Gonzalez Experiments</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&family=Orbitron:wght@400;700;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            color: #fff;
            font-family: 'Outfit', sans-serif;
            overflow: hidden;
            height: 100vh;
        }

        #game-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .header {
            position: fixed;
            top: 0;
            width: 100%;
            height: 80px;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
            font-weight: 900;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 1000;
            text-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
            letter-spacing: 5px;
            font-family: 'Orbitron', sans-serif;
        }

        .ui-panel {
            position: fixed;
            top: 100px;
            right: 20px;
            width: 280px;
            background: rgba(10, 10, 30, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 255, 255, 0.3);
            padding: 20px;
            z-index: 10;
            border-radius: 15px;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.1);
        }

        .status-panel {
            position: fixed;
            top: 100px;
            left: 20px;
            padding: 15px 25px;
            background: rgba(10, 10, 30, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 0, 255, 0.3);
            border-radius: 50px;
            z-index: 10;
            font-weight: 700;
            font-family: 'Orbitron', sans-serif;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .turn-indicator {
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 0 10px #fff;
        }

        .turn-white .turn-indicator { background: #fff; box-shadow: 0 0 15px #fff; }
        .turn-black .turn-indicator { background: #f0f; box-shadow: 0 0 15px #f0f; }

        .status-footer {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            z-index: 1000;
        }

        .btn {
            background: rgba(0, 0, 0, 0.5);
            color: #fff;
            padding: 10px 25px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            transition: all 0.3s ease;
            cursor: pointer;
            backdrop-filter: blur(5px);
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: #0ff;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
        }

        #move-history {
            height: 200px;
            overflow-y: auto;
            margin-top: 15px;
            font-family: monospace;
            font-size: 0.8rem;
            color: #0ff;
            padding: 10px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
        }

        #move-history::-webkit-scrollbar {
            width: 5px;
        }

        #move-history::-webkit-scrollbar-thumb {
            background: #0ff;
            border-radius: 5px;
        }

        .selection-hint {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            color: #0ff;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            pointer-events: none;
            z-index: 10;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
        }

        .crt-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.05) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.02), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.02));
            background-size: 100% 4px, 3px 100%;
            pointer-events: none;
            z-index: 2000;
        }

        #winner-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 5000;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        #winner-text {
            font-size: 5rem;
            color: #0ff;
            font-family: 'Orbitron', sans-serif;
            margin-bottom: 20px;
            text-shadow: 0 0 50px #0ff;
        }

        .controls-info {
            position: fixed;
            bottom: 20px;
            right: 20px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.8rem;
            text-align: right;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div class="header">COSMIC CHESS</div>
    <div class="crt-overlay"></div>

    <div id="game-container"></div>

    <div class="status-panel" id="turn-panel">
        <div class="turn-indicator"></div>
        <span id="turn-text">WHITE'S TURN</span>
    </div>

    <div class="ui-panel">
        <h2 style="font-size: 0.9rem; letter-spacing: 2px; color: #0ff; margin-bottom: 15px;">TRANSCOSMIC LOG</h2>
        <div id="move-history">
            <div>--- SYSTEM READY ---</div>
        </div>
    </div>

    <div class="selection-hint" id="status-message">Select a piece to begin</div>

    <div class="status-footer">
        <button class="btn" onclick="resetGame()">REINITIALIZE BOARD</button>
        <a href="mge.html" class="btn">EXIT TO HUB</a>
    </div>

    <!-- Premium Liquid Controls Overlay -->
    <div id="controls-overlay-premium" style="position: fixed; bottom: 30px; right: 30px; display: flex; flex-direction: column; gap: 8px; pointer-events: none; z-index: 200; font-family: 'Outfit', sans-serif;">
        <style>
            .liquid-key {
                width: 48px; height: 48px; background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(15px);
                border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 14px;
                display: flex; justify-content: center; align-items: center;
                font-weight: 900; font-size: 1rem; color: rgba(255, 255, 255, 0.4);
                transition: all 0.15s cubic-bezier(0.23, 1, 0.32, 1);
                box-shadow: 0 4px 15px rgba(0,0,0,0.2), inset 0 0 0 1px rgba(255,255,255,0.05);
                position: relative; overflow: hidden;
            }
            .liquid-key.active {
                color: #fff; transform: scale(0.92) translateY(3px);
                background: rgba(255, 255, 255, 0.15); border-color: rgba(255, 255, 255, 0.5);
                box-shadow: 0 0 30px rgba(255, 255, 255, 0.15), inset 0 0 15px rgba(255, 255, 255, 0.1);
            }
            .control-row { display: flex; gap: 8px; justify-content: flex-end; }
            .liquid-key.wide { width: 140px; font-size: 0.7rem; letter-spacing: 1px; }
        </style>
        <div class="control-row">
            <div class="liquid-key wide">🖱️ L-CLICK: SELECT</div>
        </div>
        <div class="control-row">
            <div class="liquid-key wide">🖱️ R-CLICK: ORBIT</div>
        </div>
        <div class="control-row">
            <div class="liquid-key wide">🖱️ SCROLL: ZOOM</div>
        </div>
    </div>

    <div id="winner-screen">
        <div id="winner-text">CHECKMATE</div>
        <div style="color: #fff; margin-bottom: 40px; font-size: 1.5rem;">The galaxy has been conquered.</div>
        <button class="btn" onclick="resetGame()" style="padding: 15px 40px; font-size: 1.2rem;">PLAY AGAIN</button>
    </div>

    <script>
        // --- CHESS LOGIC ---
        const game = new Chess();
        
        // --- 3D ENVIRONMENT ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.getElementById('game-container').appendChild(renderer.domElement);

        // Random Cosmic Theme
        const themeHue = Math.random();
        const bgColor = new THREE.Color().setHSL(themeHue, 0.4, 0.02);
        scene.background = bgColor;
        scene.fog = new THREE.FogExp2(bgColor, 0.001);
        document.body.style.backgroundColor = `#${bgColor.getHexString()}`;

        const accent1 = new THREE.Color().setHSL((themeHue + 0.5) % 1, 1, 0.6);
        const accent2 = new THREE.Color().setHSL((themeHue + 0.8) % 1, 1, 0.6);

        // Lights
        const ambientLight = new THREE.AmbientLight(0x404040, 1.5);
        scene.add(ambientLight);

        const mainLight = new THREE.PointLight(accent1, 2, 100);
        mainLight.position.set(10, 20, 10);
        mainLight.castShadow = true;
        scene.add(mainLight);

        const subLight = new THREE.PointLight(accent2, 1.5, 100);
        subLight.position.set(-10, 20, -10);
        scene.add(subLight);

        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x000000, 0.5);
        scene.add(hemiLight);

        // --- DECORATIVE INSANE BACKGROUND ---
        const backgroundGroup = new THREE.Group();
        scene.add(backgroundGroup);

        function createDebris() {
            const geometries = [
                new THREE.IcosahedronGeometry(Math.random() * 2, 0),
                new THREE.TorusGeometry(Math.random() * 2, 0.2, 8, 16),
                new THREE.OctahedronGeometry(Math.random() * 1.5, 0),
                new THREE.BoxGeometry(0.5, 0.5, 0.5)
            ];

            for (let i = 0; i < 60; i++) {
                const geo = geometries[Math.floor(Math.random() * geometries.length)];
                const mat = new THREE.MeshStandardMaterial({
                    color: Math.random() > 0.5 ? accent1 : accent2,
                    emissive: Math.random() > 0.5 ? accent1 : accent2,
                    emissiveIntensity: 0.5,
                    wireframe: Math.random() > 0.7
                });
                const mesh = new THREE.Mesh(geo, mat);
                
                const r = 50 + Math.random() * 200;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.random() * Math.PI;
                
                mesh.position.set(
                    r * Math.sin(phi) * Math.cos(theta),
                    r * Math.sin(phi) * Math.sin(theta),
                    r * Math.cos(phi)
                );
                
                mesh.userData.rotationSpeed = {
                    x: (Math.random() - 0.5) * 0.02,
                    y: (Math.random() - 0.5) * 0.02,
                    z: (Math.random() - 0.5) * 0.02
                };
                
                mesh.userData.orbitSpeed = (Math.random() - 0.5) * 0.005;
                
                backgroundGroup.add(mesh);
            }
        }
        createDebris();

        // Stars
        const starsGeo = new THREE.BufferGeometry();
        const starsCount = 5000;
        const posArray = new Float32Array(starsCount * 3);
        for(let i=0; i < starsCount * 3; i++) {
            posArray[i] = (Math.random() - 0.5) * 1000;
        }
        starsGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const starsMat = new THREE.PointsMaterial({ size: 0.5, color: 0xffffff });
        const stars = new THREE.Points(starsGeo, starsMat);
        scene.add(stars);

        // --- BOARD ---
        const boardSize = 8;
        const squareSize = 2;
        const boardSquares = [];
        const piecesGroup = new THREE.Group();
        const squaresGroup = new THREE.Group();
        scene.add(squaresGroup);
        scene.add(piecesGroup);

        const squareGeo = new THREE.BoxGeometry(squareSize, 0.4, squareSize);

        for (let i = 0; i < boardSize; i++) {
            for (let j = 0; j < boardSize; j++) {
                const isBlack = (i + j) % 2 === 1;
                const mat = new THREE.MeshStandardMaterial({
                    color: isBlack ? 0x111111 : 0x444444,
                    emissive: isBlack ? 0x110011 : 0x001111,
                    emissiveIntensity: 0.2,
                    metalness: 0.8,
                    roughness: 0.2
                });
                const square = new THREE.Mesh(squareGeo, mat);
                square.position.set(i * squareSize - 7, -0.2, j * squareSize - 7);
                square.userData = { i, j, rank: 8 - j, file: String.fromCharCode(97 + i) };
                square.receiveShadow = true;
                squaresGroup.add(square);
                boardSquares.push(square);
            }
        }

        // Board Frame
        const frameGeo = new THREE.BoxGeometry(16.5, 0.2, 16.5);
        const frameMat = new THREE.MeshStandardMaterial({ color: accent1, wireframe: true });
        const frame = new THREE.Mesh(frameGeo, frameMat);
        frame.position.y = -0.4;
        scene.add(frame);

        // --- PIECES ---
        const pieces = new Map(); // file+rank -> mesh

        function getPieceGeometry(type) {
            switch(type) {
                case 'p': return new THREE.ConeGeometry(0.4, 0.8, 8);
                case 'r': return new THREE.BoxGeometry(0.7, 1.2, 0.7);
                case 'n': return new THREE.IcosahedronGeometry(0.6, 0);
                case 'b': return new THREE.CylinderGeometry(0, 0.5, 1.1, 4);
                case 'q': return new THREE.TorusKnotGeometry(0.4, 0.15, 64, 8);
                case 'k': return new THREE.SphereGeometry(0.6, 16, 16);
            }
        }

        function createPieceMesh(p, i, j) {
            const geo = getPieceGeometry(p.type);
            const isWhite = p.color === 'w';
            const mat = new THREE.MeshStandardMaterial({
                color: isWhite ? 0xffffff : 0x333333,
                emissive: isWhite ? accent1 : accent2,
                emissiveIntensity: 0.8,
                metalness: 0.9,
                roughness: 0.1
            });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(i * squareSize - 7, 0.5, j * squareSize - 7);
            mesh.castShadow = true;
            mesh.userData = { i, j, color: p.color, type: p.type, pos: String.fromCharCode(97 + i) + (8 - j) };
            
            // Add a small light to important pieces
            if (p.type === 'k' || p.type === 'q') {
                const pLight = new THREE.PointLight(isWhite ? accent1 : accent2, 0.5, 3);
                mesh.add(pLight);
            }

            return mesh;
        }

        function updateBoard() {
            // Clear existing pieces
            while(piecesGroup.children.length > 0) {
                piecesGroup.remove(piecesGroup.children[0]);
            }
            pieces.clear();

            const board = game.board();
            for (let j = 0; j < 8; j++) {
                for (let i = 0; i < 8; i++) {
                    const p = board[j][i];
                    if (p) {
                        const mesh = createPieceMesh(p, i, j);
                        piecesGroup.add(mesh);
                        pieces.set(mesh.userData.pos, mesh);
                    }
                }
            }
            
            // Update UI
            const turnText = document.getElementById('turn-text');
            const turnPanel = document.getElementById('turn-panel');
            if (game.turn() === 'w') {
                turnText.innerText = "WHITE'S TURN";
                turnPanel.className = 'status-panel turn-white';
            } else {
                turnText.innerText = "BLACK'S TURN";
                turnPanel.className = 'status-panel turn-black';
            }

            if (game.in_checkmate()) {
                document.getElementById('winner-screen').style.display = 'flex';
                document.getElementById('winner-text').innerText = (game.turn() === 'w' ? 'BLACK' : 'WHITE') + ' WINS';
            } else if (game.in_draw()) {
                document.getElementById('winner-screen').style.display = 'flex';
                document.getElementById('winner-text').innerText = 'DRAW';
            }
        }

        updateBoard();

        // --- INTERACTION ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let selectedPiece = null;
        let legalMoves = [];

        // Camera Controls
        let isOrbiting = false;
        let prevMouseX = 0;
        let prevMouseY = 0;
        let camPhi = Math.PI / 4;
        let camTheta = 0;
        let camRadius = 30;

        function updateCamera() {
            camera.position.x = camRadius * Math.sin(camPhi) * Math.sin(camTheta);
            camera.position.y = camRadius * Math.cos(camPhi);
            camera.position.z = camRadius * Math.sin(camPhi) * Math.cos(camTheta + Math.PI/2);
            camera.lookAt(0, 0, 0);
        }
        updateCamera();

        window.addEventListener('mousedown', (e) => {
            if (e.button === 2) {
                isOrbiting = true;
                prevMouseX = e.clientX;
                prevMouseY = e.clientY;
            } else if (e.button === 0) {
                handleMouseClick(e);
            }
        });

        window.addEventListener('mouseup', () => isOrbiting = false);
        window.addEventListener('contextmenu', (e) => e.preventDefault());

        window.addEventListener('mousemove', (e) => {
            if (isOrbiting) {
                const dx = e.clientX - prevMouseX;
                const dy = e.clientY - prevMouseY;
                camTheta -= dx * 0.01;
                camPhi = Math.max(0.1, Math.min(Math.PI / 2 - 0.1, camPhi - dy * 0.01));
                prevMouseX = e.clientX;
                prevMouseY = e.clientY;
                updateCamera();
            }
        });

        window.addEventListener('wheel', (e) => {
            camRadius = Math.max(10, Math.min(60, camRadius + e.deltaY * 0.05));
            updateCamera();
        });

        function handleMouseClick(e) {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);

            // Check pieces first
            const pieceIntersects = raycaster.intersectObjects(piecesGroup.children);
            if (pieceIntersects.length > 0) {
                const piece = pieceIntersects[0].object;
                if (piece.userData.color === game.turn()) {
                    selectPiece(piece);
                    return;
                }
            }

            // Check squares
            const squareIntersects = raycaster.intersectObjects(squaresGroup.children);
            if (squareIntersects.length > 0 && selectedPiece) {
                const square = squareIntersects[0].object;
                const targetPos = square.userData.file + square.userData.rank;
                attemptMove(selectedPiece.userData.pos, targetPos);
            } else {
                deselectPiece();
            }
        }

        function selectPiece(piece) {
            deselectPiece();
            selectedPiece = piece;
            piece.material.emissiveIntensity = 2;
            piece.scale.set(1.2, 1.2, 1.2);
            
            legalMoves = game.moves({ square: piece.userData.pos, verbose: true });
            
            // Highlight squares
            boardSquares.forEach(s => {
                const move = legalMoves.find(m => m.to === (s.userData.file + s.userData.rank));
                if (move) {
                    s.material.emissive.setHex(0x00ff00);
                    s.material.emissiveIntensity = 0.5;
                }
            });

            document.getElementById('status-message').innerText = "Select target destination for " + piece.userData.type.toUpperCase();
        }

        function deselectPiece() {
            if (selectedPiece) {
                selectedPiece.material.emissiveIntensity = 0.8;
                selectedPiece.scale.set(1, 1, 1);
            }
            selectedPiece = null;
            legalMoves = [];
            
            boardSquares.forEach(s => {
                const isBlack = (s.userData.i + s.userData.j) % 2 === 1;
                s.material.emissive.setHex(isBlack ? 0x110011 : 0x001111);
                s.material.emissiveIntensity = 0.2;
            });

            document.getElementById('status-message').innerText = "Select a piece to begin";
        }

        function attemptMove(from, to) {
            const move = game.move({ from, to, promotion: 'q' });
            if (move) {
                addMoveToHistory(move);
                updateBoard();
                deselectPiece();
            } else {
                deselectPiece();
            }
        }

        function addMoveToHistory(move) {
            const hist = document.getElementById('move-history');
            const entry = document.createElement('div');
            entry.innerText = `> ${move.color === 'w' ? 'WHITE' : 'BLACK'}: ${move.san}`;
            hist.prepend(entry);
        }

        function resetGame() {
            game.reset();
            updateBoard();
            deselectPiece();
            document.getElementById('move-history').innerHTML = '<div>--- SYSTEM REINITIALIZED ---</div>';
            document.getElementById('winner-screen').style.display = 'none';
        }

        // --- ANIMATION ---
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            const time = clock.getElapsedTime();

            // Background movement
            backgroundGroup.rotation.y += 0.001;
            backgroundGroup.children.forEach(mesh => {
                mesh.rotation.x += mesh.userData.rotationSpeed.x;
                mesh.rotation.y += mesh.userData.rotationSpeed.y;
                mesh.rotation.z += mesh.userData.rotationSpeed.z;
                
                // Pulsing emissive
                mesh.material.emissiveIntensity = 0.5 + Math.sin(time * 2 + mesh.position.x) * 0.3;
            });

            // Pulse pieces
            piecesGroup.children.forEach((p, i) => {
                if (p === selectedPiece) {
                    p.rotation.y += 0.05;
                    p.position.y = 0.8 + Math.sin(time * 5) * 0.1;
                } else {
                    p.rotation.y += 0.01;
                    p.position.y = 0.5 + Math.sin(time * 2 + i) * 0.05;
                }
            });

            // Animate main lights
            mainLight.position.x = 15 * Math.sin(time * 0.5);
            subLight.position.x = 15 * Math.sin(time * 0.5 + Math.PI);

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

    </script>
</body>
</html>
