<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MGE 2D Worms - Ultimate Edition</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        canvas { display: block; }
        
        /* Lobby Overlay */
        #lobby { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; pointer-events: auto; }
        #lobby h1 { font-size: 6rem; margin: 0 0 10px 0; color: #ffeb3b; text-shadow: 4px 4px 0 #d32f2f, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000; }
        #lobby h3 { margin: 0 0 30px 0; font-size: 2rem; color: #ddd; }
        .lobby-panel { background: rgba(255,255,255,0.1); padding: 30px 50px; border-radius: 15px; border: 2px solid white; display: flex; gap: 60px; margin-bottom: 40px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        .team-setup { text-align: center; }
        .team-setup h2 { margin-top: 0; font-size: 2.5rem; text-shadow: 2px 2px 0 #000; }
        .worm-count { font-size: 3rem; margin: 15px 0; font-weight: 900; }
        .lobby-btn { background: #4CAF50; color: white; border: none; padding: 10px 20px; font-size: 1.5rem; cursor: pointer; border-radius: 8px; border: 2px solid white; font-weight: bold; width: 60px; margin: 0 10px; }
        .lobby-btn:hover { background: #45a049; transform: scale(1.1); }
        .start-btn { background: #f44336; color: white; font-size: 2.5rem; padding: 15px 60px; border: 4px solid white; border-radius: 15px; font-weight: 900; cursor: pointer; animation: pulse 1s infinite; letter-spacing: 2px; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); box-shadow: 0 0 20px #f44336; } 100% { transform: scale(1); } }
        
        /* In-game UI */
        .ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; display: none; }
        
        .top-bar { display: flex; justify-content: center; gap: 40px; padding: 20px; background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent); }
        .team-info { display: flex; flex-direction: column; align-items: center; }
        .team-name { font-size: 2rem; font-weight: 900; text-transform: uppercase; text-shadow: 2px 2px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000; letter-spacing: 2px; }
        .team-health-bg { width: 300px; height: 25px; background: rgba(0,0,0,0.8); border: 3px solid #fff; border-radius: 12px; overflow: hidden; margin-top: 5px; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        .team-health-bar { height: 100%; transition: width 0.3s; box-shadow: inset 0 2px 5px rgba(255,255,255,0.5); }
        
        .controls-panel { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.9); border: 3px solid #ffeb3b; padding: 15px 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.6); pointer-events: auto; display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .controls-text { color: white; font-weight: 900; font-size: 1.2rem; text-transform: uppercase; letter-spacing: 1px; text-shadow: 1px 1px 0 #000; text-align: center; }
        
        .weapon-icon-display { position: absolute; top: 25%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.8); border: 4px solid #ffeb3b; color: white; font-size: 3rem; font-weight: 900; padding: 20px 40px; border-radius: 20px; display: none; z-index: 50; text-shadow: 3px 3px 0 #000; text-transform: uppercase; }
        
        .turn-announcer { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 5rem; color: #ffeb3b; text-shadow: 4px 4px 0 #d32f2f, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000; font-weight: 900; text-align: center; display: none; z-index: 10; animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); white-space: nowrap; }
        @keyframes popIn { 0% { transform: translate(-50%, -50%) scale(0); } 100% { transform: translate(-50%, -50%) scale(1); } }
        
        .power-bar-container { position: absolute; bottom: 120px; left: 50%; transform: translateX(-50%); width: 400px; height: 30px; background: rgba(0,0,0,0.8); border: 3px solid white; border-radius: 15px; overflow: hidden; display: none; }
        .power-bar { height: 100%; width: 0%; background: linear-gradient(to right, #4CAF50, #FFEB3B, #F44336); }
        
        .wind-indicator { position: absolute; top: 20px; right: 20px; background: rgba(0,0,0,0.8); padding: 10px 20px; border-radius: 12px; color: white; font-weight: 900; font-size: 1.5rem; border: 2px solid white; display: flex; align-items: center; gap: 15px; text-shadow: 2px 2px 0 #000; }
        .wind-arrow { width: 0; height: 0; border-top: 15px solid transparent; border-bottom: 15px solid transparent; border-left: 30px solid #2196f3; transition: transform 0.5s; filter: drop-shadow(2px 2px 0px #000); }

        .worm-label { position: absolute; text-align: center; font-weight: 900; font-size: 1.1rem; color: white; text-shadow: 2px 2px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000; pointer-events: none; z-index: 5; margin-top: -20px; }
        
        .popup-text { position: absolute; color: #ffeb3b; font-size: 3rem; font-weight: 900; text-shadow: 3px 3px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000; pointer-events: none; animation: floatUp 2s cubic-bezier(0.215, 0.61, 0.355, 1) forwards; z-index: 20; text-align: center; }
        @keyframes floatUp { 0% { opacity: 1; transform: translateY(0) scale(0.5); } 20% { transform: translateY(-20px) scale(1.2); } 100% { opacity: 0; transform: translateY(-100px) scale(1); } }

        .back-btn { position: absolute; top: 15px; left: 15px; z-index: 100; pointer-events: auto; padding: 10px 25px; background: linear-gradient(to bottom, #4CAF50, #2E7D32); color: white; text-decoration: none; border-radius: 30px; font-weight: bold; font-size: 1.2rem; border: 3px solid white; transition: 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.4); text-transform: uppercase; letter-spacing: 1px; }
        .back-btn:hover { background: linear-gradient(to bottom, #66BB6A, #388E3C); transform: scale(1.05); }

    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/math/ImprovedNoise.js"></script>
</head>
<body>
    <a href="mge.html" class="back-btn">⬅ Hub</a>
    
    <div id="lobby">
        <h1>MGE WORMS</h1>
        <h3>Ultimate Artillery Edition</h3>
        <div class="lobby-panel">
            <div class="team-setup">
                <h2 style="color: #ff3366;">TEAM PINK</h2>
                <div>
                    <button class="lobby-btn" onclick="adjWorms(0, -1)">-</button>
                    <span class="worm-count" id="count-0">3</span>
                    <button class="lobby-btn" onclick="adjWorms(0, 1)">+</button>
                </div>
            </div>
            <div class="team-setup">
                <h2 style="color: #33ff33;">TEAM LIME</h2>
                <div>
                    <button class="lobby-btn" onclick="adjWorms(1, -1)">-</button>
                    <span class="worm-count" id="count-1">3</span>
                    <button class="lobby-btn" onclick="adjWorms(1, 1)">+</button>
                </div>
            </div>
        </div>
        <button class="start-btn" onclick="startGame()">BATTLE!</button>
    </div>
    
    <div id="canvas-container"></div>
    
    <div class="ui-layer" id="game-ui">
        <div class="top-bar">
            <div class="team-info">
                <div class="team-name" style="color: #ff3366;">TEAM PINK</div>
                <div class="team-health-bg"><div class="team-health-bar" id="t0-health" style="background: #ff3366; width: 100%;"></div></div>
            </div>
            <div class="team-info">
                <div class="team-name" style="color: #33ff33;">TEAM LIME</div>
                <div class="team-health-bg"><div class="team-health-bar" id="t1-health" style="background: #33ff33; width: 100%;"></div></div>
            </div>
        </div>
        
        <div class="wind-indicator">WIND <div class="wind-arrow" id="wind-arrow"></div> <span id="wind-text">0</span></div>
        
        <div class="turn-announcer" id="turnAnnouncer"></div>
        <div class="power-bar-container" id="power-container"><div class="power-bar" id="power-bar"></div></div>
        
        <div class="weapon-icon-display" id="weapon-display">💣 BAZOOKA</div>
        
        <div id="labels-container"></div>
        
        <div class="controls-panel">
            <div class="controls-text">
                [LEFT/RIGHT] Crawl &nbsp;|&nbsp; [MOUSE] Aim &nbsp;|&nbsp; [SCROLL] Switch Weapon &nbsp;|&nbsp; [SPACE/CLICK] Hold to Fire &nbsp;|&nbsp; [SHIFT] Jump
            </div>
        </div>
    </div>
    
    <script>
        // --- GLOBALS & STATE ---
        const GRAVITY = -30;
        const TERRAIN_W = 2000;
        const TERRAIN_H = 1000;
        const SCALE = 10;
        const SCENE_W = TERRAIN_W / SCALE;
        const SCENE_H = TERRAIN_H / SCALE;
        
        const collisionMap = new Uint8Array(TERRAIN_W * TERRAIN_H);
        
        const state = {
            gameStarted: false,
            activeTeamIdx: 0,
            phase: 'aiming', // aiming, powering, firing, resolving, gameover
            wind: (Math.random() - 0.5) * 20,
            power: 0,
            maxPower: 50,
            activeProjectile: null
        };

        const weapons = [
            { id: 'bazooka', name: '💣 Bazooka', radius: 10, damage: 30, color: 0x555555, bounce: 0, delay: 0 },
            { id: 'grenade', name: '👑 Holy Hand Grenade', radius: 18, damage: 50, color: 0xffd700, bounce: 0.6, delay: 3 },
            { id: 'chicken', name: '🐔 Rubber Chicken', radius: 12, damage: 25, color: 0xffff00, bounce: 0.8, delay: 0 } 
        ];

        let teams = [
            { name: 'TEAM PINK', colorHex: 0xff3366, colorStr: '#ff3366', requestedCount: 3, totalHealth: 0, activeWormIdx: 0, worms: [] },
            { name: 'TEAM LIME', colorHex: 0x33ff33, colorStr: '#33ff33', requestedCount: 3, totalHealth: 0, activeWormIdx: 0, worms: [] }
        ];

        let allWorms = [];
        
        let weaponTimer = null;

        // --- LOBBY LOGIC ---
        function adjWorms(teamIdx, amount) {
            let val = teams[teamIdx].requestedCount + amount;
            if(val < 1) val = 1;
            if(val > 8) val = 8;
            teams[teamIdx].requestedCount = val;
            document.getElementById(`count-${teamIdx}`).innerText = val;
        }

        function startGame() {
            document.getElementById('lobby').style.display = 'none';
            document.getElementById('game-ui').style.display = 'block';
            
            // Spawn worms
            teams.forEach((t, tIdx) => {
                for(let i=0; i<t.requestedCount; i++) {
                    const worm = {
                        team: t,
                        name: `${t.name.split(' ')[1]} ${i+1}`,
                        health: 100,
                        pos: new THREE.Vector3((Math.random()-0.5)*SCENE_W*0.8, 40, 0),
                        vel: new THREE.Vector3(),
                        aimAngle: tIdx === 0 ? Math.PI/4 : Math.PI*3/4,
                        weaponIdx: 0,
                        mesh: createWormSprite(t.colorHex, t.colorStr)
                    };
                    t.worms.push(worm);
                    allWorms.push(worm);
                    scene.add(worm.mesh);
                }
                t.totalHealth = t.worms.length * 100;
            });
            
            state.gameStarted = true;
            announceTurn();
        }

        // --- THREE.JS SETUP ---
        const container = document.getElementById('canvas-container');
        const renderer = new THREE.WebGLRenderer({ antialias: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a3a);
        
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 120);

        // --- TERRAIN GENERATION ---
        const tCanvas = document.createElement('canvas');
        tCanvas.width = TERRAIN_W; tCanvas.height = TERRAIN_H;
        const tCtx = tCanvas.getContext('2d');
        const imgData = tCtx.createImageData(TERRAIN_W, TERRAIN_H);
        const data = imgData.data;

        const perlin = new THREE.ImprovedNoise();
        for(let y=0; y<TERRAIN_H; y++) {
            for(let x=0; x<TERRAIN_W; x++) {
                const invY = TERRAIN_H - 1 - y;
                let val = perlin.noise(x/250, invY/250, 0) + 0.5;
                let threshold = 0.45;
                if(invY < 200) threshold -= (200 - invY)*0.005;
                if(invY > 600) threshold += (invY - 600)*0.002;
                
                let hole = perlin.noise(x/50, invY/50, 100) > 0.35;
                if(val > threshold && !hole && invY > 80) {
                    const idx = (y * TERRAIN_W + x) * 4;
                    const depth = perlin.noise(x/15, invY/15, 50);
                    const colorBase = 220 + depth * 35;
                    data[idx] = Math.min(255, colorBase + 30);
                    data[idx+1] = Math.min(255, colorBase - 20);
                    data[idx+2] = Math.max(0, colorBase - 150);
                    data[idx+3] = 255;
                    collisionMap[invY * TERRAIN_W + x] = 1;
                }
            }
        }
        tCtx.putImageData(imgData, 0, 0);

        const terrainTex = new THREE.CanvasTexture(tCanvas);
        terrainTex.minFilter = THREE.NearestFilter; terrainTex.magFilter = THREE.NearestFilter;
        const terrainMat = new THREE.MeshBasicMaterial({ map: terrainTex, transparent: true, depthWrite: false });
        const terrainMesh = new THREE.Mesh(new THREE.PlaneGeometry(SCENE_W, SCENE_H), terrainMat);
        scene.add(terrainMesh);

        const waterGeo = new THREE.PlaneGeometry(SCENE_W * 2, 20);
        const waterMat = new THREE.MeshBasicMaterial({ color: 0x3a8dff, transparent: true, opacity: 0.8 });
        const water = new THREE.Mesh(waterGeo, waterMat);
        water.position.y = -SCENE_H/2 + 8; water.position.z = 1;
        scene.add(water);
        
        const starGeo = new THREE.BufferGeometry();
        const starPos = new Float32Array(300 * 3);
        for(let i=0; i<300; i++) {
            starPos[i*3] = (Math.random() - 0.5) * SCENE_W * 1.5;
            starPos[i*3+1] = (Math.random() - 0.5) * SCENE_H * 1.5 + 20;
            starPos[i*3+2] = -50;
        }
        starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.5 })));

        // --- WORMS ---
        function createWormSprite(colorHex, colorStr) {
            const group = new THREE.Group();
            const canvas = document.createElement('canvas');
            canvas.width = 128; canvas.height = 128;
            const ctx = canvas.getContext('2d');
            
            ctx.fillStyle = colorStr;
            ctx.beginPath(); ctx.arc(64, 100, 25, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(64, 70, 22, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(64, 40, 20, 0, Math.PI * 2); ctx.fill();
            
            ctx.fillStyle = 'white';
            ctx.beginPath(); ctx.arc(56, 35, 6, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(72, 35, 6, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = 'black';
            ctx.beginPath(); ctx.arc(56, 35, 2.5, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(72, 35, 2.5, 0, Math.PI*2); ctx.fill();
            
            ctx.strokeStyle = 'black'; ctx.lineWidth = 3;
            ctx.beginPath(); ctx.arc(64, 48, 6, 0, Math.PI, false); ctx.stroke();
            
            ctx.fillStyle = '#4a5d23';
            ctx.beginPath(); ctx.arc(64, 32, 22, Math.PI, 0, false); ctx.fill();
            ctx.fillStyle = '#3a4d13';
            ctx.fillRect(42, 30, 44, 4);

            const tex = new THREE.CanvasTexture(canvas);
            const mat = new THREE.SpriteMaterial({ map: tex });
            const sprite = new THREE.Sprite(mat);
            sprite.scale.set(4, 4, 1);
            sprite.position.y = 1.5;
            group.add(sprite);
            group.sprite = sprite;
            
            const crosshair = new THREE.Group();
            const chMat = new THREE.MeshBasicMaterial({ color: colorHex });
            const p1 = new THREE.Mesh(new THREE.PlaneGeometry(0.8, 0.2), chMat); p1.position.x = 2; crosshair.add(p1);
            const p2 = new THREE.Mesh(new THREE.PlaneGeometry(0.2, 0.8), chMat); p2.position.x = 2; crosshair.add(p2);
            crosshair.position.y = 1.5; crosshair.position.z = 0.1;
            group.add(crosshair);
            group.crosshair = crosshair;

            return group;
        }

        // Trajectory preview
        const trajGeo = new THREE.BufferGeometry();
        const trajPos = new Float32Array(50 * 3);
        trajGeo.setAttribute('position', new THREE.BufferAttribute(trajPos, 3));
        const trajPoints = new THREE.Points(trajGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.8 }));
        scene.add(trajPoints);

        // --- PHYSICS & COLLISION ---
        function isSolid(wx, wy) {
            const cx = Math.floor((wx + SCENE_W/2) * SCALE);
            const cy = Math.floor((wy + SCENE_H/2) * SCALE);
            if(cx < 0 || cx >= TERRAIN_W || cy < 0 || cy >= TERRAIN_H) return false;
            return collisionMap[cy * TERRAIN_W + cx] === 1;
        }

        function destroyTerrain(wx, wy, radiusUnits) {
            const pr = radiusUnits * SCALE;
            const cx = Math.floor((wx + SCENE_W/2) * SCALE);
            const cy = Math.floor((wy + SCENE_H/2) * SCALE);
            
            tCtx.globalCompositeOperation = 'destination-out';
            tCtx.beginPath();
            tCtx.arc(cx, TERRAIN_H - cy, pr, 0, Math.PI*2);
            tCtx.fill();
            tCtx.globalCompositeOperation = 'source-over';
            terrainTex.needsUpdate = true;
            
            for(let y = cy - pr; y <= cy + pr; y++) {
                for(let x = cx - pr; x <= cx + pr; x++) {
                    if(x>=0 && x<TERRAIN_W && y>=0 && y<TERRAIN_H) {
                        if((x-cx)*(x-cx) + (y-cy)*(y-cy) <= pr*pr) {
                            collisionMap[y * TERRAIN_W + x] = 0;
                        }
                    }
                }
            }
        }
        
        function getActiveWorm() {
            const t = teams[state.activeTeamIdx];
            if(t.worms.length === 0) return null;
            return t.worms[t.activeWormIdx];
        }

        // --- INPUT ---
        const keys = {};
        window.addEventListener('keydown', e => keys[e.code] = true);
        window.addEventListener('keyup', e => keys[e.code] = false);
        
        window.addEventListener('mousemove', e => {
            if(!state.gameStarted) return;
            if(state.phase === 'aiming' || state.phase === 'powering') {
                const vec = new THREE.Vector3((e.clientX / window.innerWidth) * 2 - 1, -(e.clientY / window.innerHeight) * 2 + 1, 0.5);
                vec.unproject(camera);
                vec.sub(camera.position).normalize();
                const distance = -camera.position.z / vec.z;
                const mouseWorld = new THREE.Vector3().copy(camera.position).add(vec.multiplyScalar(distance));
                const p = getActiveWorm();
                if(p) p.aimAngle = Math.atan2(mouseWorld.y - (p.pos.y + 1.5), mouseWorld.x - p.pos.x);
            }
        });

        window.addEventListener('wheel', e => {
            if(state.phase === 'aiming' && state.gameStarted) {
                const p = getActiveWorm();
                if(!p) return;
                
                if(e.deltaY > 0) p.weaponIdx = (p.weaponIdx + 1) % weapons.length;
                else p.weaponIdx = (p.weaponIdx - 1 + weapons.length) % weapons.length;
                
                const wDisp = document.getElementById('weapon-display');
                wDisp.innerText = weapons[p.weaponIdx].name;
                wDisp.style.display = 'block';
                if(weaponTimer) clearTimeout(weaponTimer);
                weaponTimer = setTimeout(() => wDisp.style.display = 'none', 1000);
            }
        });

        let mouseDown = false;
        window.addEventListener('mousedown', e => {
            if(e.target.tagName === 'BUTTON') return;
            if(state.phase === 'aiming' && state.gameStarted) {
                mouseDown = true;
                state.phase = 'powering';
                state.power = 0;
                document.getElementById('power-container').style.display = 'block';
            }
        });
        window.addEventListener('mouseup', e => {
            if(state.phase === 'powering') {
                mouseDown = false;
                fireProjectile();
            }
        });
        window.addEventListener('keydown', e => {
            if(e.code === 'Space' && state.phase === 'aiming' && state.gameStarted) {
                keys['Space'] = true;
                state.phase = 'powering';
                state.power = 0;
                document.getElementById('power-container').style.display = 'block';
            }
        });
        window.addEventListener('keyup', e => {
            if(e.code === 'Space' && state.phase === 'powering') fireProjectile();
        });

        // --- GAME LOGIC ---
        function updateUI() {
            if(!state.gameStarted) return;
            
            let h0 = teams[0].worms.reduce((sum, w) => sum + Math.max(0, w.health), 0);
            let h1 = teams[1].worms.reduce((sum, w) => sum + Math.max(0, w.health), 0);
            
            document.getElementById('t0-health').style.width = (h0 / (teams[0].requestedCount * 100) * 100) + '%';
            document.getElementById('t1-health').style.width = (h1 / (teams[1].requestedCount * 100) * 100) + '%';
            
            if(state.phase === 'powering') document.getElementById('power-bar').style.width = (state.power / state.maxPower * 100) + '%';
            else document.getElementById('power-container').style.display = 'none';
            
            const wa = document.getElementById('wind-arrow');
            wa.style.transform = `scaleX(${state.wind > 0 ? 1 : -1})`;
            document.getElementById('wind-text').innerText = Math.abs(state.wind).toFixed(1);
            
            const activeWorm = getActiveWorm();
            
            allWorms.forEach(p => {
                const isActive = (p === activeWorm && state.phase === 'aiming');
                p.mesh.crosshair.visible = isActive;
                p.mesh.crosshair.rotation.z = p.aimAngle;
                p.mesh.sprite.scale.x = Math.cos(p.aimAngle) < 0 ? -4 : 4;
                
                if(!p.label) {
                    p.label = document.createElement('div');
                    p.label.className = 'worm-label';
                    document.getElementById('labels-container').appendChild(p.label);
                }
                p.label.innerHTML = `${p.name} <br> <span style="color: ${p.team.colorStr};">[${Math.max(0, p.health)}]</span>`;
                
                const pos = p.pos.clone().add(new THREE.Vector3(0, 4, 0)).project(camera);
                const x = (pos.x * .5 + .5) * window.innerWidth;
                const y = (pos.y * -.5 + .5) * window.innerHeight;
                p.label.style.transform = `translate(-50%, -100%) translate(${x}px, ${y}px)`;
                p.label.style.display = p.health > 0 ? 'block' : 'none';
            });
            
            if((state.phase === 'aiming' || state.phase === 'powering') && activeWorm) {
                trajPoints.visible = true;
                const simPower = state.phase === 'powering' ? state.power : state.maxPower * 0.4;
                const dir = new THREE.Vector3(Math.cos(activeWorm.aimAngle), Math.sin(activeWorm.aimAngle), 0);
                let simPos = activeWorm.pos.clone().add(new THREE.Vector3(0, 1.5, 0)).add(dir.clone().multiplyScalar(2));
                let simVel = dir.multiplyScalar(simPower);
                
                const positions = trajGeo.attributes.position.array;
                const simDt = 0.1;
                for(let i=0; i<50; i++) {
                    positions[i*3] = simPos.x; positions[i*3+1] = simPos.y; positions[i*3+2] = 0.5;
                    simVel.x += state.wind * simDt; simVel.y += GRAVITY * simDt;
                    simPos.add(simVel.clone().multiplyScalar(simDt));
                }
                trajGeo.attributes.position.needsUpdate = true;
            } else {
                trajPoints.visible = false;
            }
        }

        function createPopup(text, pos3d, color='#ffeb3b') {
            const div = document.createElement('div');
            div.className = 'popup-text'; div.innerText = text; div.style.color = color;
            const pos = pos3d.clone().project(camera);
            div.style.left = ((pos.x * .5 + .5) * window.innerWidth) + 'px';
            div.style.top = ((pos.y * -.5 + .5) * window.innerHeight) + 'px';
            document.querySelector('.ui-layer').appendChild(div);
            setTimeout(() => div.remove(), 2000);
        }

        let particles = [];
        function createExplosion(pos, radius, color) {
            const pCount = 30;
            const geo = new THREE.BufferGeometry();
            const positions = new Float32Array(pCount * 3);
            const velocities = [];
            for(let i=0; i<pCount; i++) {
                positions[i*3] = pos.x; positions[i*3+1] = pos.y; positions[i*3+2] = 0.5;
                velocities.push(new THREE.Vector3((Math.random()-0.5)*radius, Math.random()*radius, 0));
            }
            geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            const points = new THREE.Points(geo, new THREE.PointsMaterial({ color: color, size: 0.8 }));
            scene.add(points);
            particles.push({ mesh: points, vels: velocities, age: 0, max: 1.0 });
        }
        
        function announceTurn() {
            const t = teams[state.activeTeamIdx];
            const ann = document.getElementById('turnAnnouncer');
            ann.innerText = t.name + "'S TURN!";
            ann.style.color = t.colorStr;
            ann.style.display = 'block';
            setTimeout(() => ann.style.display = 'none', 2000);
            
            const wDisp = document.getElementById('weapon-display');
            wDisp.innerText = weapons[getActiveWorm().weaponIdx].name;
            wDisp.style.display = 'block';
            if(weaponTimer) clearTimeout(weaponTimer);
            weaponTimer = setTimeout(() => wDisp.style.display = 'none', 1500);
        }

        function switchTurn() {
            // Clean up dead worms
            teams.forEach(t => {
                t.worms = t.worms.filter(w => w.health > 0);
            });
            
            if(teams[0].worms.length === 0 || teams[1].worms.length === 0) {
                state.phase = 'gameover';
                const winner = teams[0].worms.length > 0 ? teams[0].name : (teams[1].worms.length > 0 ? teams[1].name : "DRAW");
                const ann = document.getElementById('turnAnnouncer');
                ann.innerText = winner + " WINS!";
                ann.style.color = '#ffeb3b';
                ann.style.display = 'block';
                return;
            }
            
            // Advance turn
            state.activeTeamIdx = state.activeTeamIdx === 0 ? 1 : 0;
            const t = teams[state.activeTeamIdx];
            t.activeWormIdx = (t.activeWormIdx + 1) % t.worms.length;
            
            state.phase = 'aiming';
            state.wind = (Math.random() - 0.5) * 20;
            
            announceTurn();
        }

        function fireProjectile() {
            state.phase = 'firing';
            const p = getActiveWorm();
            const wData = weapons[p.weaponIdx];
            
            const projGeo = wData.id === 'chicken' ? new THREE.PlaneGeometry(1.5, 1.5) : new THREE.CircleGeometry(0.5, 16);
            const mesh = new THREE.Mesh(projGeo, new THREE.MeshBasicMaterial({ color: wData.color }));
            
            const dir = new THREE.Vector3(Math.cos(p.aimAngle), Math.sin(p.aimAngle), 0);
            mesh.position.copy(p.pos).add(new THREE.Vector3(0, 1.5, 0)).add(dir.clone().multiplyScalar(2));
            mesh.position.z = 0.5;
            scene.add(mesh);
            
            state.activeProjectile = { mesh: mesh, vel: dir.multiplyScalar(state.power), data: wData, timer: wData.delay };
            createPopup("YEET!", mesh.position, '#fff');
        }

        function handleExplosion(pos, wData) {
            createExplosion(pos, wData.radius, wData.color);
            destroyTerrain(pos.x, pos.y, wData.radius);
            if(state.activeProjectile) scene.remove(state.activeProjectile.mesh);
            state.activeProjectile = null;
            
            let texts = ["BOOM!", "KABLAM!"];
            if(wData.id === 'chicken') texts = ["BOK BOK!", "FEATHERS!"];
            createPopup(texts[Math.floor(Math.random()*texts.length)], pos);
            
            allWorms.forEach(p => {
                if(p.health <= 0) return;
                const dist = p.pos.distanceTo(pos);
                if(dist < wData.radius * 2) {
                    const dmg = Math.floor(wData.damage * (1 - dist / (wData.radius * 2)));
                    p.health -= dmg;
                    p.vel.add(p.pos.clone().sub(pos).normalize().multiplyScalar(dmg * 0.8));
                    p.vel.y += dmg * 0.5;
                    createPopup(`-${dmg}`, p.pos.clone().add(new THREE.Vector3(0,3,0)), '#ff0000');
                    if(p.health <= 0) { p.mesh.rotation.z = Math.PI/2; p.label.style.display = 'none'; }
                }
            });
            
            state.phase = 'resolving';
            setTimeout(switchTurn, 2500);
        }

        // --- MAIN LOOP ---
        const clock = new THREE.Clock();
        
        function update() {
            const dt = Math.min(clock.getDelta(), 0.1);
            if(!state.gameStarted) return;
            
            if(state.phase === 'powering') {
                state.power += dt * 40;
                if(state.power > state.maxPower) state.power = state.maxPower;
            }
            
            let camTarget = new THREE.Vector3(0, 0, 120);
            if(state.activeProjectile) {
                camTarget.x = state.activeProjectile.mesh.position.x;
                camTarget.y = state.activeProjectile.mesh.position.y;
            } else {
                const w = getActiveWorm();
                if(w) { camTarget.x = w.pos.x; camTarget.y = w.pos.y; }
            }
            camera.position.lerp(camTarget, 0.1);
            
            allWorms.forEach(p => {
                if(p.health <= 0) return;
                
                const isCurrent = (p === getActiveWorm() && state.phase === 'aiming');
                
                if(isCurrent) {
                    let dx = 0;
                    if(keys['ArrowRight'] || keys['KeyD']) dx = 10 * dt;
                    if(keys['ArrowLeft'] || keys['KeyA']) dx = -10 * dt;
                    
                    if(dx !== 0) {
                        let nx = p.pos.x + dx; let ny = p.pos.y;
                        if(isSolid(nx, ny)) { ny += 0.5; if(isSolid(nx, ny)) { ny += 0.5; if(isSolid(nx, ny)) dx = 0; } }
                        if(dx !== 0) {
                            p.pos.x = nx; p.pos.y = ny;
                            if(!isSolid(nx, ny-0.5) && isSolid(nx, ny-1)) p.pos.y -= 0.5;
                        }
                    }
                    
                    if((keys['ShiftRight'] || keys['KeyE']) && Math.abs(p.vel.y) < 0.1 && isSolid(p.pos.x, p.pos.y - 0.5)) p.vel.y = 15;
                }
                
                p.vel.y += GRAVITY * dt;
                let nextY = p.pos.y + p.vel.y * dt;
                
                // Keep inside level bounds
                if(p.pos.x < -SCENE_W/2) p.pos.x = -SCENE_W/2;
                if(p.pos.x > SCENE_W/2) p.pos.x = SCENE_W/2;
                
                if(isSolid(p.pos.x, nextY - 0.1)) {
                    while(isSolid(p.pos.x, p.pos.y)) p.pos.y += 0.1;
                    p.vel.y = 0; p.vel.x *= 0.8;
                } else {
                    p.pos.y = nextY;
                }
                p.pos.x += p.vel.x * dt;
                
                if(p.pos.y < -SCENE_H/2 + 5) {
                    p.health = 0;
                    createPopup("GLUG GLUG!", p.pos);
                    p.mesh.rotation.z = Math.PI/2;
                    p.label.style.display = 'none';
                }
                p.mesh.position.copy(p.pos);
            });
            
            if(state.activeProjectile) {
                const proj = state.activeProjectile;
                proj.vel.x += state.wind * dt; proj.vel.y += GRAVITY * dt;
                proj.mesh.position.add(proj.vel.clone().multiplyScalar(dt));
                proj.mesh.rotation.z += dt * 5;
                
                if(proj.mesh.position.y < -SCENE_H/2 + 5 || Math.abs(proj.mesh.position.x) > SCENE_W/2) {
                    handleExplosion(proj.mesh.position, proj.data);
                } else if(isSolid(proj.mesh.position.x, proj.mesh.position.y)) {
                    if(proj.data.bounce > 0) {
                        proj.vel.y *= -proj.data.bounce; proj.vel.x *= 0.8; proj.mesh.position.y += 0.5;
                        if(Math.abs(proj.vel.y) < 2 && proj.data.id === 'chicken') handleExplosion(proj.mesh.position, proj.data);
                    } else {
                        handleExplosion(proj.mesh.position, proj.data);
                    }
                }
                
                if(proj && proj.data.delay > 0) {
                    proj.timer -= dt;
                    if(proj.timer <= 0) handleExplosion(proj.mesh.position, proj.data);
                }
            }
            
            for(let i=particles.length-1; i>=0; i--) {
                const p = particles[i];
                p.age += dt;
                if(p.age > p.max) {
                    scene.remove(p.mesh); p.mesh.geometry.dispose(); p.mesh.material.dispose();
                    particles.splice(i, 1); continue;
                }
                const pos = p.mesh.geometry.attributes.position.array;
                for(let j=0; j<p.vels.length; j++) {
                    p.vels[j].y += GRAVITY * dt * 0.5;
                    pos[j*3] += p.vels[j].x * dt; pos[j*3+1] += p.vels[j].y * dt;
                }
                p.mesh.geometry.attributes.position.needsUpdate = true;
            }
            
            updateUI();
        }

        function render() {
            requestAnimationFrame(render);
            update();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        render();
    </script>
</body>
</html>
