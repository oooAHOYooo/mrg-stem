<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Genesis - Make Games with AI</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f111a;
            --bg-panel: #1a1d2d;
            --border-color: #2b304c;
            --accent-primary: #a78bfa;
            --accent-secondary: #34d399;
            --accent-warning: #fb923c;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Top Nav */
        .top-nav {
            height: 60px;
            background: rgba(26, 29, 45, 0.8);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 2rem;
            backdrop-filter: blur(10px);
            z-index: 10;
        }

        .nav-brand {
            font-size: 1.2rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--accent-primary);
        }

        .nav-actions {
            display: flex;
            gap: 1rem;
        }

        .btn {
            background: var(--border-color);
            color: var(--text-main);
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn:hover {
            background: #3b4266;
            transform: translateY(-1px);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-primary), #8b5cf6);
            color: white;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3);
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #b49dfb, #a78bfa);
            box-shadow: 0 6px 20px rgba(139, 92, 246, 0.4);
        }

        /* 2x2 Grid Layout */
        .workspace {
            display: grid;
            grid-template-columns: 35% 65%;
            grid-template-rows: 50% 50%;
            gap: 1rem;
            padding: 1rem;
            flex: 1;
            height: calc(100vh - 60px);
        }

        .panel {
            background: var(--bg-panel);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 8px 30px rgba(0,0,0,0.2);
            position: relative;
        }

        .panel-header {
            padding: 0.75rem 1rem;
            background: rgba(0,0,0,0.2);
            border-bottom: 1px solid var(--border-color);
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-dim);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Top Left: Tutorial/Agent Dialog (Row 1, Col 1) */
        .agent-view {
            grid-column: 1;
            grid-row: 1;
        }

        .chat-container {
            padding: 1.5rem;
            overflow-y: auto;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .message {
            display: flex;
            gap: 1rem;
            animation: slideIn 0.3s ease-out forwards;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            background: linear-gradient(135deg, var(--accent-primary), #8b5cf6);
            flex-shrink: 0;
            box-shadow: 0 4px 10px rgba(139, 92, 246, 0.3);
        }

        .msg-content {
            background: rgba(255,255,255,0.05);
            padding: 1rem;
            border-radius: 0 12px 12px 12px;
            font-size: 0.95rem;
            line-height: 1.5;
            flex: 1;
        }

        .msg-content blockquote {
            border-left: 3px solid var(--accent-secondary);
            padding-left: 0.75rem;
            margin: 0.5rem 0;
            color: var(--accent-secondary);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
        }

        /* Bottom Left: Coding / Prompt (Row 2, Col 1) */
        .editor-view {
            grid-column: 1;
            grid-row: 2;
        }

        .code-area {
            flex: 1;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        textarea {
            flex: 1;
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--accent-secondary);
            font-family: 'JetBrains Mono', monospace;
            font-size: 1rem;
            padding: 1rem;
            resize: none;
            outline: none;
            transition: border-color 0.2s;
        }

        textarea:focus {
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 2px rgba(167, 139, 250, 0.2);
        }

        textarea::placeholder {
            color: rgba(255,255,255,0.2);
        }

        .run-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .hint {
            font-size: 0.8rem;
            color: var(--text-dim);
        }

        /* Top Right: Preview Window (Row 1, Col 2) */
        .preview-view {
            grid-column: 2;
            grid-row: 1;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
            position: relative;
        }

        /* Bottom Right: Clear (Row 2, Col 2) */
        .assets-view {
            grid-column: 2;
            grid-row: 2;
            background: repeating-linear-gradient(
                45deg,
                var(--bg-panel),
                var(--bg-panel) 10px,
                rgba(0,0,0,0.1) 10px,
                rgba(0,0,0,0.1) 20px
            );
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .empty-state {
            color: var(--text-dim);
            text-align: center;
            opacity: 0.5;
        }
        
        .empty-state h3 {
            font-size: 1.2rem;
            margin-bottom: 0.5rem;
        }

        /* Typing indicator */
        .typing {
            display: none;
            gap: 0.3rem;
            padding: 1rem;
            align-items: center;
            opacity: 0.7;
        }

        .typing.active {
            display: flex;
        }

        .dot {
            width: 6px;
            height: 6px;
            background: var(--accent-primary);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
        
        /* Modals */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--accent-secondary);
            color: #000;
            padding: 0.75rem 1.5rem;
            border-radius: 30px;
            font-weight: 600;
            box-shadow: 0 10px 30px rgba(52, 211, 153, 0.4);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 100;
        }
        
        .toast.show {
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

    <nav class="top-nav">
        <div class="nav-brand">
            <span style="font-size: 1.5rem;">🤖</span> Agent Genesis
        </div>
        <div class="nav-actions">
            <a href="mge.html" class="btn" style="text-decoration: none;">🏠 Hub</a>
            <button class="btn" id="btn-load">📂 Load</button>
            <button class="btn btn-primary" id="btn-save">💾 Save Local</button>
            <button class="btn" id="btn-export">📥 Export Prompt History</button>
        </div>
    </nav>

    <div class="workspace">
        <!-- Top Left: Tutorial/Agent -->
        <div class="panel agent-view">
            <div class="panel-header">
                <span>💬 Agent Output</span>
                <span style="color: var(--accent-secondary);">● Online</span>
            </div>
            <div class="chat-container" id="chat">
                <!-- Messages will appear here -->
            </div>
            <div class="typing" id="typing-indicator">
                <div class="avatar" style="width: 24px; height: 24px; font-size: 0.8rem;">🤖</div>
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
                <span style="font-size: 0.8rem; margin-left: 0.5rem; color: var(--accent-primary);">Generating code...</span>
            </div>
        </div>

        <!-- Bottom Left: Coding / Prompt -->
        <div class="panel editor-view">
            <div class="panel-header">
                <span>⌨️ Prompt Input</span>
                <span>Bash/Natural Language</span>
            </div>
            <div class="code-area">
                <textarea id="prompt-input" placeholder="Type a prompt to build your game... E.g., 'create a player cube', 'add a green floor', 'make the player jump'"></textarea>
                <div class="run-controls">
                    <span class="hint">Press Shift+Enter to submit</span>
                    <button class="btn btn-primary" id="btn-submit">Execute Prompt ⚡</button>
                </div>
            </div>
        </div>

        <!-- Top Right: Output Preview -->
        <div class="panel preview-view">
            <div class="panel-header">
                <span>🎮 Output Preview Window</span>
                <span style="display: flex; gap: 0.5rem;">
                    <span style="width: 12px; height: 12px; border-radius: 50%; background: #ef4444;"></span>
                    <span style="width: 12px; height: 12px; border-radius: 50%; background: #eab308;"></span>
                    <span style="width: 12px; height: 12px; border-radius: 50%; background: #22c55e;"></span>
                </span>
            </div>
            <div id="canvas-container"></div>
        </div>

        <!-- Bottom Right: Clear/System Stats -->
        <div class="panel assets-view">
            <div class="empty-state">
                <h3>System Architecture Room</h3>
                <p>Reserved for Game Blocks & Inspector</p>
                <p style="font-size: 2rem; margin-top: 1rem;">🏗️</p>
            </div>
        </div>
    </div>
    
    <div class="toast" id="toast">Saved successfully!</div>

    <!-- Required Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // === STATE & HISTORY ===
        let promptHistory = [];
        const TOAST = document.getElementById('toast');

        function showToast(msg, isError = false) {
            TOAST.textContent = msg;
            TOAST.style.background = isError ? "var(--accent-warning)" : "var(--accent-secondary)";
            TOAST.classList.add('show');
            setTimeout(() => TOAST.classList.remove('show'), 3000);
        }

        // === AGENT CHAT LOGIC ===
        const chatContainer = document.getElementById('chat');
        const typingIndicator = document.getElementById('typing-indicator');

        function addMessage(text, isUser = false) {
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message';
            
            if (isUser) {
                msgDiv.innerHTML = `
                    <div class="avatar" style="background: #3b82f6;">👤</div>
                    <div class="msg-content" style="background: rgba(59, 130, 246, 0.1); border: 1px solid rgba(59, 130, 246, 0.3);">
                        <strong>You:</strong><br>
                        ${text}
                    </div>
                `;
            } else {
                msgDiv.innerHTML = `
                    <div class="avatar">🤖</div>
                    <div class="msg-content">
                        ${text}
                    </div>
                `;
            }
            
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // Opening Message
        setTimeout(() => {
            addMessage(`
                <strong>System initialized. Hello Creator!</strong><br><br>
                I am your personal AI game development agent. I can build 3D elements for you in the preview window on the right.<br><br>
                Try typing commands like:<br>
                <blockquote>add a purple cube</blockquote>
                <blockquote>create a floor</blockquote>
                <blockquote>make it bounce</blockquote>
            `);
        }, 500);


        // === THREE.JS PREVIEW LOGIC ===
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color('#111827');
        scene.fog = new THREE.FogExp2('#111827', 0.02);
        
        const camera = new THREE.PerspectiveCamera(75, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.set(0, 5, 10);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);
        
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(10, 20, 10);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // Grid Helper (gives it that engine feel)
        const gridHelper = new THREE.GridHelper(20, 20, 0x4f46e5, 0x374151);
        scene.add(gridHelper);

        // Animated Objects tracking
        let animObjects = [];

        // Animation Loop
        function animate() {
            requestAnimationFrame(animate);
            
            // Run animations
            const time = performance.now() * 0.001;
            animObjects.forEach(obj => {
                if(obj.userData.bounce) {
                    obj.position.y = obj.userData.baseY + Math.sin(time * 3) * 2;
                }
                if(obj.userData.spin) {
                    obj.rotation.x += 0.01;
                    obj.rotation.y += 0.02;
                }
            });

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });

        // === PSEUDO-LLM PARSER ===
        // This simulates an LLM parsing text commands to execute Three.js code
        function parseCommand(cmd) {
            const lowerCmd = cmd.toLowerCase();
            let response = "I've updated the scene based on your request! ";
            let somethingHappened = false;

            // Common colors mapping
            const colors = {
                'red': 0xef4444, 'green': 0x22c55e, 'blue': 0x3b82f6, 
                'purple': 0xa78bfa, 'yellow': 0xeab308, 'pink': 0xf472b6,
                'white': 0xffffff, 'orange': 0xfb923c, 'black': 0x000000
            };
            
            // Detect color in prompt
            let chosenColor = 0xffffff;
            for (let c in colors) {
                if (lowerCmd.includes(c)) {
                    chosenColor = colors[c];
                    break;
                }
            }

            // Object Creation
            if (lowerCmd.includes('cube') || lowerCmd.includes('box')) {
                const geometry = new THREE.BoxGeometry(2, 2, 2);
                const material = new THREE.MeshStandardMaterial({ color: chosenColor, roughness: 0.2, metalness: 0.1 });
                const cube = new THREE.Mesh(geometry, material);
                cube.position.y = 1;
                cube.castShadow = true;
                cube.receiveShadow = true;
                cube.userData = { baseY: 1 };
                scene.add(cube);
                animObjects.push(cube);
                response += "Added a " + getObjColorName(chosenColor) + " cube. ";
                somethingHappened = true;
            }

            if (lowerCmd.includes('sphere') || lowerCmd.includes('ball')) {
                const geometry = new THREE.SphereGeometry(1.5, 32, 32);
                const material = new THREE.MeshStandardMaterial({ color: chosenColor, roughness: 0.3, metalness: 0.4 });
                const sphere = new THREE.Mesh(geometry, material);
                sphere.position.y = 1.5;
                sphere.position.x = (Math.random() - 0.5) * 5; // Random x slightly
                sphere.castShadow = true;
                sphere.receiveShadow = true;
                sphere.userData = { baseY: 1.5 };
                scene.add(sphere);
                animObjects.push(sphere);
                response += "Spawned a " + getObjColorName(chosenColor) + " sphere. ";
                somethingHappened = true;
            }

            if (lowerCmd.includes('floor') || lowerCmd.includes('ground')) {
                const geometry = new THREE.PlaneGeometry(30, 30);
                const material = new THREE.MeshStandardMaterial({ 
                    color: chosenColor === 0xffffff ? 0x1f2937 : chosenColor, 
                    roughness: 0.8 
                });
                const plane = new THREE.Mesh(geometry, material);
                plane.rotation.x = -Math.PI / 2;
                plane.receiveShadow = true;
                scene.add(plane);
                response += "Added a solid floor. ";
                somethingHappened = true;
            }

            // Modifiers
            if (lowerCmd.includes('bounce') || lowerCmd.includes('jump')) {
                if(animObjects.length > 0) {
                    animObjects[animObjects.length - 1].userData.bounce = true;
                    response += "The last created object is now bouncing! ";
                    somethingHappened = true;
                } else {
                    response = "I need an object to make bounce. Try adding a cube first! ";
                    somethingHappened = true;
                }
            }

            if (lowerCmd.includes('spin') || lowerCmd.includes('rotate')) {
                if(animObjects.length > 0) {
                    animObjects[animObjects.length - 1].userData.spin = true;
                    response += "The last created object is now spinning! ";
                    somethingHappened = true;
                } else {
                    response = "I need an object to spin. Try adding a cube first! ";
                    somethingHappened = true;
                }
            }
            
            if (lowerCmd.includes('clear') || lowerCmd.includes('reset')) {
                // Remove everything except lights and grid
                const toRemove = [];
                scene.traverse((child) => {
                    if (child.isMesh && child !== gridHelper) {
                        toRemove.push(child);
                    }
                });
                toRemove.forEach(child => scene.remove(child));
                animObjects = [];
                response = "Cleared the scene! Ready for fresh ideas.";
                somethingHappened = true;
            }

            if (!somethingHappened) {
                response = "I couldn't quite understand that command. Try 'add a red cube' or 'make it bounce'!";
            }

            return response;
        }

        function getObjColorName(hexValue) {
            const colors = {
                0xef4444: 'red', 0x22c55e: 'green', 0x3b82f6: 'blue', 
                0xa78bfa: 'purple', 0xeab308: 'yellow', 0xf472b6: 'pink',
                0xffffff: 'white', 0xfb923c: 'orange', 0x000000: 'black'
            };
            return colors[hexValue] || 'colorful';
        }

        // === USER INPUT HANDLING ===
        const inputArea = document.getElementById('prompt-input');
        const btnSubmit = document.getElementById('btn-submit');

        function submitPrompt() {
            const text = inputArea.value.trim();
            if(!text) return;

            // 1. Show user message
            addMessage(text, true);
            promptHistory.push(text);
            inputArea.value = '';

            // 2. Show agent thinking
            typingIndicator.classList.add('active');
            chatContainer.scrollTop = chatContainer.scrollHeight;

            // 3. Fake delay for LLM feeling, then execute
            setTimeout(() => {
                const response = parseCommand(text);
                typingIndicator.classList.remove('active');
                
                let codeBlock = "";
                if(response.includes("cube") || response.includes("sphere") || response.includes("floor") || response.includes("bouncing")) {
                    codeBlock = `<br><code>[Executing Engine Script: Object Modification]</code>`;
                }
                
                addMessage(`<strong>Agent:</strong><br>${response} ${codeBlock}`);
                
                // Auto save locally on significant action
                saveToLocal();
            }, 1000 + Math.random() * 1000); // 1-2s delay
        }

        btnSubmit.addEventListener('click', submitPrompt);
        inputArea.addEventListener('keydown', (e) => {
            if(e.key === 'Enter' && e.shiftKey) {
                e.preventDefault();
                submitPrompt();
            }
        });


        // === SAVING LOGIC ===
        function saveToLocal() {
            if(promptHistory.length > 0) {
                localStorage.setItem('agentGenesisHistory', JSON.stringify(promptHistory));
            }
        }

        document.getElementById('btn-save').addEventListener('click', () => {
            saveToLocal();
            showToast("Work saved locally! 💾");
        });

        document.getElementById('btn-load').addEventListener('click', () => {
            const saved = localStorage.getItem('agentGenesisHistory');
            if(saved) {
                const history = JSON.parse(saved);
                if(history.length > 0) {
                    addMessage(`<strong>Agent:</strong><br>Found a saved session with ${history.length} commands. I am re-running them now! 🚀`);
                    
                    // Re-run the history
                    let delay = 1000;
                    history.forEach((cmd, idx) => {
                        setTimeout(() => {
                            parseCommand(cmd);
                            promptHistory.push(cmd);
                            if(idx === history.length - 1) {
                                addMessage(`<strong>Agent:</strong><br>Restoration complete!`);
                            }
                        }, delay);
                        delay += 300;
                    });
                    showToast("Work loaded! 📂");
                } else {
                    showToast("No history found in this session.", true);
                }
            } else {
                showToast("No saved work found.", true);
            }
        });

        document.getElementById('btn-export').addEventListener('click', () => {
            if (promptHistory.length === 0) {
                showToast("Nothing to export yet!", true);
                return;
            }
            const link = document.createElement("a");
            const file = new Blob([promptHistory.join("\n")], { type: 'text/plain' });
            link.href = URL.createObjectURL(file);
            link.download = "Agent_Genesis_Prompts.txt";
            link.click();
            URL.revokeObjectURL(link.href);
            showToast("Downloaded as text file! 📥");
        });

    </script>
</body>
</html>
