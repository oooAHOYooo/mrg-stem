<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surfing Game - Mr. Gonzalez Experiments</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
        }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        #game-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .ui-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
        }

        .ui-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 1.5rem;
            margin: 1rem;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            border: 3px solid;
            pointer-events: auto;
        }

        .score-panel {
            position: fixed;
            top: 1rem;
            left: 1rem;
            width: 280px;
            border-color: #ff6b6b;
        }

        .controls-panel {
            position: fixed;
            bottom: 1rem;
            left: 1rem;
            width: 320px;
            border-color: #4ecdc4;
        }

        .player-score {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem;
            margin: 0.5rem 0;
            border-radius: 12px;
            font-weight: 700;
            font-size: 1.2rem;
        }

        .player1-score {
            background: linear-gradient(135deg, #ff6b6b, #ff8787);
            color: white;
            border: 2px solid #ff4757;
        }

        .player2-score {
            background: linear-gradient(135deg, #4ecdc4, #6ee7b7);
            color: white;
            border: 2px solid #26d0ce;
        }

        .controls-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-top: 1rem;
        }

        .control-set {
            background: rgba(255, 255, 255, 0.8);
            padding: 1rem;
            border-radius: 12px;
            border: 2px solid;
        }

        .player1-controls {
            border-color: #ff6b6b;
        }

        .player2-controls {
            border-color: #4ecdc4;
        }

        .control-set h3 {
            margin-bottom: 0.5rem;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .player1-controls h3 {
            color: #ff6b6b;
        }

        .player2-controls h3 {
            color: #4ecdc4;
        }

        .control-key {
            display: inline-block;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 0.4rem 0.8rem;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.9rem;
            margin: 0.2rem;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        .title {
            position: fixed;
            top: 1rem;
            right: 1rem;
            background: linear-gradient(135deg, #ff6b6b, #4ecdc4, #ffe66d, #a78bfa);
            background-size: 400% 400%;
            animation: gradientShift 3s ease infinite;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: 2.5rem;
            font-weight: 900;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.5);
            z-index: 11;
            pointer-events: none;
        }

        .back-button {
            position: fixed;
            top: 1rem;
            right: 1rem;
            z-index: 20;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border: 3px solid #ff6b6b;
            border-radius: 15px;
            padding: 0.75rem 1.5rem;
            color: #ff6b6b;
            text-decoration: none;
            font-weight: 700;
            font-size: 1rem;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .back-button:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 10px 30px rgba(255, 107, 107, 0.4);
            background: linear-gradient(135deg, #ff6b6b, #ff8787);
            color: white;
        }

        .wave-info {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 2rem;
            text-align: center;
            border: 3px solid #ffe66d;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            z-index: 15;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .wave-info.show {
            opacity: 1;
            pointer-events: auto;
        }

        .wave-info h2 {
            font-size: 2rem;
            color: #ff6b6b;
            margin-bottom: 1rem;
        }

        .wave-info p {
            font-size: 1.2rem;
            color: #475569;
            margin: 0.5rem 0;
        }

        @media (max-width: 768px) {
            .score-panel, .controls-panel {
                width: calc(100% - 2rem);
                font-size: 0.9rem;
            }

            .title {
                font-size: 1.5rem;
                top: 0.5rem;
                right: 0.5rem;
            }

            .back-button {
                top: 0.5rem;
                right: 0.5rem;
                padding: 0.5rem 1rem;
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>
    <div id="game-container"></div>
    
    <div class="ui-overlay">
        <a href="mge.html" class="back-button">← Back to MGE</a>
        
        <div class="title">🏄 SURFING GAME 🏄</div>
        
        <div class="score-panel ui-panel">
            <h2 style="margin-bottom: 1rem; color: #1a1a2e; text-align: center;">Scores</h2>
            <div class="player-score player1-score">
                <span>Player 1 🏄‍♂️</span>
                <span id="score1">0</span>
            </div>
            <div class="player-score player2-score">
                <span>Player 2 🏄‍♀️</span>
                <span id="score2">0</span>
            </div>
        </div>

        <div class="controls-panel ui-panel">
            <h2 style="margin-bottom: 1rem; color: #1a1a2e; text-align: center;">Controls</h2>
            <div class="controls-grid">
                <div class="control-set player1-controls">
                    <h3>Player 1</h3>
                    <div>
                        <span class="control-key">W</span> Up<br>
                        <span class="control-key">S</span> Down<br>
                        <span class="control-key">A</span> Left<br>
                        <span class="control-key">D</span> Right
                    </div>
                </div>
                <div class="control-set player2-controls">
                    <h3>Player 2</h3>
                    <div>
                        <span class="control-key">↑</span> Up<br>
                        <span class="control-key">↓</span> Down<br>
                        <span class="control-key">←</span> Left<br>
                        <span class="control-key">→</span> Right
                    </div>
                </div>
            </div>
        </div>

        <div class="wave-info" id="wave-info">
            <h2 id="wave-title">Wave Coming!</h2>
            <p id="wave-message">Get ready to ride!</p>
        </div>
    </div>

    <script>
        // Scene setup
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x000000, 0);
        document.getElementById('game-container').appendChild(renderer.domElement);

        // Camera position
        camera.position.set(0, 8, 15);
        camera.lookAt(0, 0, 0);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(10, 10, 5);
        scene.add(directionalLight);

        const pointLight1 = new THREE.PointLight(0xff6b6b, 1, 50);
        pointLight1.position.set(-5, 5, 5);
        scene.add(pointLight1);

        const pointLight2 = new THREE.PointLight(0x4ecdc4, 1, 50);
        pointLight2.position.set(5, 5, 5);
        scene.add(pointLight2);

        // Colorful ocean
        const oceanGeometry = new THREE.PlaneGeometry(100, 100, 50, 50);
        const oceanMaterial = new THREE.MeshPhongMaterial({
            color: 0x1e90ff,
            transparent: true,
            opacity: 0.8,
            side: THREE.DoubleSide
        });
        const ocean = new THREE.Mesh(oceanGeometry, oceanMaterial);
        ocean.rotation.x = -Math.PI / 2;
        ocean.position.y = -2;
        scene.add(ocean);

        // Animated waves
        const waveTime = { value: 0 };
        oceanMaterial.onBeforeCompile = (shader) => {
            shader.uniforms.time = waveTime;
            shader.vertexShader = `
                uniform float time;
                ${shader.vertexShader}
            `.replace(
                '#include <begin_vertex>',
                `
                vec3 pos = position;
                pos.z += sin(pos.x * 0.1 + time * 2.0) * 0.5;
                pos.z += sin(pos.y * 0.1 + time * 1.5) * 0.3;
                vec3 transformed = vec3(pos);
                `
            );
        };

        // Player 1 (Red/Orange surfer)
        const surfer1Geometry = new THREE.ConeGeometry(0.3, 1, 8);
        const surfer1Material = new THREE.MeshPhongMaterial({
            color: 0xff6b6b,
            emissive: 0xff4757,
            emissiveIntensity: 0.5
        });
        const surfer1 = new THREE.Mesh(surfer1Geometry, surfer1Material);
        surfer1.position.set(-3, 0, 0);
        scene.add(surfer1);

        // Player 2 (Cyan/Blue surfer)
        const surfer2Geometry = new THREE.ConeGeometry(0.3, 1, 8);
        const surfer2Material = new THREE.MeshPhongMaterial({
            color: 0x4ecdc4,
            emissive: 0x26d0ce,
            emissiveIntensity: 0.5
        });
        const surfer2 = new THREE.Mesh(surfer2Geometry, surfer2Material);
        surfer2.position.set(3, 0, 0);
        scene.add(surfer2);

        // Colorful particles
        const particles = [];
        const particleCount = 200;
        const particleGeometry = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);
        const colors = new Float32Array(particleCount * 3);

        for (let i = 0; i < particleCount; i++) {
            const i3 = i * 3;
            positions[i3] = (Math.random() - 0.5) * 100;
            positions[i3 + 1] = Math.random() * 20;
            positions[i3 + 2] = (Math.random() - 0.5) * 100;

            const color = new THREE.Color();
            const hue = Math.random();
            color.setHSL(hue, 1, 0.6);
            colors[i3] = color.r;
            colors[i3 + 1] = color.g;
            colors[i3 + 2] = color.b;
        }

        particleGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        particleGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        const particleMaterial = new THREE.PointsMaterial({
            size: 0.5,
            vertexColors: true,
            transparent: true,
            opacity: 0.8
        });

        const particleSystem = new THREE.Points(particleGeometry, particleMaterial);
        scene.add(particleSystem);

        // Game state
        const keys = {};
        let score1 = 0;
        let score2 = 0;
        const speed = 0.15;
        const bounds = 8;

        // Keyboard controls
        document.addEventListener('keydown', (e) => {
            keys[e.key.toLowerCase()] = true;
            keys[e.key] = true;
        });

        document.addEventListener('keyup', (e) => {
            keys[e.key.toLowerCase()] = false;
            keys[e.key] = false;
        });

        // Score display update
        function updateScore() {
            document.getElementById('score1').textContent = score1;
            document.getElementById('score2').textContent = score2;
        }

        // Wave info display
        function showWaveInfo(title, message) {
            const waveInfo = document.getElementById('wave-info');
            document.getElementById('wave-title').textContent = title;
            document.getElementById('wave-message').textContent = message;
            waveInfo.classList.add('show');
            setTimeout(() => {
                waveInfo.classList.remove('show');
            }, 2000);
        }

        // Collectibles (colorful gems)
        const collectibles = [];
        function createCollectible() {
            const geometry = new THREE.OctahedronGeometry(0.4);
            const material = new THREE.MeshPhongMaterial({
                color: new THREE.Color().setHSL(Math.random(), 1, 0.5),
                emissive: new THREE.Color().setHSL(Math.random(), 1, 0.3),
                emissiveIntensity: 0.8
            });
            const collectible = new THREE.Mesh(geometry, material);
            collectible.position.set(
                (Math.random() - 0.5) * 15,
                0.5,
                (Math.random() - 0.5) * 15
            );
            collectible.rotation.set(
                Math.random() * Math.PI,
                Math.random() * Math.PI,
                Math.random() * Math.PI
            );
            collectible.userData.rotationSpeed = {
                x: (Math.random() - 0.5) * 0.02,
                y: (Math.random() - 0.5) * 0.02,
                z: (Math.random() - 0.5) * 0.02
            };
            scene.add(collectible);
            collectibles.push(collectible);
        }

        // Create initial collectibles
        for (let i = 0; i < 10; i++) {
            createCollectible();
        }

        // Animation loop
        let frame = 0;
        function animate() {
            requestAnimationFrame(animate);
            frame++;

            // Update wave animation
            waveTime.value += 0.02;

            // Player 1 movement (WASD)
            if (keys['w'] || keys['W']) {
                surfer1.position.z -= speed;
                surfer1.rotation.x = -0.3;
            } else if (keys['s'] || keys['S']) {
                surfer1.position.z += speed;
                surfer1.rotation.x = 0.3;
            } else {
                surfer1.rotation.x = 0;
            }
            if (keys['a'] || keys['A']) {
                surfer1.position.x -= speed;
                surfer1.rotation.z = 0.3;
            } else if (keys['d'] || keys['D']) {
                surfer1.position.x += speed;
                surfer1.rotation.z = -0.3;
            } else {
                surfer1.rotation.z = 0;
            }

            // Player 2 movement (Arrow keys)
            if (keys['ArrowUp']) {
                surfer2.position.z -= speed;
                surfer2.rotation.x = -0.3;
            } else if (keys['ArrowDown']) {
                surfer2.position.z += speed;
                surfer2.rotation.x = 0.3;
            } else {
                surfer2.rotation.x = 0;
            }
            if (keys['ArrowLeft']) {
                surfer2.position.x -= speed;
                surfer2.rotation.z = 0.3;
            } else if (keys['ArrowRight']) {
                surfer2.position.x += speed;
                surfer2.rotation.z = -0.3;
            } else {
                surfer2.rotation.z = 0;
            }

            // Keep players in bounds
            surfer1.position.x = Math.max(-bounds, Math.min(bounds, surfer1.position.x));
            surfer1.position.z = Math.max(-bounds, Math.min(bounds, surfer1.position.z));
            surfer2.position.x = Math.max(-bounds, Math.min(bounds, surfer2.position.x));
            surfer2.position.z = Math.max(-bounds, Math.min(bounds, surfer2.position.z));

            // Update surfer Y position based on wave
            const waveHeight1 = Math.sin(surfer1.position.x * 0.1 + waveTime.value * 2) * 0.5 +
                               Math.sin(surfer1.position.z * 0.1 + waveTime.value * 1.5) * 0.3;
            surfer1.position.y = waveHeight1;

            const waveHeight2 = Math.sin(surfer2.position.x * 0.1 + waveTime.value * 2) * 0.5 +
                               Math.sin(surfer2.position.z * 0.1 + waveTime.value * 1.5) * 0.3;
            surfer2.position.y = waveHeight2;

            // Rotate surfers for visual effect
            surfer1.rotation.y += 0.01;
            surfer2.rotation.y -= 0.01;

            // Update collectibles
            collectibles.forEach((collectible, index) => {
                collectible.rotation.x += collectible.userData.rotationSpeed.x;
                collectible.rotation.y += collectible.userData.rotationSpeed.y;
                collectible.rotation.z += collectible.userData.rotationSpeed.z;

                // Float animation
                collectible.position.y = 0.5 + Math.sin(frame * 0.05 + index) * 0.3;

                // Check collision with player 1
                const dist1 = surfer1.position.distanceTo(collectible.position);
                if (dist1 < 1) {
                    score1 += 10;
                    updateScore();
                    scene.remove(collectible);
                    collectibles.splice(index, 1);
                    createCollectible();
                    showWaveInfo('Player 1 Scored!', '+10 points!');
                }

                // Check collision with player 2
                const dist2 = surfer2.position.distanceTo(collectible.position);
                if (dist2 < 1) {
                    score2 += 10;
                    updateScore();
                    scene.remove(collectible);
                    collectibles.splice(index, 1);
                    createCollectible();
                    showWaveInfo('Player 2 Scored!', '+10 points!');
                }
            });

            // Update particles
            particleSystem.rotation.y += 0.001;
            const positions = particleGeometry.attributes.position.array;
            for (let i = 0; i < particleCount; i++) {
                const i3 = i * 3;
                positions[i3 + 1] += 0.02;
                if (positions[i3 + 1] > 20) {
                    positions[i3 + 1] = 0;
                    positions[i3] = (Math.random() - 0.5) * 100;
                    positions[i3 + 2] = (Math.random() - 0.5) * 100;
                }
            }
            particleGeometry.attributes.position.needsUpdate = true;

            // Rotate lights for dynamic effect
            pointLight1.position.x = Math.cos(frame * 0.01) * 5;
            pointLight1.position.z = Math.sin(frame * 0.01) * 5;
            pointLight2.position.x = Math.cos(frame * 0.01 + Math.PI) * 5;
            pointLight2.position.z = Math.sin(frame * 0.01 + Math.PI) * 5;

            // Camera animation
            camera.position.x = Math.sin(frame * 0.005) * 2;
            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
        }

        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Start animation
        animate();
        updateScore();
        showWaveInfo('Welcome!', 'Collect the colorful gems!');
    </script>
</body>
</html>
