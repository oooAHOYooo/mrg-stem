<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aether | Architect Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background: radial-gradient(circle at top, #0a0a0a 0%, #050505 100%);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .top-nav {
            padding: 1.5rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .architect-info {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .xp-bar-container {
            width: 300px;
            height: 12px;
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .xp-fill {
            width: 65%;
            height: 100%;
            background: linear-gradient(90deg, var(--aether-primary), var(--aether-secondary));
            box-shadow: 0 0 15px var(--aether-primary);
        }

        .mission-grid {
            flex-grow: 1;
            padding: 2rem 5%;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
            align-content: start;
        }

        .mission-card {
            aspect-ratio: 1;
            background: var(--aether-glass);
            border-radius: 30px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            border: 2px solid transparent;
            position: relative;
            overflow: hidden;
        }

        .mission-card:hover {
            transform: scale(1.05);
            border-color: var(--aether-primary);
            background: rgba(0, 242, 255, 0.05);
        }

        .mission-card .icon {
            font-size: 5rem;
            margin-bottom: 1rem;
        }

        .mission-card h3 {
            font-size: 1.5rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .status-badge {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 0.7rem;
            font-weight: 900;
            color: var(--aether-primary);
            background: rgba(0, 242, 255, 0.1);
            padding: 5px 12px;
            border-radius: 20px;
        }

        .grade-pill {
            padding: 4px 10px;
            background: #fff;
            color: #000;
            border-radius: 5px;
            font-weight: 900;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
    <nav class="top-nav">
        <div class="logo">AETHER<span>PORTAL</span></div>
        <div class="architect-info">
            <div style="text-align: right;">
                <div style="font-weight: 900; font-size: 1.2rem;">Architect_Neo</div>
                <div class="grade-pill">GRADE 4</div>
            </div>
            <div>
                <div style="font-size: 0.7rem; font-weight: 900; color: var(--aether-text-dim); margin-bottom: 4px;">LEVEL 14</div>
                <div class="xp-bar-container">
                    <div class="xp-fill"></div>
                </div>
            </div>
        </div>
    </nav>

    <div style="padding: 0 5%; margin-top: 2rem;">
        <h2 style="font-weight: 900; font-size: 2rem; letter-spacing: -1px;">ACTIVE MISSIONS</h2>
        <p style="color: var(--aether-text-dim);">Choose an experiment to begin your training.</p>
    </div>

    <main class="mission-grid">
        <!-- Mission 1 -->
        <div class="mission-card">
            <div class="status-badge">READY</div>
            <div class="icon">🌪️</div>
            <h3>Storm<br>Chaser</h3>
        </div>

        <!-- Mission 2 -->
        <div class="mission-card">
            <div class="status-badge">READY</div>
            <div class="icon">🚀</div>
            <h3>Lunar<br>Architect</h3>
        </div>

        <!-- Mission 3 -->
        <div class="mission-card">
            <div class="status-badge" style="color: #ff00ff; background: rgba(255,0,255,0.1);">LOCKED</div>
            <div class="icon" style="filter: grayscale(1); opacity: 0.3;">🤖</div>
            <h3 style="opacity: 0.5;">Robot<br>Planner</h3>
        </div>

        <!-- Mission 4 -->
        <div class="mission-card">
            <div class="status-badge">NEW</div>
            <div class="icon">🌊</div>
            <h3>Aqua<br>Genesis</h3>
        </div>
    </main>

    <footer style="padding: 2rem 5%; border-top: 1px solid var(--aether-border); display: flex; justify-content: space-between; align-items: center;">
        <div style="color: var(--aether-text-dim); font-size: 0.8rem;">SYSTEM STATUS: OPTIMAL</div>
        <a href="index.html" style="color: var(--aether-text-dim); text-decoration: none; font-size: 0.8rem;">LOGOUT</a>
    </footer>
</body>
</html>
