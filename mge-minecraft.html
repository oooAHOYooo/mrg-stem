<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MGE - Minecraft Clone</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Inter', sans-serif; }
        #blocker {
            position: absolute;
            width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.5);
        }
        #instructions {
            width: 100%; height: 100%;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            color: white; text-align: center;
            cursor: pointer;
        }
        #instructions h1 { font-size: 48px; font-weight: 800; margin-bottom: 20px; text-shadow: 2px 2px 4px rgba(0,0,0,0.5);}
        #instructions p { font-size: 20px; text-shadow: 1px 1px 2px rgba(0,0,0,0.5); }
        #crosshair {
            position: absolute;
            top: 50%; left: 50%;
            width: 20px; height: 20px;
            transform: translate(-50%, -50%);
            color: white; font-size: 24px; pointer-events: none;
            display: flex; justify-content: center; align-items: center;
            text-shadow: 1px 1px 2px black;
        }
        .back-btn {
            position: absolute;
            top: 20px; left: 20px;
            padding: 12px 24px;
            background: linear-gradient(135deg, #ff6b6b, #f472b6);
            color: white; border-radius: 12px;
            text-decoration: none; font-weight: bold;
            z-index: 100;
            box-shadow: 0 4px 15px rgba(255,107,107,0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .back-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(255,107,107,0.6);
        }
        .color-picker {
            position: absolute;
            bottom: 20px; left: 50%;
            transform: translateX(-50%);
            display: flex; gap: 15px;
            z-index: 100;
            background: rgba(0,0,0,0.6); padding: 15px; border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255,255,255,0.1);
        }
        .color-btn {
            width: 40px; height: 40px; border-radius: 8px; cursor: pointer;
            border: 3px solid transparent;
            transition: transform 0.2s, border-color 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .color-btn:hover {
            transform: scale(1.1);
        }
        .color-btn.active {
            border-color: white;
            transform: scale(1.15);
        }
    </style>
    <!-- Import map for Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <a href="mge.html" class="back-btn">⬅️ Back to Dashboard</a>
    <div id="blocker">
        <div id="instructions">
            <h1>MGE Minecraft Clone</h1>
            <p><strong>WASD</strong> to move around</p>
            <p><strong>SPACE</strong> to jump</p>
            <p><strong>Left Click</strong> to break blocks | <strong>Right Click (or E)</strong> to place blocks</p>
            <p style="margin-top: 20px; font-weight: bold; color: #4ecdc4;">Click Anywhere to Start Play</p>
        </div>
    </div>
    <div id="crosshair">十</div>
    
    <div class="color-picker" id="colorPicker">
        <!-- Colored buttons generated by JS -->
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

        // Disabling context menu for right click
        document.addEventListener('contextmenu', e => e.preventDefault());

        // Setup scene
        const scene = new THREE.Scene();
        scene.background = new THREE.Color( 0x87CEEB ); // Sky blue
        scene.fog = new THREE.FogExp2( 0x87CEEB, 0.005 );

        // Setup camera
        const camera = new THREE.PerspectiveCamera( 75, window.innerWidth / window.innerHeight, 0.1, 1000 );
        camera.position.y = 10;

        // Setup renderer
        const renderer = new THREE.WebGLRenderer( { antialias: true, powerPreference: "high-performance" } );
        renderer.setPixelRatio( window.devicePixelRatio );
        renderer.setSize( window.innerWidth, window.innerHeight );
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild( renderer.domElement );

        // Controls
        const controls = new PointerLockControls( camera, document.body );
        
        const blocker = document.getElementById( 'blocker' );
        const instructions = document.getElementById( 'instructions' );

        instructions.addEventListener( 'click', function () {
            controls.lock();
        } );

        controls.addEventListener( 'lock', function () {
            instructions.style.display = 'none';
            blocker.style.display = 'none';
        } );

        controls.addEventListener( 'unlock', function () {
            blocker.style.display = 'block';
            instructions.style.display = '';
        } );

        scene.add( controls.getObject() );

        // Lighting
        const hemiLight = new THREE.HemisphereLight( 0xffffff, 0x444444, 0.6 );
        hemiLight.position.set( 0, 200, 0 );
        scene.add( hemiLight );

        const dirLight = new THREE.DirectionalLight( 0xffffff, 0.8 );
        dirLight.position.set( 100, 200, 50 );
        dirLight.castShadow = true;
        dirLight.shadow.camera.top = 200;
        dirLight.shadow.camera.bottom = - 200;
        dirLight.shadow.camera.left = - 200;
        dirLight.shadow.camera.right = 200;
        dirLight.shadow.camera.near = 0.1;
        dirLight.shadow.camera.far = 500;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        scene.add( dirLight );

        // Objects (voxels)
        const objects = [];
        const textureLoader = new THREE.TextureLoader();
        
        // Basic Box Geometry
        const boxGeometry = new THREE.BoxGeometry( 5, 5, 5 );

        // Terrain generation
        const gridHelper = new THREE.GridHelper( 1000, 200, 0x000000, 0x000000 );
        gridHelper.material.opacity = 0.2;
        gridHelper.material.transparent = true;
        scene.add( gridHelper );

        const groundMaterial = new THREE.MeshLambertMaterial( { color: 0x34d399 } );
        const groundGeo = new THREE.PlaneGeometry( 1000, 1000 );
        groundGeo.rotateX( - Math.PI / 2 );
        const ground = new THREE.Mesh( groundGeo, groundMaterial );
        ground.receiveShadow = true;
        scene.add( ground );
        objects.push(ground);

        // Block colors
        const colors = [ 0xef4444, 0x3b82f6, 0x10b981, 0xf59e0b, 0x8b5cf6, 0xec4899, 0x64748b, 0xf8fafc ];
        let currentColor = colors[0];

        // UI for colors
        const colorPicker = document.getElementById('colorPicker');
        const colorBtns = [];
        colors.forEach((c, index) => {
            const btn = document.createElement('div');
            btn.className = 'color-btn';
            if(index === 0) btn.classList.add('active');
            btn.style.backgroundColor = '#' + c.toString(16).padStart(6, '0');
            btn.onclick = (e) => {
                e.stopPropagation();
                currentColor = c;
                colorBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            };
            colorBtns.push(btn);
            colorPicker.appendChild(btn);
        });

        const getMaterial = (colorValue) => {
            return new THREE.MeshLambertMaterial({ 
                color: colorValue
            });
        };

        // Add some random blocks
        for ( let i = 0; i < 300; i ++ ) {
            const mat = getMaterial(colors[Math.floor(Math.random() * colors.length)]);
            const box = new THREE.Mesh( boxGeometry, mat );
            
            // Edges logic
            const edges = new THREE.EdgesGeometry( boxGeometry );
            const line = new THREE.LineSegments( edges, new THREE.LineBasicMaterial( { color: 0x000000, opacity: 0.2, transparent: true } ) );
            box.add( line );

            box.position.x = Math.floor( Math.random() * 40 - 20 ) * 5;
            box.position.y = Math.floor( Math.random() * 8 ) * 5 + 2.5;
            box.position.z = Math.floor( Math.random() * 40 - 20 ) * 5;
            box.castShadow = true;
            box.receiveShadow = true;
            scene.add( box );
            objects.push( box );
        }

        // Raycaster for placing/breaking blocks
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2(0, 0); // Always center

        const placeBlock = () => {
            if (!controls.isLocked) return;
            raycaster.setFromCamera( mouse, camera );
            const intersects = raycaster.intersectObjects( objects, false );
            if ( intersects.length > 0 ) {
                const intersect = intersects[ 0 ];
                
                // create box
                const voxel = new THREE.Mesh( boxGeometry, getMaterial(currentColor) );
                
                // add edges
                const edges = new THREE.EdgesGeometry( boxGeometry );
                const line = new THREE.LineSegments( edges, new THREE.LineBasicMaterial( { color: 0x000000, opacity: 0.2, transparent: true } ) );
                voxel.add( line );
                
                voxel.position.copy( intersect.point ).add( intersect.face.normal );
                voxel.position.divideScalar( 5 ).floor().multiplyScalar( 5 ).addScalar( 2.5 );
                voxel.castShadow = true;
                voxel.receiveShadow = true;
                scene.add( voxel );
                objects.push( voxel );
            }
        };

        const breakBlock = () => {
            if (!controls.isLocked) return;
            raycaster.setFromCamera( mouse, camera );
            const intersects = raycaster.intersectObjects( objects, false );
            if ( intersects.length > 0 ) {
                const intersect = intersects[ 0 ];
                if ( intersect.object !== ground ) {
                    scene.remove( intersect.object );
                    objects.splice( objects.indexOf( intersect.object ), 1 );
                }
            }
        };

        document.addEventListener( 'mousedown', (event) => {
            if (event.button === 0) breakBlock(); // Left click to break
            if (event.button === 2) placeBlock(); // Right click to place
        });

        document.addEventListener('keydown', (event) => {
           if(event.code === 'KeyE') placeBlock(); // Alternate place key
        });

        // Movement variables
        let moveForward = false;
        let moveBackward = false;
        let moveLeft = false;
        let moveRight = false;
        let canJump = false;

        let prevTime = performance.now();
        const velocity = new THREE.Vector3();
        const direction = new THREE.Vector3();

        const onKeyDown = function ( event ) {
            switch ( event.code ) {
                case 'ArrowUp':
                case 'KeyW':
                    moveForward = true;
                    break;
                case 'ArrowLeft':
                case 'KeyA':
                    moveLeft = true;
                    break;
                case 'ArrowDown':
                case 'KeyS':
                    moveBackward = true;
                    break;
                case 'ArrowRight':
                case 'KeyD':
                    moveRight = true;
                    break;
                case 'Space':
                    if ( canJump === true ) velocity.y += 120; // Jump force
                    canJump = false;
                    break;
            }
        };

        const onKeyUp = function ( event ) {
            switch ( event.code ) {
                case 'ArrowUp':
                case 'KeyW':
                    moveForward = false;
                    break;
                case 'ArrowLeft':
                case 'KeyA':
                    moveLeft = false;
                    break;
                case 'ArrowDown':
                case 'KeyS':
                    moveBackward = false;
                    break;
                case 'ArrowRight':
                case 'KeyD':
                    moveRight = false;
                    break;
            }
        };

        document.addEventListener( 'keydown', onKeyDown );
        document.addEventListener( 'keyup', onKeyUp );

        // Crosshair line builder frame
        const rollOverGeo = new THREE.BoxGeometry( 5.1, 5.1, 5.1 );
        const rollOverMaterial = new THREE.MeshBasicMaterial( { color: 0xffffff, opacity: 0.5, transparent: true, wireframe: true } );
        const rollOverMesh = new THREE.Mesh( rollOverGeo, rollOverMaterial );
        scene.add( rollOverMesh );

        function animate() {
            requestAnimationFrame( animate );

            const time = performance.now();

            if ( controls.isLocked === true ) {
                // Update raycaster for block preview
                raycaster.setFromCamera( mouse, camera );
                const intersects = raycaster.intersectObjects( objects, false );
                if ( intersects.length > 0 ) {
                    const intersect = intersects[ 0 ];
                    rollOverMesh.position.copy( intersect.point ).add( intersect.face.normal );
                    rollOverMesh.position.divideScalar( 5 ).floor().multiplyScalar( 5 ).addScalar( 2.5 );
                    rollOverMesh.visible = true;
                    rollOverMaterial.color.setHex(currentColor);
                } else {
                    rollOverMesh.visible = false;
                }

                const delta = ( time - prevTime ) / 1000;

                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;

                velocity.y -= 9.8 * 60.0 * delta; // 60.0 = gravity multiplier

                direction.z = Number( moveForward ) - Number( moveBackward );
                direction.x = Number( moveRight ) - Number( moveLeft );
                direction.normalize(); // this ensures consistent movements in all directions

                const speed = 250.0;

                if ( moveForward || moveBackward ) velocity.z -= direction.z * speed * delta;
                if ( moveLeft || moveRight ) velocity.x -= direction.x * speed * delta;

                controls.moveRight( - velocity.x * delta );
                controls.moveForward( - velocity.z * delta );

                controls.getObject().position.y += ( velocity.y * delta );

                // Collision with floor (y < 10 since eye height is 10)
                if ( controls.getObject().position.y < 10 ) {
                    velocity.y = 0;
                    controls.getObject().position.y = 10;
                    canJump = true;
                }
            }

            prevTime = time;

            renderer.render( scene, camera );
        }

        animate();

        window.addEventListener( 'resize', onWindowResize );

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize( window.innerWidth, window.innerHeight );
        }

    </script>
</body>
</html>
