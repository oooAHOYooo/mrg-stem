<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sonic 2 | MGE STEM</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --mge-primary: #0047ff;
            --mge-secondary: #2c3e50;
            --mge-accent: #f1c40f;
            --mge-gold: #ffcc00;
            --mge-tails: #ffcc00;
            --glass-dark: rgba(0, 0, 0, 0.9);
            --neon-blue: 0 0 20px rgba(0, 71, 255, 0.8);
            --neon-gold: 0 0 20px rgba(255, 204, 0, 0.8);
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #adeafa;
            font-family: 'Outfit', sans-serif; color: white;
        }

        #canvas-container { position: absolute; inset: 0; z-index: 0; }

        #ui-root {
            position: absolute; inset: 0;
            pointer-events: none; z-index: 100;
            display: flex; flex-direction: column; justify-content: space-between; padding: 20px;
        }

        .header { display: flex; justify-content: space-between; align-items: flex-start; pointer-events: auto; width: 100%; }
        .hud-group { display: flex; gap: 10px; }
        .mge-badge { background: linear-gradient(135deg, var(--mge-primary), #5dade2); padding: 10px 20px; border-radius: 12px; font-weight: 900; font-size: 1.2rem; box-shadow: var(--neon-blue); text-transform: uppercase; }
        .timer-display { background: var(--glass-dark); padding: 5px 25px; border-radius: 50px; border: 2px solid rgba(255, 255, 255, 0.3); font-size: 2.2rem; font-weight: 900; }
        .hud-card { background: var(--glass-dark); padding: 8px 16px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.15); display: flex; flex-direction: column; min-width: 100px; transition: transform 0.2s; }
        .hud-card.pulse { transform: scale(1.1); border-color: var(--mge-gold); }
        .hud-label { font-size: 0.6rem; color: rgba(255,255,255,0.6); text-transform: uppercase; font-weight: 800; }
        .hud-value { font-size: 1.6rem; font-weight: 900; }

        .key-box { width: 35px; height: 35px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 6px; display: flex; justify-content: center; align-items: center; font-weight: 900; font-size: 0.7rem; color: rgba(255,255,255,0.5); }
        .key-box.active { background: var(--mge-primary); color: white; box-shadow: var(--neon-blue); transform: scale(0.9); }

        #start-screen {
            position: fixed; inset: 0; background: #adeafa;
            display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 1500;
        }

        .start-btn {
            background: linear-gradient(135deg, var(--mge-primary), #00a2ff);
            border: none; color: white; padding: 18px 35px; font-size: 1.4rem; font-weight: 900;
            border-radius: 12px; cursor: pointer; box-shadow: 0 8px 20px rgba(0, 71, 255, 0.3);
            transition: all 0.2s; pointer-events: auto;
        }
        .start-btn:hover { transform: scale(1.05); filter: brightness(1.1); }

        #notification {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.8);
            padding: 15px 35px; border-radius: 40px; background: rgba(0, 0, 0, 0.85);
            border: 2px solid var(--mge-gold); font-size: 2rem; font-weight: 900; color: #fff;
            opacity: 0; transition: all 0.4s; z-index: 500; text-align: center;
        }
        #notification.active { opacity: 1; transform: translate(-50%, -50%) scale(1); }

        /* Liquid Glass Controls */
        .controls-overlay {
            position: absolute;
            bottom: 30px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: none;
            z-index: 200;
        }
        #p1-controls { left: 30px; }
        #p2-controls { right: 30px; align-items: flex-end; }

        .control-row { display: flex; gap: 8px; }
        
        .liquid-key {
            width: 48px;
            height: 48px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 900;
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.4);
            transition: all 0.15s cubic-bezier(0.23, 1, 0.32, 1);
            box-shadow: 
                0 4px 15px rgba(0,0,0,0.2),
                inset 0 0 0 1px rgba(255,255,255,0.05);
            position: relative;
            overflow: hidden;
        }

        .liquid-key::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, rgba(255,255,255,0.8) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .liquid-key.jump-key { width: 110px; font-size: 0.8rem; letter-spacing: 1px; }

        .liquid-key.active {
            color: #fff;
            transform: scale(0.92) translateY(3px);
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.5);
            box-shadow: 
                0 0 30px rgba(255, 255, 255, 0.15),
                inset 0 0 15px rgba(255, 255, 255, 0.1);
        }
        
        .liquid-key.active::after {
            opacity: 0.2;
            animation: liquid-ripple 0.6s infinite alternate;
        }

        @keyframes liquid-ripple {
            0% { transform: scale(0.8); opacity: 0.1; }
            100% { transform: scale(1.2); opacity: 0.3; }
        }

        #p1-controls .liquid-key.active {
            background: rgba(0, 71, 255, 0.5);
            border-color: rgba(0, 100, 255, 0.8);
            box-shadow: 0 0 40px rgba(0, 71, 255, 0.6), inset 0 0 20px rgba(255, 255, 255, 0.2);
        }

        #p2-controls .liquid-key.active {
            background: rgba(255, 204, 0, 0.5);
            border-color: rgba(255, 230, 0, 0.8);
            box-shadow: 0 0 40px rgba(255, 204, 0, 0.6), inset 0 0 20px rgba(255, 255, 255, 0.2);
        }

        .liquid-key svg { width: 22px; height: 22px; fill: currentColor; }

        .blip-knuckles { background: #ff0000; box-shadow: 0 0 10px #ff0000; border: 1px solid white; }
        
        /* Radar Styles */
        .radar-container {
            position: absolute;
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(8px);
            border: 2px solid rgba(255, 255, 255, 0.2);
            overflow: hidden;
            pointer-events: none;
            display: none;
        }
        .radar-map { position: absolute; width: 100%; height: 100%; }
        .radar-center {
            position: absolute; top: 50%; left: 50%;
            width: 6px; height: 6px; background: #fff;
            border-radius: 50%; transform: translate(-50%, -50%);
            box-shadow: 0 0 10px #fff; z-index: 10;
        }
        .radar-blip {
            position: absolute; width: 8px; height: 8px;
            border-radius: 50%; transform: translate(-50%, -50%);
            z-index: 5;
        }
        .blip-p1 { background: #0047ff; box-shadow: 0 0 10px #0047ff; }
        .blip-p2 { background: #ffcc00; box-shadow: 0 0 10px #ffcc00; }
        .blip-boss { background: #ff00ff; box-shadow: 0 0 15px #ff00ff; border: 2px solid #fff; width: 12px; height: 12px; }

        /* Health Bar Styles */
        .hp-bar-bg { width: 100%; height: 8px; background: rgba(255,255,255,0.1); border-radius: 10px; margin-top: 5px; overflow: hidden; border: 1px solid rgba(255,255,255,0.05); }
        .hp-bar-fill { width: 100%; height: 100%; background: linear-gradient(90deg, #2ecc71, #27ae60); transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1), background 0.3s; }
        .hp-bar-fill.warning { background: linear-gradient(90deg, #f1c40f, #f39c12); }
        .hp-bar-fill.critical { background: linear-gradient(90deg, #e74c3c, #c0392b); }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>
</head>
<body>

    <div id="canvas-container"></div>
    <div id="split-line" style="position:fixed; left:50%; width:4px; height:100%; background:rgba(255,255,255,0.2); display:none; z-index:50;"></div>

    <div id="loading-screen" style="position:fixed; inset:0; background:#adeafa; display:flex; justify-content:center; align-items:center; z-index:2000;">
        <div style="text-align: center;">
            <div style="font-size: 5rem;">🌴🦍🦔</div>
            <h1 style="letter-spacing: 10px; color:#111;">SONIC JUNGLE</h1>
            <div style="width: 200px; height: 6px; background: rgba(0,0,0,0.1); border-radius: 3px; margin: 20px auto; overflow: hidden;">
                <div id="loader-fill" style="width: 0%; height: 100%; background: #0047ff;"></div>
            </div>
        </div>
    </div>

    <div id="start-screen">
        <h1 style="font-size: 6rem; font-weight: 900; margin: 0; color: #111; text-shadow: 0 0 20px rgba(0,0,0,0.1);">SONIC 2</h1>
        <p style="font-size: 1.4rem; color: #555;">Team up with Tails | 3-Minute Challenge | Ultimate Rivals</p>
        <div style="display:flex; gap:20px; margin-top:40px;">
            <button class="start-btn" id="btn-1p">1 PLAYER</button>
            <button class="start-btn" id="btn-2p" style="background: linear-gradient(135deg, #f39c12, #e67e22);">2 PLAYER</button>
        </div>
    </div>

    <div id="ui-root">
        <div class="header">
            <div class="hud-group" style="flex-direction: column;">
                <div class="mge-badge">P1: SONIC</div>
                <div class="hud-card" id="p1-card"><span class="hud-label">Rings</span><span class="hud-value" id="p1-rings" style="color:#5dade2;">0</span></div>
                <div class="hud-card"><span class="hud-label">Health</span><div class="hp-bar-bg"><div id="p1-hp-fill" class="hp-bar-fill"></div></div></div>
            </div>
            <div class="top-center-stats">
                <div class="timer-display" id="timer-display">03:00</div>
            </div>
            <div class="hud-group" id="p2-ui" style="flex-direction: column; align-items: flex-end; display: none;">
                <div class="mge-badge" style="background: #f39c12;">P2: TAILS</div>
                <div class="hud-card" id="p2-card" style="align-items: flex-end;"><span class="hud-label">Rings</span><span class="hud-value" id="p2-rings" style="color:var(--mge-gold);">0</span></div>
                <div class="hud-card" style="align-items: flex-end;"><span class="hud-label">Health</span><div class="hp-bar-bg"><div id="p2-hp-fill" class="hp-bar-fill"></div></div></div>
            </div>
        </div>
        <div id="notification">GO!</div>
        
        <!-- Premium Liquid Controls Overlay -->
        <div id="p1-controls" class="controls-overlay">
            <div class="control-row" style="justify-content: center;">
                <div class="liquid-key" id="key-KeyW">W</div>
            </div>
            <div class="control-row">
                <div class="liquid-key" id="key-KeyA">A</div>
                <div class="liquid-key" id="key-KeyS">S</div>
                <div class="liquid-key" id="key-KeyD">D</div>
            </div>
            <div class="control-row" style="justify-content: center; margin-top: 5px;">
                <div class="liquid-key jump-key" id="key-Space">SPACE</div>
            </div>
        </div>

        <div id="p2-controls" class="controls-overlay" style="display: none;">
            <div class="control-row" style="justify-content: center;">
                <div class="liquid-key" id="key-ArrowUp">↑</div>
            </div>
            <div class="control-row">
                <div class="liquid-key" id="key-ArrowLeft">←</div>
                <div class="liquid-key" id="key-ArrowDown">↓</div>
                <div class="liquid-key" id="key-ArrowRight">→</div>
            </div>
            <div class="control-row" style="justify-content: center; margin-top: 5px;">
                <div class="liquid-key jump-key" id="key-ShiftRight" style="font-size: 0.7rem;">R-SHIFT</div>
            </div>
        </div>

        <!-- Radars -->
        <div id="p1-radar" class="radar-container" style="bottom: 230px; left: 30px; transform: scale(0.8); transform-origin: bottom left;">
            <div class="radar-map" id="p1-map"></div>
            <div class="radar-center"></div>
        </div>
        <div id="p2-radar" class="radar-container" style="bottom: 230px; right: 30px; left: auto; transform: scale(0.8); transform-origin: bottom right;">
            <div class="radar-map" id="p2-map"></div>
            <div class="radar-center"></div>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';

        const CONFIG = {
            ACCEL: 0.12, MAX_SPEED: 2.5, DRAG: 0.98, GRAVITY: -0.025, JUMP: 0.92,
            MAGNET: 35, WORLD: 2500, SKY: 0xadeafa,
            FLOOR_GREEN: 0x5cd61e, FLOOR_GREEN_DARK: 0x4aa618, ISLAND_GREEN: 0x2e7d32,
            BOSS_THRESHOLD: 100, // Matches changelog
        };

        const state = { 
            started: false, 
            is2P: false, 
            time: 180, 
            lastFrame: performance.now(), 
            keys: {}, 
            bossSpawned: false,
            objects: { rings: [], islands: [], butterflies: [], clouds: [], speedLines: [], trails: [], seekers: [], boss: null, pets: [], enemies: [] } 
        };
        const players = [
            { obj: null, pos: new THREE.Vector3(0,1.8,0), vel: new THREE.Vector3(), yaw: 0, rings: 0, health: 100, onGround: false, trick: 0, color: 0x3366ff, shake: 0, pet: null },
            { obj: null, pos: new THREE.Vector3(-40,1.8,-40), vel: new THREE.Vector3(), yaw: 0, rings: 0, health: 100, onGround: false, trick: 0, color: 0xffcc00, shake: 0, pet: null }
        ];

        let scene, renderer, cam1, cam2;

        function init() {
            try {
                scene = new THREE.Scene();
                scene.background = new THREE.Color(CONFIG.SKY);
                scene.fog = new THREE.FogExp2(CONFIG.SKY, 0.002);

                const container = document.getElementById('canvas-container');
                if (!container) throw new Error("Canvas container not found");

                renderer = new THREE.WebGLRenderer({ antialias: true });
                renderer.setSize(window.innerWidth, window.innerHeight);
                renderer.shadowMap.enabled = true;
                container.appendChild(renderer.domElement);

                cam1 = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 8000);
                cam1.position.set(0, 10, -30);
                cam2 = new THREE.PerspectiveCamera(75, window.innerWidth/2/window.innerHeight, 0.1, 8000);

                const ambient = new THREE.AmbientLight(0xffffff, 0.6); scene.add(ambient);
                const sun = new THREE.DirectionalLight(0xffffff, 1.2); sun.position.set(100, 200, 100); sun.castShadow = true;
                sun.shadow.mapSize.width = sun.shadow.mapSize.height = 2048; scene.add(sun);

                createWorld();
                players[0].obj = createPlayerMesh(players[0]);
                players[1].obj = createPlayerMesh(players[1]);

                for(let i=0; i<500; i++) spawnRing(Math.random() < 0.2);
                for(let i=0; i<30; i++) spawnJungleSeeker();
                for(let i=0; i<80; i++) createJungleTree((Math.random()-0.5)*CONFIG.WORLD, (Math.random()-0.5)*CONFIG.WORLD);
                for(let i=0; i<30; i++) createFloatingIsland((Math.random()-0.5)*CONFIG.WORLD*0.8, 50 + Math.random()*80, (Math.random()-0.5)*CONFIG.WORLD*0.8);
                for(let i=0; i<50; i++) spawnButterfly();
                for(let i=0; i<15; i++) {
                    const x = (Math.random()-0.5)*CONFIG.WORLD;
                    const z = (Math.random()-0.5)*CONFIG.WORLD;
                    state.objects.enemies.push(createKnucklesEnemy(x, z));
                }

                players.forEach((p, i) => { p.pet = createPet(p, i); });

                window.addEventListener('keydown', e => { 
                    if(e.code === 'Space' && state.started && !players[0].onGround && players[0].trick === 0) players[0].trick=1;
                    if(e.code === 'ShiftRight' && state.is2P && !players[1].onGround && players[1].trick === 0) players[1].trick=1;
                    state.keys[e.code] = true;
                    const keyEl = document.getElementById(`key-${e.code}`);
                    if(keyEl) keyEl.classList.add('active');
                });
                window.addEventListener('keyup', e => {
                    state.keys[e.code] = false;
                    const keyEl = document.getElementById(`key-${e.code}`);
                    if(keyEl) keyEl.classList.remove('active');
                });

                window.addEventListener('resize', () => {
                    const w = window.innerWidth, h = window.innerHeight;
                    renderer.setSize(w, h);
                    cam1.aspect = w / h;
                    cam1.updateProjectionMatrix();
                    cam2.aspect = (w/2) / h;
                    cam2.updateProjectionMatrix();
                });

                const btn1p = document.getElementById('btn-1p');
                const btn2p = document.getElementById('btn-2p');
                if(btn1p) btn1p.onclick = () => startGame(false);
                if(btn2p) btn2p.onclick = () => startGame(true);

                animate();

                let p = 0; const iv = setInterval(() => { 
                    p += 4; if(p > 100) p = 100;
                    const fill = document.getElementById('loader-fill'); if(fill) fill.style.width = p+'%';
                    if(p >= 100) { 
                        clearInterval(iv); 
                        const ls = document.getElementById('loading-screen'); if(ls) ls.style.display='none'; 
                        const ss = document.getElementById('start-screen'); if(ss) ss.style.display='flex'; 
                    }
                }, 30);
            } catch (err) {
                console.error("Sonic 2 Init Error:", err);
                const ls = document.getElementById('loading-screen');
                if (ls) ls.innerHTML = `<div style="color:white; text-align:center;"><h2>ERROR LOADING</h2><p>${err.message}</p></div>`;
            }
        }

        function createWorld() {
            const canvas = document.createElement('canvas'); canvas.width = 64; canvas.height = 64;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#' + CONFIG.FLOOR_GREEN.toString(16).padStart(6, '0'); ctx.fillRect(0, 0, 64, 64);
            ctx.fillStyle = '#' + CONFIG.FLOOR_GREEN_DARK.toString(16).padStart(6, '0');
            ctx.fillRect(0, 0, 32, 32); ctx.fillRect(32, 32, 32, 32);
            const tex = new THREE.CanvasTexture(canvas); tex.wrapS = tex.wrapT = THREE.RepeatWrapping; tex.repeat.set(100, 100); tex.magFilter = THREE.NearestFilter;
            const floor = new THREE.Mesh(new THREE.PlaneGeometry(CONFIG.WORLD + 600, CONFIG.WORLD + 600), new THREE.MeshStandardMaterial({ map: tex, roughness: 1 }));
            floor.rotation.x = -Math.PI/2; floor.receiveShadow = true; scene.add(floor);

            // Level Boundaries (Neon Walls)
            const wallGeo = new THREE.PlaneGeometry(CONFIG.WORLD, 500);
            const wallMat = new THREE.MeshBasicMaterial({ 
                color: 0x00ffff, 
                transparent: true, 
                opacity: 0.1, 
                side: THREE.DoubleSide,
                wireframe: true
            });
            
            const wallPositions = [
                { x: 0, z: CONFIG.WORLD/2, rot: 0 },
                { x: 0, z: -CONFIG.WORLD/2, rot: 0 },
                { x: CONFIG.WORLD/2, z: 0, rot: Math.PI/2 },
                { x: -CONFIG.WORLD/2, z: 0, rot: Math.PI/2 }
            ];

            wallPositions.forEach(p => {
                const wall = new THREE.Mesh(wallGeo, wallMat);
                wall.position.set(p.x, 250, p.z);
                wall.rotation.y = p.rot;
                scene.add(wall);
                
                // Add a glow line at the top and bottom
                const beam = new THREE.Mesh(new THREE.BoxGeometry(CONFIG.WORLD, 2, 2), new THREE.MeshBasicMaterial({ color: 0x00ffff }));
                beam.position.set(p.x, 1, p.z);
                beam.rotation.y = p.rot;
                scene.add(beam);
            });
        }

        function createPlayerMesh(p) {
            const g = new THREE.Group();
            const sphere = new THREE.Mesh(new THREE.SphereGeometry(1.8, 24, 24), new THREE.MeshStandardMaterial({ color: p.color, roughness: 0.1, metalness: 0.7 }));
            sphere.castShadow = true; g.add(sphere);
            const eye = new THREE.Mesh(new THREE.SphereGeometry(0.5, 8, 8), new THREE.MeshBasicMaterial({ color: 0xffffff }));
            eye.position.set(0.7, 0.7, 1.3); g.add(eye);
            const eye2 = eye.clone(); eye2.position.x = -0.7; g.add(eye2);
            scene.add(g); return g;
        }

        function spawnRing(blue) {
            const color = blue ? 0x00ffff : 0xffcc00;
            const r = new THREE.Mesh(new THREE.TorusGeometry(1.4, 0.4, 8, 12), new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 0.5 }));
            r.position.set((Math.random()-0.5)*CONFIG.WORLD, 4 + Math.random()*80, (Math.random()-0.5)*CONFIG.WORLD);
            r.userData = { blue }; scene.add(r); state.objects.rings.push(r);
        }

        function createFloatingIsland(x, y, z) {
            const g = new THREE.Group();
            const w = 50 + Math.random()*60;
            const top = new THREE.Mesh(new THREE.BoxGeometry(w, 10, w), new THREE.MeshStandardMaterial({ color: CONFIG.ISLAND_GREEN }));
            top.receiveShadow = true; top.castShadow = true; g.add(top);
            g.position.set(x, y, z); scene.add(g);
            state.objects.islands.push({ obj: g, x, y, z, valY: y, phase: Math.random()*Math.PI*2, range: 40 + Math.random()*60, w, velY: 0 });
        }

        function createJungleTree(x, z) {
            if(Math.abs(x) < 50 && Math.abs(z) < 50) return;
            const g = new THREE.Group();
            const h = 40 + Math.random()*40;
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(2, 3, h, 6), new THREE.MeshStandardMaterial({ color: 0x5d4037 }));
            trunk.position.y = h/2; g.add(trunk);
            const leaves = new THREE.Mesh(new THREE.SphereGeometry(20, 6, 4), new THREE.MeshStandardMaterial({ color: 0x2e7d32 }));
            leaves.position.y = h; g.add(leaves);
            g.position.set(x, 0, z); scene.add(g);
        }

        function spawnButterfly() {
            const b = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide }));
            b.position.set((Math.random()-0.5)*CONFIG.WORLD, 10 + Math.random()*40, (Math.random()-0.5)*CONFIG.WORLD);
            b.userData = { phase: Math.random()*Math.PI }; scene.add(b); state.objects.butterflies.push(b);
        }

        function spawnJungleSeeker() {
            const g = new THREE.Mesh(new THREE.SphereGeometry(2.5, 6, 6), new THREE.MeshStandardMaterial({ color: 0xffdf00 }));
            g.position.set((Math.random()-0.5)*CONFIG.WORLD, 20 + Math.random()*80, (Math.random()-0.5)*CONFIG.WORLD);
            g.userData = { angle: Math.random()*Math.PI*2, speed: 0.2 }; scene.add(g); state.objects.seekers.push(g);
        }

        function createPet(p, i) {
            const g = new THREE.Group();
            const body = new THREE.Mesh(new THREE.SphereGeometry(1, 16, 16), new THREE.MeshStandardMaterial({ color: p.color, emissive: p.color, emissiveIntensity: 0.2 }));
            g.add(body);

            // Googly Eyes
            const eyeGroup = new THREE.Group();
            const whiteGeo = new THREE.SphereGeometry(0.3, 8, 8);
            const pupilGeo = new THREE.SphereGeometry(0.12, 8, 8);
            
            for(let x of [-0.4, 0.4]) {
                const eye = new THREE.Mesh(whiteGeo, new THREE.MeshBasicMaterial({ color: 0xffffff }));
                eye.position.set(x, 0.2, 0.8);
                const pupil = new THREE.Mesh(pupilGeo, new THREE.MeshBasicMaterial({ color: 0x000000 }));
                pupil.position.z = 0.2;
                eye.add(pupil);
                eyeGroup.add(eye);
            }
            g.add(eyeGroup);
            scene.add(g);

            const pet = { 
                obj: g, 
                eyes: eyeGroup, 
                owner: p, 
                pos: p.pos.clone().add(new THREE.Vector3(5, 5, 5)), 
                hp: 100, 
                shake: 0,
                id: i 
            };
            state.objects.pets.push(pet);
            return pet;
        }

        function createKnucklesEnemy(x, z) {
            const g = new THREE.Group();
            // Body
            const body = new THREE.Mesh(new THREE.SphereGeometry(2.8, 16, 16), new THREE.MeshStandardMaterial({ color: 0xff0000, roughness: 0.2 }));
            body.castShadow = true;
            g.add(body);
            
            // Fists
            const fistGeo = new THREE.SphereGeometry(1.2, 8, 8);
            const fistMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
            const lf = new THREE.Mesh(fistGeo, fistMat);
            lf.position.set(2.8, -0.5, 1.8);
            g.add(lf);
            const rf = new THREE.Mesh(fistGeo, fistMat);
            rf.position.set(-2.8, -0.5, 1.8);
            g.add(rf);

            // Dreadlocks (Knuckles style)
            const dreadGeo = new THREE.CapsuleGeometry(0.8, 4, 4, 8);
            const dreadMat = new THREE.MeshStandardMaterial({ color: 0xcc0000 });
            for(let i=0; i<3; i++) {
                const d1 = new THREE.Mesh(dreadGeo, dreadMat);
                d1.position.set(2 - i*0.5, 0, -2);
                d1.rotation.x = Math.PI/3;
                g.add(d1);
                const d2 = d1.clone();
                d2.position.x = -d1.position.x;
                g.add(d2);
            }

            // Eyes
            const eyeGeo = new THREE.SphereGeometry(0.7, 8, 8);
            const eyeMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
            const le = new THREE.Mesh(eyeGeo, eyeMat);
            le.position.set(0.9, 0.9, 2.2);
            g.add(le);
            const re = new THREE.Mesh(eyeGeo, eyeMat);
            re.position.set(-0.9, 0.9, 2.2);
            g.add(re);
            
            // Pupils (angry)
            const pupilGeo = new THREE.SphereGeometry(0.25, 8, 8);
            const pupilMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
            const lp = new THREE.Mesh(pupilGeo, pupilMat);
            lp.position.z = 0.5;
            le.add(lp);
            const rp = new THREE.Mesh(pupilGeo, pupilMat);
            rp.position.z = 0.5;
            re.add(rp);

            g.position.set(x, 2.8, z);
            scene.add(g);
            
            // Health bar for Knuckles
            const hbBgGeo = new THREE.PlaneGeometry(5, 0.4);
            const hbBgMat = new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.5 });
            const hbBg = new THREE.Mesh(hbBgGeo, hbBgMat);
            hbBg.position.y = 5.5;
            g.add(hbBg);

            const hbFillGeo = new THREE.PlaneGeometry(5, 0.4);
            const hbFillMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
            const hbFill = new THREE.Mesh(hbFillGeo, hbFillMat);
            hbFill.position.z = 0.01;
            hbBg.add(hbFill);

            return {
                obj: g,
                pos: g.position.clone(),
                vel: new THREE.Vector3(),
                speed: 1.2 + Math.random() * 0.8,
                alive: true,
                health: 100,
                hbFill: hbFill,
                hitCooldown: 0,
                squishTime: 0,
                targetRing: null
            };
        }

        function spawnBoss() {
            if (state.bossSpawned) return;
            state.bossSpawned = true;
            
            const group = new THREE.Group();
            
            // Core Pod
            const pod = new THREE.Mesh(
                new THREE.SphereGeometry(6, 32, 16, 0, Math.PI*2, 0, Math.PI/2), 
                new THREE.MeshStandardMaterial({ color: 0x444444, metalness: 0.8, roughness: 0.2 })
            );
            pod.rotation.x = Math.PI;
            group.add(pod);
            
            // Cockpit glass
            const glass = new THREE.Mesh(
                new THREE.SphereGeometry(5.8, 16, 16, 0, Math.PI*2, 0, Math.PI/2),
                new THREE.MeshStandardMaterial({ color: 0x00ffff, transparent: true, opacity: 0.4 })
            );
            glass.position.y = 1;
            group.add(glass);

            // Red body
            const body = new THREE.Mesh(new THREE.SphereGeometry(4, 16, 16), new THREE.MeshStandardMaterial({ color: 0xff0000 }));
            body.position.y = -1;
            group.add(body);

            // Jet Flame
            const flame = new THREE.Mesh(new THREE.ConeGeometry(2, 6, 8), new THREE.MeshBasicMaterial({ color: 0xffaa00 }));
            flame.position.y = 4;
            flame.rotation.x = Math.PI;
            group.add(flame);

            group.position.set(0, 100, 0);
            scene.add(group);
            state.objects.boss = { 
                obj: group, 
                hp: 10, 
                target: new THREE.Vector3(),
                angle: 0,
                pulse: 0
            };

            showNotification("BOSS INBOUND!", 3000);
        }

        function showNotification(text, duration = 2000) {
            const n = document.getElementById('notification');
            if (n) {
                n.innerText = text;
                n.classList.add('active');
                setTimeout(() => n.classList.remove('active'), duration);
            }
        }

        function startGame(split) {
            state.is2P = split; state.started = true;
            document.getElementById('start-screen').style.display='none';
            document.getElementById('p1-radar').style.display='block';
            if(split) { 
                document.getElementById('p2-ui').style.display='flex'; 
                document.getElementById('split-line').style.display='block'; 
                document.getElementById('p2-radar').style.display='block';
                document.getElementById('p2-controls').style.display='flex';
            }
            setInterval(() => { if(state.started && state.time > 0) { state.time--; updateTimerUI(); if(state.time<=0) location.reload(); } }, 1000);
        }

        function animate() {
            requestAnimationFrame(animate);
            const now = performance.now();
            const delta = Math.min((now - state.lastFrame)/1000, 0.1);
            state.lastFrame = now;
            if(state.started) {
                state.objects.islands.forEach(isl => {
                    isl.phase += delta * 0.8;
                    const prevY = isl.obj.position.y;
                    isl.obj.position.y = isl.valY + Math.sin(isl.phase) * isl.range;
                    isl.velY = isl.obj.position.y - prevY;
                });
                state.objects.butterflies.forEach(b => { b.userData.phase += delta*5; b.position.y += Math.sin(b.userData.phase)*0.1; b.rotation.y += delta*2; });
                state.objects.seekers.forEach(s => { s.userData.angle += delta; s.position.x += Math.sin(s.userData.angle)*s.userData.speed; });
                updatePlayers(delta);
                updatePets(delta);
                updateLogic(delta);
                updateRadar();
                render();
            } else if(players[0].obj) {
                players[0].obj.rotation.y += delta;
                renderer.render(scene, cam1);
            }
        }

        function updatePlayers(delta) {
            handleInput(0, 'KeyW', 'KeyS', 'KeyA', 'KeyD', 'Space');
            if(state.is2P) handleInput(1, 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'ShiftRight');
            else {
                const target = players[0].pos.clone().add(new THREE.Vector3(-Math.sin(players[0].yaw)*15, 2, -Math.cos(players[0].yaw)*15));
                players[1].pos.lerp(target, 0.1); players[1].obj.position.copy(players[1].pos);
            }
            players.forEach(p => {
                if(!p.onGround) p.vel.y += CONFIG.GRAVITY;
                p.vel.x *= CONFIG.DRAG; p.vel.z *= CONFIG.DRAG;
                p.pos.add(p.vel);
                let groundY = 1.8; let pVel = 0;
                for (const isl of state.objects.islands) {
                    const dx = p.pos.x - isl.obj.position.x; const dz = p.pos.z - isl.obj.position.z;
                    if(Math.abs(dx) < isl.w/2 && Math.abs(dz) < isl.w/2) {
                        if(p.pos.y > isl.obj.position.y + 2) { groundY = Math.max(groundY, isl.obj.position.y + 6.8); if(groundY === isl.obj.position.y+6.8) pVel = isl.velY; }
                    }
                }
                if(p.pos.y < groundY) { p.pos.y = groundY; p.vel.y = 0; p.onGround = true; p.pos.y += pVel; p.trick = 0; } else if(p.pos.y > groundY + 1) { p.onGround = false; }
                const s = p.vel.length();
                if(s > 1.2) spawnSpeedLine(p, s);
                if(p.trick > 0) { p.obj.rotation.x += delta*30; }
                p.obj.position.copy(p.pos); p.obj.rotation.y = p.yaw;
                if(p.shake > 0) p.shake -= delta*10;

                // Level Boundaries Collision
                const half = CONFIG.WORLD / 2;
                if (Math.abs(p.pos.x) > half) { p.pos.x = Math.sign(p.pos.x) * half; p.vel.x = 0; p.shake = 5; }
                if (Math.abs(p.pos.z) > half) { p.pos.z = Math.sign(p.pos.z) * half; p.vel.z = 0; p.shake = 5; }
            });
            for(let i=state.objects.speedLines.length-1; i>=0; i--) {
                const l = state.objects.speedLines[i]; l.material.opacity -= 0.1;
                if(l.material.opacity <= 0) { scene.remove(l); state.objects.speedLines.splice(i,1); }
            }
        }

        function updatePets(delta) {
            state.objects.pets.forEach(pet => {
                const target = pet.owner.pos.clone().add(new THREE.Vector3(
                    Math.sin(performance.now()*0.001 + pet.id)*8,
                    4 + Math.sin(performance.now()*0.002)*2,
                    Math.cos(performance.now()*0.001 + pet.id)*8
                ));
                pet.pos.lerp(target, 0.05);
                pet.obj.position.copy(pet.pos);
                
                // Googly eyes follow owner
                pet.eyes.lookAt(pet.owner.pos);
                
                // Floating animation
                pet.obj.rotation.y += delta;
                
                if (pet.shake > 0) {
                    pet.shake -= delta * 10;
                    pet.obj.position.add(new THREE.Vector3((Math.random()-0.5)*pet.shake, (Math.random()-0.5)*pet.shake, (Math.random()-0.5)*pet.shake));
                    pet.obj.children[0].material.color.setHex(0xff0000);
                } else {
                    pet.obj.children[0].material.color.setHex(pet.owner.color);
                }

                if (pet.hp < 100) pet.hp += delta * 2; // Slow recovery
            });
        }

        function handleInput(i, f, b, l, r, j) {
            const p = players[i];
            if(state.keys[l]) p.yaw += 0.1; if(state.keys[r]) p.yaw -= 0.1;
            if(state.keys[f]) { p.vel.x += Math.sin(p.yaw)*CONFIG.ACCEL; p.vel.z += Math.cos(p.yaw)*CONFIG.ACCEL; }
            if(state.keys[b]) { p.vel.x -= Math.sin(p.yaw)*CONFIG.ACCEL; p.vel.z -= Math.cos(p.yaw)*CONFIG.ACCEL; }
            if(state.keys[j] && p.onGround) { p.vel.y = CONFIG.JUMP; p.onGround = false; }
        }

        function spawnSpeedLine(p, s) {
            const mat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.8 });
            const l = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.2, 10), mat);
            l.position.copy(p.pos).add(new THREE.Vector3((Math.random()-0.5)*10,(Math.random()-0.5)*10,(Math.random()-0.5)*10));
            scene.add(l); state.objects.speedLines.push(l);
        }

        function updateLogic(delta) {
            for(let i=state.objects.rings.length-1; i>=0; i--) {
                const r = state.objects.rings[i];
                players.forEach((p, idx) => {
                    const d = r.position.distanceTo(p.pos);
                    if(d < CONFIG.MAGNET) { 
                        r.position.lerp(p.pos, 0.4); 
                        if(d < 5) { 
                            scene.remove(r); state.objects.rings.splice(i,1); p.rings += r.userData.blue ? 5 : 1; 
                            updateUI(); 
                            if (p.rings >= CONFIG.BOSS_THRESHOLD && !state.bossSpawned) spawnBoss();
                            const card = document.getElementById(`p${idx+1}-card`); if(card) { card.classList.add('pulse'); setTimeout(() => card.classList.remove('pulse'), 200); }
                        } 
                    }
                });
            }
            if (state.objects.boss) {
                const b = state.objects.boss;
                b.angle += delta * 0.5;
                const targetIdx = Math.floor(b.angle % players.length);
                const targetPos = players[targetIdx].pos.clone();
                targetPos.y += 20 + Math.sin(b.angle * 2) * 10;
                b.obj.position.lerp(targetPos, 0.02);
                b.obj.lookAt(players[targetIdx].pos);
                
                players.forEach(p => {
                    if (b.obj.position.distanceTo(p.pos) < 15) {
                        p.shake = 15;
                        p.vel.add(p.pos.clone().sub(b.obj.position).normalize().multiplyScalar(2));
                    }
                });
                state.objects.pets.forEach(pet => {
                    if (b.obj.position.distanceTo(pet.pos) < 15) {
                        pet.hp -= delta * 30;
                        pet.shake = 2;
                        if (Math.random() < 0.01) showNotification(`P${pet.id+1} PET UNDER ATTACK!`, 1000);
                    }
                });
            }
            state.objects.seekers.forEach(s => { 
                players.forEach(p => { if(s.position.distanceTo(p.pos) < 8) { p.rings=Math.max(0, p.rings-10); p.shake=10; updateUI(); }});
                state.objects.pets.forEach(pet => {
                    const dist = s.position.distanceTo(pet.pos);
                    if (dist < 15) {
                        // Seeker attracts to pet
                        s.position.lerp(pet.pos, 0.02);
                        if (dist < 5) {
                            pet.hp -= delta * 15;
                            pet.shake = 1;
                        }
                    }
                });
            });

            // Knuckles Enemies logic
            for(let i=state.objects.enemies.length-1; i>=0; i--) {
                const en = state.objects.enemies[i];
                if (!en.alive) {
                    en.obj.scale.multiplyScalar(0.9);
                    en.obj.position.y += 1;
                    if(en.obj.scale.x < 0.1) {
                        scene.remove(en.obj);
                        state.objects.enemies.splice(i, 1);
                    }
                    continue;
                }

                if (en.hitCooldown > 0) en.hitCooldown -= delta;

                // Squish Logic
                if (en.squishTime > 0) {
                    en.squishTime -= delta;
                    en.obj.scale.set(1.4, 0.2, 1.4); // Squished look
                    if (en.squishTime <= 0) en.obj.scale.set(1, 1, 1);
                    continue; // Skip movement if squished
                }

                // Find closest player
                let minDist = Infinity;
                let targetPlayer = null;
                players.forEach(p => {
                    const d = p.pos.distanceTo(en.pos);
                    if (d < minDist) { minDist = d; targetPlayer = p; }
                });

                // Decide behavior: Hunt player or Collect rings
                let moveTarget = null;
                let isHunting = false;

                if (targetPlayer && minDist < 200) {
                    moveTarget = targetPlayer.pos;
                    isHunting = true;
                } else {
                    // Collect rings mode
                    if (!en.targetRing || !state.objects.rings.includes(en.targetRing)) {
                        let nearestRingDist = Infinity;
                        state.objects.rings.forEach(r => {
                            const d = r.position.distanceTo(en.pos);
                            if (d < nearestRingDist) { nearestRingDist = d; en.targetRing = r; }
                        });
                    }
                    if (en.targetRing) {
                        moveTarget = en.targetRing.position;
                        // Check for collection
                        if (en.pos.distanceTo(moveTarget) < 8) {
                            scene.remove(en.targetRing);
                            state.objects.rings.splice(state.objects.rings.indexOf(en.targetRing), 1);
                            en.targetRing = null;
                            showNotification("KNUCKLES STEALING RINGS!", 500);
                        }
                    }
                }

                if (moveTarget) {
                    const dir = moveTarget.clone().sub(en.pos);
                    dir.y = 0;
                    dir.normalize();
                    en.vel.lerp(dir.multiplyScalar(isHunting ? en.speed : en.speed * 0.7), 0.05);
                    en.pos.add(en.vel);
                    en.obj.position.copy(en.pos);
                    en.obj.lookAt(moveTarget.x, 2.8, moveTarget.z);
                    
                    // Collision with player
                    if (isHunting && minDist < 6) {
                        if (targetPlayer.trick > 0 || (!targetPlayer.onGround && targetPlayer.vel.y < -0.1)) {
                            if (en.hitCooldown <= 0) {
                                // Hit Knuckles!
                                en.health -= 34; // 3 hits to kill
                                en.hitCooldown = 0.5;
                                en.squishTime = 1.0; // Squish him!
                                en.hbFill.scale.x = Math.max(0, en.health / 100);
                                en.hbFill.position.x = -(1 - en.hbFill.scale.x) * 2.5;
                                
                                if (en.health <= 0) {
                                    en.alive = false;
                                    targetPlayer.rings += 15;
                                    showNotification("KNUCKLES DEFEATED +15 RINGS", 1000);
                                    targetPlayer.vel.y = 2.0; // SUPER BOUNCE
                                } else {
                                    showNotification("CRUSHED!", 800);
                                    targetPlayer.vel.y = 1.2; // Regular bounce
                                }
                                updateUI();
                            }
                        } else if (en.hitCooldown <= 0) {
                            // Player hit
                            targetPlayer.health = Math.max(0, targetPlayer.health - 20);
                            targetPlayer.rings = Math.max(0, targetPlayer.rings - 15);
                            targetPlayer.shake = 15;
                            en.hitCooldown = 2; 
                            updateUI();
                            showNotification("HIT BY KNUCKLES! -20 HP", 1500);
                            if (targetPlayer.health <= 0) {
                                showNotification("PLAYER DEFEATED!", 3000);
                                setTimeout(() => location.reload(), 2000);
                            }
                            // Push player away
                            const push = targetPlayer.pos.clone().sub(en.pos).normalize().multiplyScalar(2);
                            targetPlayer.vel.add(push);
                        }
                    }
                }
            }
        }

        function updateRadar() {
            const radarRange = 400; // World units shown on radar (radius)
            
            players.forEach((observer, idx) => {
                const mapId = `p${idx+1}-map`;
                const mapEl = document.getElementById(mapId);
                if (!mapEl) return;
                
                // Clear and rebuild radar
                mapEl.innerHTML = '';
                
                // Keep center visible
                const center = document.createElement('div');
                center.className = 'radar-center';
                mapEl.appendChild(center);
                
                // Rotation for radar (so North is where the player is facing)
                const rot = -observer.yaw;
                
                // List of entities to show
                const entities = [
                    { pos: players[0].pos, type: 'p1' },
                    { pos: players[1].pos, type: 'p2' }
                ];
                if (state.objects.boss) entities.push({ pos: state.objects.boss.obj.position, type: 'boss' });
                state.objects.enemies.forEach(en => {
                    if (en.alive) entities.push({ pos: en.pos, type: 'knuckles' });
                });
                
                entities.forEach(ent => {
                    const relX = ent.pos.x - observer.pos.x;
                    const relZ = ent.pos.z - observer.pos.z;
                    const rotX = relX * Math.cos(rot) - relZ * Math.sin(rot);
                    const rotZ = relX * Math.sin(rot) + relZ * Math.cos(rot);
                    const distSq = rotX * rotX + rotZ * rotZ;
                    
                    let mapX, mapZ;
                    if (distSq < radarRange * radarRange) {
                        mapX = (rotX / radarRange) * 50 + 50;
                        mapZ = (rotZ / radarRange) * 50 + 50;
                    } else {
                        const dist = Math.sqrt(distSq);
                        mapX = (rotX / dist) * 50 + 50;
                        mapZ = (rotZ / dist) * 50 + 50;
                    }
                    
                    const blip = document.createElement('div');
                    blip.className = `radar-blip blip-${ent.type}`;
                    blip.style.left = `${mapX}%`;
                    blip.style.top = `${mapZ}%`;
                    mapEl.appendChild(blip);
                });
            });
        }

        function render() {
            const w = window.innerWidth, h = window.innerHeight;
            if(!state.is2P) { follow(cam1, players[0]); renderer.setViewport(0,0,w,h); renderer.render(scene, cam1); }
            else {
                renderer.setScissorTest(true);
                follow(cam1, players[0]); renderer.setViewport(0,0,w/2,h); renderer.setScissor(0,0,w/2,h); renderer.render(scene, cam1);
                follow(cam2, players[1]); renderer.setViewport(w/2,0,w/2,h); renderer.setScissor(w/2,0,w/2,h); renderer.render(scene, cam2);
            }
        }

        function follow(c, p) { 
            const s = p.vel.length();
            c.fov = 75 + Math.min(20, s*8); c.updateProjectionMatrix();
            const shakeAmt = p.shake || 0;
            const target = p.pos.clone().add(new THREE.Vector3(-Math.sin(p.yaw)*40, 20, -Math.cos(p.yaw)*40)).add(new THREE.Vector3((Math.random()-0.5)*shakeAmt, (Math.random()-0.5)*shakeAmt, (Math.random()-0.5)*shakeAmt));
            c.position.lerp(target, 0.15); c.lookAt(p.pos); 
        }

        function updateUI() { 
            const p1 = document.getElementById('p1-rings'); if(p1) p1.innerText = players[0].rings;
            const p2 = document.getElementById('p2-rings'); if(p2 && state.is2P) p2.innerText = players[1].rings;
            
            const p1hp = document.getElementById('p1-hp-fill');
            if (p1hp) {
                p1hp.style.width = players[0].health + '%';
                p1hp.classList.toggle('warning', players[0].health < 60);
                p1hp.classList.toggle('critical', players[0].health < 30);
            }
            const p2hp = document.getElementById('p2-hp-fill');
            if (p2hp && state.is2P) {
                p2hp.style.width = players[1].health + '%';
                p2hp.classList.toggle('warning', players[1].health < 60);
                p2hp.classList.toggle('critical', players[1].health < 30);
            }
        }
        function updateTimerUI() { const t = document.getElementById('timer-display'); if(t) { const m = Math.floor(state.time/60), s = state.time%60; t.innerText = `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`; } }

        init();
    </script>
