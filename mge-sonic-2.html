<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sonic 2 | MGE STEM</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --mge-primary: #0047ff;
            --mge-secondary: #2c3e50;
            --mge-accent: #f1c40f;
            --mge-gold: #ffcc00;
            --mge-tails: #ffcc00;
            --glass: rgba(255, 255, 255, 0.1);
            --glass-dark: rgba(0, 0, 0, 0.7);
            --neon-blue: 0 0 20px rgba(0, 71, 255, 0.8);
            --neon-gold: 0 0 20px rgba(255, 204, 0, 0.8);
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1a472a;
            font-family: 'Outfit', sans-serif;
            color: white;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        #ui-root {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
            z-index: 100;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            pointer-events: auto;
            width: 100%;
        }

        .hud-group {
            display: flex;
            gap: 10px;
        }

        .mge-badge {
            background: linear-gradient(135deg, var(--mge-primary), #5dade2);
            padding: 10px 20px;
            border-radius: 12px;
            font-weight: 900;
            font-size: 1.2rem;
            box-shadow: var(--neon-blue);
            text-transform: uppercase;
        }

        .timer-display {
            background: var(--glass-dark);
            backdrop-filter: blur(15px);
            padding: 10px 30px;
            border-radius: 50px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            font-size: 2.5rem;
            font-weight: 900;
            color: #fff;
            text-shdow: 0 0 10px rgba(0,0,0,0.5);
        }

        .hud-card {
            background: var(--glass-dark);
            backdrop-filter: blur(10px);
            padding: 10px 20px;
            border-radius: 15px;
            border: 1px solid rgba(255,255,255,0.15);
            display: flex;
            flex-direction: column;
            min-width: 100px;
        }

        .hud-label {
            font-size: 0.65rem;
            color: rgba(255,255,255,0.7);
            text-transform: uppercase;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .hud-value {
            font-size: 1.8rem;
            font-weight: 900;
            line-height: 1;
        }

        .p1-color { color: #5dade2; }
        .p2-color { color: var(--mge-gold); }

        #rings-hud { color: var(--mge-accent); }

        /* --- KEYBOARD VISUALIZERS --- */
        .keyboard-overlay {
            display: flex;
            gap: 5px;
            pointer-events: none;
            background: rgba(0,0,0,0.3);
            padding: 10px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .key-box {
            width: 40px;
            height: 40px;
            background: rgba(255,255,255,0.1);
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 900;
            font-size: 0.8rem;
            transition: all 0.1s;
            color: rgba(255,255,255,0.5);
        }

        .key-box.active {
            background: var(--mge-primary);
            border-color: #fff;
            color: white;
            box-shadow: var(--neon-blue);
            transform: scale(0.9) translateY(2px);
        }

        .p2-keys .key-box.active {
            background: var(--mge-gold);
            box-shadow: var(--neon-gold);
        }

        /* --- SCREENS --- */
        #loading-screen {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, #1d4d1d 0%, #0a2a0a 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            transition: opacity 1s;
        }

        #start-screen {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.9);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1500;
            backdrop-filter: blur(20px);
        }

        .start-group {
            display: flex;
            gap: 20px;
            margin-top: 40px;
        }

        .start-btn {
            background: linear-gradient(135deg, var(--mge-primary), #00a2ff);
            border: none;
            color: white;
            padding: 20px 40px;
            font-size: 1.5rem;
            font-weight: 900;
            border-radius: 15px;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0, 71, 255, 0.4);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: auto;
        }

        .start-btn:hover {
            transform: scale(1.05) translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 71, 255, 0.6);
        }

        .start-btn.p2-btn {
            background: linear-gradient(135deg, #f39c12, #e67e22);
            box-shadow: 0 10px 30px rgba(230, 126, 34, 0.4);
        }

        .start-btn.p2-btn:hover {
            box-shadow: 0 15px 40px rgba(230, 126, 34, 0.6);
        }

        /* --- NOTIFICATION --- */
        #notification {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            padding: 20px 40px;
            border-radius: 50px;
            background: rgba(0, 0, 0, 0.8);
            border: 3px solid var(--mge-gold);
            font-size: 2rem;
            font-weight: 900;
            color: #fff;
            opacity: 0;
            transition: all 0.4s;
            z-index: 500;
        }

        #notification.active { opacity: 1; transform: translate(-50%, -50%) scale(1); }

        /* Split line */
        #split-line {
            position: absolute;
            top: 0;
            left: 50%;
            width: 4px;
            height: 100%;
            background: rgba(255,255,255,0.2);
            transform: translateX(-50%);
            display: none;
            z-index: 50;
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

    <div id="canvas-container"></div>
    <div id="split-line"></div>

    <div id="loading-screen">
        <div class="loader-content" style="text-align: center;">
            <div style="font-size: 5rem;">🦔💨</div>
            <h1 style="letter-spacing: 10px; font-weight: 900;">SONIC 2</h1>
            <div style="width: 200px; height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; margin: 20px auto; overflow: hidden;">
                <div id="loader-fill" style="width: 0%; height: 100%; background: #fff; box-shadow: 0 0 10px #fff;"></div>
            </div>
        </div>
    </div>

    <div id="start-screen">
        <h1 style="font-size: 6rem; font-weight: 900; margin: 0; text-shadow: 0 0 40px var(--mge-primary);">SONIC 2</h1>
        <p style="font-size: 1.4rem; color: #888;">Modern 3D Split-Screen Unleashed</p>
        <div class="start-group">
            <button class="start-btn" id="btn-1p">1 PLAYER</button>
            <button class="start-btn p2-btn" id="btn-2p">2 PLAYER</button>
        </div>
    </div>

    <div id="ui-root">
        <div class="header">
            <div class="hud-group" style="flex-direction: column;">
                <div class="mge-badge" id="p1-badge">P1: SONIC</div>
                <div class="hud-card"><span class="hud-label">Rings</span><span class="hud-value p1-color" id="p1-rings">0</span></div>
                <div class="keyboard-overlay" id="p1-kb">
                    <div class="key-box" id="key-KeyW">W</div>
                    <div class="key-box" id="key-KeyA">A</div>
                    <div class="key-box" id="key-KeyS">S</div>
                    <div class="key-box" id="key-KeyD">D</div>
                    <div class="key-box" id="key-Space" style="width: 80px;">JUMP</div>
                </div>
            </div>

            <div class="top-center-stats">
                <div class="timer-display" id="timer-display">03:00</div>
                <div style="color: var(--mge-gold); font-weight: bold; letter-spacing: 2px;">SUNSET CHALLENGE</div>
            </div>

            <div class="hud-group" id="p2-ui" style="flex-direction: column; align-items: flex-end; display: none;">
                <div class="mge-badge" style="background: linear-gradient(135deg, #f39c12, #e67e22);">P2: TAILS</div>
                <div class="hud-card" style="align-items: flex-end;"><span class="hud-label">Rings</span><span class="hud-value p2-color" id="p2-rings">0</span></div>
                <div class="keyboard-overlay p2-keys" id="p2-kb">
                    <div class="key-box" id="key-ArrowUp">▲</div>
                    <div class="key-box" id="key-ArrowLeft">◀</div>
                    <div class="key-box" id="key-ArrowDown">▼</div>
                    <div class="key-box" id="key-ArrowRight">▶</div>
                    <div class="key-box" id="key-ShiftRight" style="width: 80px;">JUMP</div>
                </div>
            </div>
        </div>

        <div id="notification">GO!</div>
    </div>

    <script type="module">
        import * as THREE from 'three';

        // --- CONSTANTS ---
        const CONFIG = {
            ACCEL: 0.06,
            MAX_SPEED: 1.4,
            DRAG: 0.96,
            GRAVITY: -0.025,
            JUMP: 0.75,
            MAGNET_DIST: 12,
            WORLD_SIZE: 1200,
            RING_COUNT: 450,
            SUNSET_TIME: Math.PI * 0.85
        };

        const state = {
            started: false,
            is2P: false,
            time: 180,
            lastFrame: performance.now(),
            keys: {},
            objects: { rings: [], enemies: [], ramps: [], particles: [] }
        };

        const players = [
            { obj: null, pos: new THREE.Vector3(0,1.2,0), vel: new THREE.Vector3(), yaw: 0, rings: 0, onGround: false, color: 0x0047ff, type: 'sonic' },
            { obj: null, pos: new THREE.Vector3(-10,1.2,-10), vel: new THREE.Vector3(), yaw: 0, rings: 0, onGround: false, color: 0xffcc00, type: 'tails' }
        ];

        let scene, renderer, sun, moon, ambientLight;
        let cam1, cam2, sunShadowCam;

        function init() {
            // Loader
            let prog = 0;
            const iv = setInterval(() => {
                prog += Math.random()*10;
                if(prog >= 100) {
                    clearInterval(iv);
                    setTimeout(() => {
                        document.getElementById('loading-screen').style.opacity = 0;
                        setTimeout(() => {
                            document.getElementById('loading-screen').style.display = 'none';
                            document.getElementById('start-screen').style.display = 'flex';
                        }, 1000);
                    }, 500);
                }
                document.getElementById('loader-fill').style.width = prog+'%';
            }, 50);

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x228B22);
            scene.fog = new THREE.Fog(0x228B22, 100, 1000);

            renderer = new THREE.WebGLRenderer({ antialias: true, logarithmicDepthBuffer: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap; 
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            cam1 = new THREE.PerspectiveCamera(75, window.innerWidth / (state.is2P ? window.innerWidth/2 : window.innerWidth), 0.1, 2000);
            cam2 = new THREE.PerspectiveCamera(75, window.innerWidth / 2, 0.1, 2000);

            // Lighting
            ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
            scene.add(ambientLight);

            sun = new THREE.DirectionalLight(0xfff5e1, 1.2);
            sun.position.set(200, 250, 100);
            sun.castShadow = true;
            sun.shadow.mapSize.width = 4096;
            sun.shadow.mapSize.height = 4096;
            sun.shadow.camera.left = -300;
            sun.shadow.camera.right = 300;
            sun.shadow.camera.top = 300;
            sun.shadow.camera.bottom = -300;
            sun.shadow.camera.near = 0.5;
            sun.shadow.camera.far = 1000;
            scene.add(sun);

            moon = new THREE.DirectionalLight(0x4444ff, 0.3);
            scene.add(moon);

            createWorld();
            players[0].obj = createCharacter(players[0]);
            players[1].obj = createCharacter(players[1]);

            for(let i=0; i<CONFIG.RING_COUNT; i++) spawnRing();
            for(let i=0; i<40; i++) spawnEnemy();

            // Controls
            window.addEventListener('keydown', e => {
                state.keys[e.code] = true;
                const kbEl = document.getElementById('key-'+e.code);
                if(kbEl) kbEl.classList.add('active');
            });
            window.addEventListener('keyup', e => {
                state.keys[e.code] = false;
                const kbEl = document.getElementById('key-'+e.code);
                if(kbEl) kbEl.classList.remove('active');
            });

            document.getElementById('btn-1p').onclick = () => startGame(false);
            document.getElementById('btn-2p').onclick = () => startGame(true);

            animate();
        }

        function createWorld() {
            const canvas = document.createElement('canvas');
            canvas.width = 512; canvas.height = 512;
            const ctx = canvas.getContext('2d');
            for(let x=0; x<512; x+=64) {
                for(let y=0; y<512; y+=64) {
                    ctx.fillStyle = ((x+y)/64) % 2 === 0 ? '#32CD32' : '#228B22';
                    ctx.fillRect(x, y, 64, 64);
                }
            }
            const floorTex = new THREE.CanvasTexture(canvas);
            floorTex.wrapS = floorTex.wrapT = THREE.RepeatWrapping;
            floorTex.repeat.set(150, 150);

            const floor = new THREE.Mesh(new THREE.PlaneGeometry(CONFIG.WORLD_SIZE, CONFIG.WORLD_SIZE), new THREE.MeshStandardMaterial({ map: floorTex, roughness: 0.9 }));
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            for(let i=0; i<20; i++) {
                createRamp((Math.random()-0.5)*900, (Math.random()-0.5)*900, Math.random()*Math.PI*2);
            }
        }

        function createRamp(x, z, rot) {
            const w=20, h=15, l=35;
            const g = new THREE.Group();
            const mat = new THREE.MeshStandardMaterial({ color: 0x8B4513 });
            const inc = new THREE.Mesh(new THREE.BoxGeometry(w, 1, l), mat);
            inc.rotation.x = -Math.atan2(h, l);
            inc.position.set(0, h/2, l/2);
            inc.castShadow = inc.receiveShadow = true;
            g.add(inc);
            const top = new THREE.Mesh(new THREE.BoxGeometry(w, 1, 15), mat);
            top.position.set(0, h, l + 7.5);
            top.castShadow = top.receiveShadow = true;
            g.add(top);
            g.position.set(x, 0, z);
            g.rotation.y = rot;
            scene.add(g);
            state.objects.ramps.push({ x, z, rot, w, h, l, angle: Math.atan2(h, l) });
        }

        function createCharacter(pData) {
            const g = new THREE.Group();
            const mesh = new THREE.Mesh(new THREE.SphereGeometry(1.2, 16, 16), new THREE.MeshStandardMaterial({ color: pData.color, flatShading: true }));
            mesh.castShadow = true;
            g.add(mesh);
            // Spikes
            const sj = pData.type === 'sonic' ? 3 : 2;
            const sGeo = new THREE.ConeGeometry(0.4, 1.5, 6);
            sGeo.rotateX(Math.PI/2);
            for(let i=0; i<sj; i++) {
                const s = new THREE.Mesh(sGeo, mesh.material);
                s.position.set(0, 0.4, 0.5 + i*0.5);
                s.rotation.x = 0.5 + i*0.2;
                g.add(s);
            }
            scene.add(g);
            return g;
        }

        function spawnRing() {
            const ring = new THREE.Mesh(new THREE.TorusGeometry(0.8, 0.2, 8, 16), new THREE.MeshStandardMaterial({ color: 0xffcc00, emissive: 0xffcc00, emissiveIntensity: 0.6 }));
            ring.position.set((Math.random()-0.5)*1000, 1.5, (Math.random()-0.5)*1000);
            scene.add(ring);
            state.objects.rings.push(ring);
        }

        function spawnEnemy() {
            const g = new THREE.Group();
            const isAlt = Math.random() > 0.7;
            const color = isAlt ? 0x9b59b6 : 0xe74c3c;
            const body = new THREE.Mesh(new THREE.BoxGeometry(3, 2, 4), new THREE.MeshStandardMaterial({ color }));
            body.castShadow = true;
            g.add(body);
            const eye = new THREE.Mesh(new THREE.SphereGeometry(0.5, 8, 8), new THREE.MeshBasicMaterial({ color: 0xffff00 }));
            eye.position.set(0, 0.5, 2);
            g.add(eye);
            if(isAlt) { // Caterpillar spikes
                const sGeo = new THREE.SphereGeometry(0.6, 8, 8);
                for(let i=0; i<3; i++) {
                    const s = new THREE.Mesh(sGeo, new THREE.MeshStandardMaterial({ color: 0x34495e }));
                    s.position.set(0, 1.2, -1 + i);
                    g.add(s);
                }
            }
            g.position.set((Math.random()-0.5)*950, 1.2, (Math.random()-0.5)*950);
            g.userData = { isAlt, angle: Math.random()*Math.PI*2 };
            scene.add(g);
            state.objects.enemies.push(g);
        }

        function startGame(is2P) {
            state.is2P = is2P;
            state.started = true;
            document.getElementById('start-screen').style.display = 'none';
            if(is2P) {
                document.getElementById('p2-ui').style.display = 'flex';
                document.getElementById('split-line').style.display = 'block';
                document.getElementById('p1-badge').innerText = "P1: SONIC";
            }
            // Timer iv
            setInterval(() => { if(state.started && state.time > 0) { state.time--; updateTimerUI(); if(state.time === 0) endGame(); } }, 1000);
        }

        function animate() {
            requestAnimationFrame(animate);
            const now = performance.now();
            const delta = Math.min((now - state.lastFrame)/1000, 0.1);
            state.lastFrame = now;

            if(state.started) {
                updateDayNight(delta);
                updatePlayers(delta);
                updateWorldItems(delta);
                renderSplit();
            } else {
                if(players[0].obj) players[0].obj.rotation.y += delta;
                renderer.render(scene, cam1);
            }
        }

        function updateDayNight(delta) {
            // Stay around Sunset
            state.dayTime = CONFIG.SUNSET_TIME + Math.sin(performance.now() * 0.0001) * 0.2;
            sun.position.set(Math.sin(state.dayTime)*400, Math.cos(state.dayTime)*400, 100);
            const intensity = Math.max(0.1, Math.cos(state.dayTime - Math.PI/2));
            const skyColor = new THREE.Color(0x32CD32).lerp(new THREE.Color(0x1a472a), 1-intensity);
            scene.background = skyColor;
            scene.fog.color = skyColor;
            sun.intensity = intensity * 1.5;
            moon.intensity = (1-intensity) * 0.5;

            // Shadow camera follow
            const center = state.is2P ? players[0].pos.clone().lerp(players[1].pos, 0.5) : players[0].pos;
            sun.shadow.camera.position.set(center.x + 200, 250, center.z + 100);
            sun.shadow.camera.updateProjectionMatrix();
        }

        function updatePlayers(delta) {
            // P1: WASD
            handlePlayerInput(0, 'KeyW', 'KeyS', 'KeyA', 'KeyD', 'Space');
            // P2: Arrows
            handlePlayerInput(1, 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'ShiftRight');

            players.forEach((p, idx) => {
                if(!state.is2P && idx === 1) { // Tails auto-follow in 1P
                    const target = players[0].pos.clone().add(new THREE.Vector3(-Math.sin(players[0].yaw)*8, 2, -Math.cos(players[0].yaw)*8));
                    p.pos.lerp(target, delta*3);
                    p.obj.position.copy(p.pos);
                    p.obj.lookAt(players[0].pos);
                    return;
                }

                p.vel.x *= CONFIG.DRAG; p.vel.z *= CONFIG.DRAG;
                if(!p.onGround) p.vel.y += CONFIG.GRAVITY;
                const speed = Math.sqrt(p.vel.x**2 + p.vel.z**2);
                if(speed > CONFIG.MAX_SPEED) { p.vel.x *= CONFIG.MAX_SPEED/speed; p.vel.z *= CONFIG.MAX_SPEED/speed; }
                p.pos.add(p.vel);
                if(p.pos.y < 1.2) { p.pos.y = 1.2; p.vel.y = 0; p.onGround = true; }
                
                // Ramp Logic
                state.objects.ramps.forEach(r => {
                    const dx = p.pos.x - r.x, dz = p.pos.z - r.z;
                    const lx = dx * Math.cos(-r.rot) - dz * Math.sin(-r.rot);
                    const lz = dx * Math.sin(-r.rot) + dz * Math.cos(-r.rot);
                    if(Math.abs(lx) < r.w/2) {
                        if(lz > 0 && lz < r.l) { 
                            const ty = (lz/r.l)*r.h + 1.2; 
                            if(p.pos.y < ty+2) { p.pos.y = ty; p.vel.y = 0; p.onGround = true; }
                        } else if(lz >= r.l && lz < r.l + 15) {
                            const ty = r.h + 1.2;
                            if(p.pos.y < ty+2) { p.pos.y = ty; p.vel.y = 0; p.onGround = true; }
                        }
                    }
                });

                p.obj.position.copy(p.pos);
                p.obj.rotation.y = p.yaw;
                if(speed > 0.1) p.obj.children[0].rotation.x -= speed * 0.4;
            });
        }

        function handlePlayerInput(idx, fwd, bwd, left, right, jump) {
            const p = players[idx];
            if(state.keys[left]) p.yaw += 0.08;
            if(state.keys[right]) p.yaw -= 0.08;
            if(state.keys[fwd]) { p.vel.x += Math.sin(p.yaw)*CONFIG.ACCEL; p.vel.z += Math.cos(p.yaw)*CONFIG.ACCEL; }
            if(state.keys[bwd]) { p.vel.x -= Math.sin(p.yaw)*CONFIG.ACCEL; p.vel.z -= Math.cos(p.yaw)*CONFIG.ACCEL; }
            if(state.keys[jump] && p.onGround) { p.vel.y = CONFIG.JUMP; p.onGround = false; }
        }

        function updateWorldItems(delta) {
            // Rings Magnetism
            for (let i = state.objects.rings.length - 1; i >= 0; i--) {
                const r = state.objects.rings[i];
                r.rotation.y += 0.05;
                
                let collected = false;
                for (let j = 0; j < (state.is2P ? 2 : 1); j++) {
                    const p = players[j];
                    const d = r.position.distanceTo(p.pos);
                    
                    if (d < CONFIG.MAGNET_DIST) {
                        r.position.lerp(p.pos, 0.15); // Faster magnetism
                        if (d < 3.0) {
                            scene.remove(r);
                            state.objects.rings.splice(i, 1);
                            p.rings++;
                            updateUI();
                            collected = true;
                            break;
                        }
                    }
                }
            }

            // Enemies
            state.objects.enemies.forEach(e => {
                e.userData.angle += delta * (e.userData.isAlt ? 2 : 1);
                e.position.x += Math.sin(e.userData.angle) * 0.1;
                e.position.z += Math.cos(e.userData.angle) * 0.1;
                players.forEach(p => {
                    if(e.position.distanceTo(p.pos) < 4) {
                        if(p.vel.y < 0 && p.pos.y > e.position.y + 1) {
                            scene.remove(e);
                            state.objects.enemies.splice(state.objects.enemies.indexOf(e), 1);
                            p.vel.y = 0.5;
                        } else {
                            p.rings = Math.max(0, p.rings - 10);
                            p.vel.x *= -2; p.vel.z *= -2;
                            updateUI();
                        }
                    }
                });
            });
        }

        function renderSplit() {
            const w = window.innerWidth, h = window.innerHeight;
            renderer.setScissorTest(true);

            if(!state.is2P) {
                updateCamFollow(cam1, players[0]);
                renderer.setViewport(0, 0, w, h);
                renderer.setScissor(0, 0, w, h);
                renderer.render(scene, cam1);
            } else {
                // P1 View (Left)
                updateCamFollow(cam1, players[0]);
                renderer.setViewport(0, 0, w/2, h);
                renderer.setScissor(0, 0, w/2, h);
                cam1.aspect = (w/2)/h;
                cam1.updateProjectionMatrix();
                renderer.render(scene, cam1);

                // P2 View (Right)
                updateCamFollow(cam2, players[1]);
                renderer.setViewport(w/2, 0, w/2, h);
                renderer.setScissor(w/2, 0, w/2, h);
                cam2.aspect = (w/2)/h;
                cam2.updateProjectionMatrix();
                renderer.render(scene, cam2);
            }
        }

        function updateCamFollow(cam, p) {
            const d = 18, h = 8;
            const target = p.pos.clone().add(new THREE.Vector3(-Math.sin(p.yaw)*d, h, -Math.cos(p.yaw)*d));
            cam.position.lerp(target, 0.1);
            cam.lookAt(p.pos.x, p.pos.y + 2, p.pos.z);
        }

        function updateUI() {
            document.getElementById('p1-rings').innerText = players[0].rings;
            if(state.is2P) document.getElementById('p2-rings').innerText = players[1].rings;
        }

        function updateTimerUI() {
            const m = Math.floor(state.time/60), s = state.time%60;
            document.getElementById('timer-display').innerText = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        }

        function onWindowResize() {
            const w = window.innerWidth, h = window.innerHeight;
            renderer.setSize(w, h);
            cam1.aspect = (state.is2P ? w/2 : w) / h;
            cam1.updateProjectionMatrix();
            cam2.aspect = (w/2) / h;
            cam2.updateProjectionMatrix();
        }

        function endGame() {
            state.started = false;
            document.getElementById('notification').innerText = "TIME UP!";
            document.getElementById('notification').classList.add('active');
            setTimeout(() => location.reload(), 4000);
        }

        init();
    </script>
</body>
</html>
