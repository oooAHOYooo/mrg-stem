<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sonic 2 | MGE STEM</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --mge-primary: #0047ff;
            --mge-secondary: #2c3e50;
            --mge-accent: #f1c40f;
            --mge-gold: #ffcc00;
            --mge-tails: #ffcc00;
            --glass: rgba(255, 255, 255, 0.1);
            --glass-dark: rgba(0, 0, 0, 0.7);
            --neon-blue: 0 0 20px rgba(0, 71, 255, 0.8);
            --neon-gold: 0 0 20px rgba(255, 204, 0, 0.8);
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1a472a;
            font-family: 'Outfit', sans-serif;
            color: white;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        #ui-root {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
            z-index: 100;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            pointer-events: auto;
            width: 100%;
        }

        .hud-group {
            display: flex;
            gap: 10px;
        }

        .mge-badge {
            background: linear-gradient(135deg, var(--mge-primary), #5dade2);
            padding: 10px 20px;
            border-radius: 12px;
            font-weight: 900;
            font-size: 1.2rem;
            box-shadow: var(--neon-blue);
            text-transform: uppercase;
        }

        .timer-display {
            background: var(--glass-dark);
            backdrop-filter: blur(15px);
            padding: 10px 30px;
            border-radius: 50px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            font-size: 2.5rem;
            font-weight: 900;
            color: #fff;
        }

        .hud-card {
            background: var(--glass-dark);
            backdrop-filter: blur(10px);
            padding: 10px 20px;
            border-radius: 15px;
            border: 1px solid rgba(255,255,255,0.15);
            display: flex;
            flex-direction: column;
            min-width: 100px;
        }

        .hud-label {
            font-size: 0.65rem;
            color: rgba(255,255,255,0.7);
            text-transform: uppercase;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .hud-value {
            font-size: 1.8rem;
            font-weight: 900;
            line-height: 1;
        }

        .p1-color { color: #5dade2; }
        .p2-color { color: var(--mge-gold); }

        /* --- KEYBOARD VISUALIZERS --- */
        .keyboard-overlay {
            display: flex;
            gap: 5px;
            pointer-events: none;
            background: rgba(0,0,0,0.3);
            padding: 10px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .key-box {
            width: 40px;
            height: 40px;
            background: rgba(255,255,255,0.1);
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 900;
            font-size: 0.8rem;
            transition: all 0.1s;
            color: rgba(255,255,255,0.5);
        }

        .key-box.active {
            background: var(--mge-primary);
            border-color: #fff;
            color: white;
            box-shadow: var(--neon-blue);
            transform: scale(0.9) translateY(2px);
        }

        .p2-keys .key-box.active {
            background: var(--mge-gold);
            box-shadow: var(--neon-gold);
        }

        #start-screen {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.9);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1500;
            backdrop-filter: blur(20px);
        }

        .start-btn {
            background: linear-gradient(135deg, var(--mge-primary), #00a2ff);
            border: none;
            color: white;
            padding: 20px 40px;
            font-size: 1.5rem;
            font-weight: 900;
            border-radius: 15px;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0, 71, 255, 0.4);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: auto;
        }

        #notification {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            padding: 20px 40px;
            border-radius: 50px;
            background: rgba(0, 0, 0, 0.8);
            border: 3px solid var(--mge-gold);
            font-size: 2.5rem;
            font-weight: 900;
            color: #fff;
            opacity: 0;
            transition: all 0.4s;
            z-index: 500;
            text-align: center;
        }

        #notification.active { opacity: 1; transform: translate(-50%, -50%) scale(1); }

        #split-line {
            position: absolute;
            top: 0;
            left: 50%;
            width: 4px;
            height: 100%;
            background: rgba(255,255,255,0.2);
            transform: translateX(-50%);
            display: none;
            z-index: 50;
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

    <div id="canvas-container"></div>
    <div id="split-line"></div>

    <div id="loading-screen" style="position:fixed; inset:0; background:#000; color:#fff; display:flex; justify-content:center; align-items:center; z-index:2000;">
        <div style="text-align: center;">
            <div style="font-size: 5rem;">🦔💨</div>
            <h1 style="letter-spacing: 10px;">SONIC 2</h1>
            <div style="width: 200px; height: 6px; background: #222; border-radius: 3px; margin: 20px auto; overflow: hidden;">
                <div id="loader-fill" style="width: 0%; height: 100%; background: #fff;"></div>
            </div>
        </div>
    </div>

    <div id="start-screen">
        <h1 style="font-size: 6rem; font-weight: 900; margin: 0; text-shadow: 0 0 40px var(--mge-primary);">SONIC 2</h1>
        <p style="font-size: 1.4rem; color: #888;">Split-Screen | Air Tricks | Seekers</p>
        <div style="display:flex; gap:20px; margin-top:40px;">
            <button class="start-btn" id="btn-1p">1 PLAYER</button>
            <button class="start-btn" id="btn-2p" style="background: linear-gradient(135deg, #f39c12, #e67e22);">2 PLAYER</button>
        </div>
    </div>

    <div id="ui-root">
        <div class="header">
            <div class="hud-group" style="flex-direction: column;">
                <div class="mge-badge" id="p1-badge">P1: SONIC</div>
                <div class="hud-card"><span class="hud-label">Rings</span><span class="hud-value p1-color" id="p1-rings">0</span></div>
                <div class="keyboard-overlay">
                    <div class="key-box" id="key-KeyW">W</div>
                    <div class="key-box" id="key-KeyA">A</div>
                    <div class="key-box" id="key-KeyS">S</div>
                    <div class="key-box" id="key-KeyD">D</div>
                    <div class="key-box" id="key-Space">J</div>
                    <div class="key-box" id="key-KeyE">TRICK</div>
                </div>
            </div>

            <div class="top-center-stats">
                <div class="timer-display" id="timer-display">03:00</div>
                <div style="color: var(--mge-gold); font-weight: bold; letter-spacing: 2px;">SUNSET STORM</div>
            </div>

            <div class="hud-group" id="p2-ui" style="flex-direction: column; align-items: flex-end; display: none;">
                <div class="mge-badge" style="background: linear-gradient(135deg, #f39c12, #e67e22);">P2: TAILS</div>
                <div class="hud-card" style="align-items: flex-end;"><span class="hud-label">Rings</span><span class="hud-value p2-color" id="p2-rings">0</span></div>
                <div class="keyboard-overlay p2-keys">
                    <div class="key-box" id="key-ArrowUp">▲</div>
                    <div class="key-box" id="key-ArrowLeft">◀</div>
                    <div class="key-box" id="key-ArrowDown">▼</div>
                    <div class="key-box" id="key-ArrowRight">▶</div>
                    <div class="key-box" id="key-ControlRight">J</div>
                    <div class="key-box" id="key-ShiftRight">TRICK</div>
                </div>
            </div>
        </div>

        <div id="notification">GO!</div>
    </div>

    <script type="module">
        import * as THREE from 'three';

        const CONFIG = {
            ACCEL: 0.08,
            MAX_SPEED: 1.6,
            DRAG: 0.96,
            GRAVITY: -0.03,
            JUMP: 0.8,
            MAGNET: 15,
            WORLD: 1500,
            SUNSET: Math.PI * 0.85
        };

        const state = {
            started: false,
            is2P: false,
            time: 180,
            lastFrame: performance.now(),
            keys: {},
            objects: { rings: [], enemies: [], seekers: [], ramps: [], clouds: [], sunShafts: [] }
        };

        const players = [
            { obj: null, pos: new THREE.Vector3(0,1.2,0), vel: new THREE.Vector3(), yaw: 0, rings: 0, onGround: false, trick: 0, color: 0x0047ff, type: 'sonic' },
            { obj: null, pos: new THREE.Vector3(-15,1.2,-15), vel: new THREE.Vector3(), yaw: 0, rings: 0, onGround: false, trick: 0, color: 0xffcc00, type: 'tails' }
        ];

        let scene, renderer, sun, moon, ambientLight;
        let cam1, cam2;

        function init() {
            // Simple Loader
            let p = 0; const iv = setInterval(() => { p += 5; document.getElementById('loader-fill').style.width = p+'%'; if(p>=100) { clearInterval(iv); document.getElementById('loading-screen').style.display='none'; document.getElementById('start-screen').style.display='flex'; }}, 50);

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x32CD32);
            scene.fog = new THREE.FogExp2(0x32CD32, 0.001);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            cam1 = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 3000);
            cam2 = new THREE.PerspectiveCamera(75, window.innerWidth/2/window.innerHeight, 0.1, 3000);

            ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);

            sun = new THREE.DirectionalLight(0xfff0dd, 1.2);
            sun.position.set(200, 300, 100);
            sun.castShadow = true;
            sun.shadow.mapSize.set(2048, 2048);
            scene.add(sun);

            createWorld();
            players[0].obj = createPlayerMesh(players[0]);
            players[1].obj = createPlayerMesh(players[1]);

            for(let i=0; i<500; i++) spawnRing();
            for(let i=0; i<30; i++) spawnSeeker();
            for(let i=0; i<20; i++) createCloud();
            createSunShafts();

            window.addEventListener('keydown', e => { state.keys[e.code] = true; const el = document.getElementById('key-'+e.code); if(el) el.classList.add('active'); });
            window.addEventListener('keyup', e => { state.keys[e.code] = false; const el = document.getElementById('key-'+e.code); if(el) el.classList.remove('active'); });
            document.getElementById('btn-1p').onclick = () => startGame(false);
            document.getElementById('btn-2p').onclick = () => startGame(true);

            animate();
        }

        function createWorld() {
            const floor = new THREE.Mesh(new THREE.PlaneGeometry(CONFIG.WORLD, CONFIG.WORLD), new THREE.MeshStandardMaterial({ color: 0x228B22, roughness: 1 }));
            floor.rotation.x = -Math.PI/2;
            floor.receiveShadow = true;
            scene.add(floor);
            // Checkered overlay (using repeated geometry or simple grid)
            for(let i=0; i<50; i++) createRamp((Math.random()-0.5)*1200, (Math.random()-0.5)*1200, Math.random()*6);
        }

        function createRamp(x, z, r) {
            const group = new THREE.Group();
            const mat = new THREE.MeshStandardMaterial({ color: 0x8B4513 });
            const slope = new THREE.Mesh(new THREE.BoxGeometry(20, 1, 40), mat);
            slope.rotation.x = -0.4; slope.position.set(0, 8, 20); slope.castShadow = true;
            group.add(slope);
            group.position.set(x, 0, z); group.rotation.y = r;
            scene.add(group);
            state.objects.ramps.push({ x, z, r, w: 20, h: 15, l: 40 });
        }

        function createPlayerMesh(p) {
            const g = new THREE.Group();
            const m = new THREE.Mesh(new THREE.SphereGeometry(1.2, 16, 16), new THREE.MeshStandardMaterial({ color: p.color }));
            m.castShadow = true;
            g.add(m);
            scene.add(g);
            return g;
        }

        function createCloud() {
            const g = new THREE.Group();
            const mat = new THREE.MeshStandardMaterial({ color: 0xffffff, transparent: true, opacity: 0.8 });
            for(let i=0; i<5; i++) {
                const b = new THREE.Mesh(new THREE.BoxGeometry(10+Math.random()*20, 5+Math.random()*10, 10+Math.random()*15), mat);
                b.position.set(Math.random()*20-10, Math.random()*5, Math.random()*20-10);
                g.add(b);
            }
            g.position.set((Math.random()-0.5)*2000, 100 + Math.random()*100, (Math.random()-0.5)*2000);
            scene.add(g);
            state.objects.clouds.push(g);
        }

        function createSunShafts() {
            for(let i=0; i<5; i++) {
                const shaft = new THREE.Mesh(new THREE.BoxGeometry(50, 1000, 50), new THREE.MeshBasicMaterial({ color: 0xfff0dd, transparent: true, opacity: 0.1 }));
                shaft.position.set(sun.position.x + (Math.random()-0.5)*500, 0, sun.position.z + (Math.random()-0.5)*500);
                shaft.rotation.z = 0.5;
                scene.add(shaft);
                state.objects.sunShafts.push(shaft);
            }
        }

        function spawnRing() {
            const r = new THREE.Mesh(new THREE.TorusGeometry(0.8, 0.2, 8, 16), new THREE.MeshStandardMaterial({ color: 0xffcc00, emissive: 0xffcc00 }));
            r.position.set((Math.random()-0.5)*1400, 2, (Math.random()-0.5)*1400);
            scene.add(r);
            state.objects.rings.push(r);
        }

        function spawnSeeker() {
            const g = new THREE.Group();
            const body = new THREE.Mesh(new THREE.OctahedronGeometry(2), new THREE.MeshStandardMaterial({ color: 0x444444 }));
            g.add(body);
            // Scanner Cone
            const scanner = new THREE.Mesh(new THREE.ConeGeometry(8, 40, 16), new THREE.MeshBasicMaterial({ color: 0xff0000, transparent: true, opacity: 0.2 }));
            scanner.rotation.x = Math.PI/2;
            scanner.position.z = 20;
            g.add(scanner);
            g.position.set((Math.random()-0.5)*1200, 10, (Math.random()-0.5)*1200);
            g.userData = { state: 'idle', target: null, home: g.position.clone(), angle: Math.random()*Math.PI*2 };
            scene.add(g);
            state.objects.seekers.push(g);
        }

        function startGame(split) {
            state.is2P = split; state.started = true; document.getElementById('start-screen').style.display='none';
            if(split) { document.getElementById('p2-ui').style.display='flex'; document.getElementById('split-line').style.display='block'; }
            setInterval(() => { if(state.started && state.time>0) { state.time--; updateTimerUI(); if(state.time===0) endGame(); } }, 1000);
        }

        function animate() {
            requestAnimationFrame(animate);
            const now = performance.now();
            const delta = Math.min((now - state.lastFrame)/1000, 0.1);
            state.lastFrame = now;

            if(state.started) {
                updateEnvironment(delta);
                updatePlayers(delta);
                updateLogic(delta);
                render();
            } else {
                if(players[0].obj) players[0].obj.rotation.y += delta;
                renderer.render(scene, cam1);
            }
        }

        function updateEnvironment(delta) {
            state.dayTime = CONFIG.SUNSET + Math.sin(performance.now()*0.0001)*0.1;
            sun.position.set(Math.sin(state.dayTime)*500, Math.cos(state.dayTime)*500, 200);
            scene.background.setHSL(0.3, 0.8, 0.2 + Math.cos(state.dayTime)*0.3);
            scene.fog.color.copy(scene.background);
            state.objects.clouds.forEach(c => { c.position.x += delta*5; if(c.position.x > 1000) c.position.x = -1000; });
            state.objects.sunShafts.forEach(s => { s.opacity = 0.05 + Math.sin(performance.now()*0.001)*0.05; });
        }

        function updatePlayers(delta) {
            handleInput(0, 'KeyW', 'KeyS', 'KeyA', 'KeyD', 'Space', 'KeyE');
            if(state.is2P) handleInput(1, 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'ControlRight', 'ShiftRight');
            else { // Tails Auto
                const t = players[0].pos.clone().add(new THREE.Vector3(-Math.sin(players[0].yaw)*10, 2, -Math.cos(players[0].yaw)*10));
                players[1].pos.lerp(t, delta*3);
                players[1].obj.position.copy(players[1].pos);
                players[1].obj.lookAt(players[0].pos);
            }

            players.forEach(p => {
                if(!p.onGround) p.vel.y += CONFIG.GRAVITY;
                p.vel.x *= CONFIG.DRAG; p.vel.z *= CONFIG.DRAG;
                p.pos.add(p.vel);
                if(p.pos.y < 1.2) { p.pos.y = 1.2; p.vel.y = 0; p.onGround = true; p.trick = 0; }
                p.obj.position.copy(p.pos); p.obj.rotation.y = p.yaw;
                // Trick animation
                if(p.trick > 0) { p.obj.rotation.x += delta*15; p.obj.rotation.z += delta*10; }
            });
        }

        function handleInput(i, f, b, l, r, j, t) {
            const p = players[i];
            if(state.keys[l]) p.yaw += 0.08; if(state.keys[r]) p.yaw -= 0.08;
            if(state.keys[f]) { p.vel.x += Math.sin(p.yaw)*CONFIG.ACCEL; p.vel.z += Math.cos(p.yaw)*CONFIG.ACCEL; }
            if(state.keys[b]) { p.vel.x -= Math.sin(p.yaw)*CONFIG.ACCEL; p.vel.z -= Math.cos(p.yaw)*CONFIG.ACCEL; }
            if(state.keys[j] && p.onGround) { p.vel.y = CONFIG.JUMP; p.onGround = false; }
            if(state.keys[t] && !p.onGround && p.trick === 0) { p.trick = 1; p.vel.y += 0.2; showNotification("COOL TRICK! +5 RINGS"); p.rings += 5; updateUI(); }
        }

        function updateLogic(delta) {
            // Rings Magnetism
            for(let i=state.objects.rings.length-1; i>=0; i--) {
                const r = state.objects.rings[i];
                players.forEach(p => {
                    const d = r.position.distanceTo(p.pos);
                    if(d < CONFIG.MAGNET) { r.position.lerp(p.pos, 0.2); if(d < 3) { scene.remove(r); state.objects.rings.splice(i,1); p.rings++; updateUI(); } }
                });
            }
            // Seekers
            state.objects.seekers.forEach(s => {
                if(s.userData.state === 'idle') {
                    s.userData.angle += delta; s.position.x += Math.sin(s.userData.angle)*0.2;
                    s.lookAt(s.position.x + Math.sin(s.userData.angle), s.position.y, s.position.z + Math.cos(s.userData.angle));
                    players.forEach(p => { if(s.position.distanceTo(p.pos) < 50) { 
                        const dir = p.pos.clone().sub(s.position).normalize();
                        const forward = new THREE.Vector3(0,0,1).applyQuaternion(s.quaternion);
                        if(dir.dot(forward) > 0.8) { s.userData.state = 'chase'; s.userData.target = p; showNotification("DETECTED!"); }
                    }});
                } else if(s.userData.state === 'chase') {
                    s.lookAt(s.userData.target.pos);
                    s.position.lerp(s.userData.target.pos, delta*1.5);
                    if(s.position.distanceTo(s.userData.target.pos) < 5) { s.userData.target.rings = Math.max(0, s.userData.target.rings-20); s.userData.state = 'idle'; updateUI(); }
                }
            });

            // --- PvP COLLISION & STEALING ---
            if (state.is2P) {
                const p0 = players[0];
                const p1 = players[1];
                const d = p0.pos.distanceTo(p1.pos);
                
                if (d < 2.5) { // Collision radius
                    const diff = p0.pos.clone().sub(p1.pos).normalize();
                    const bounceStrength = 0.5;
                    
                    // Apply Bounce
                    p0.vel.add(diff.clone().multiplyScalar(bounceStrength));
                    p1.vel.add(diff.clone().multiplyScalar(-bounceStrength));
                    
                    // Steal Logic (Cooldown based on time)
                    const now = performance.now();
                    if (!state.lastPvPHit || now - state.lastPvPHit > 1000) {
                        state.lastPvPHit = now;
                        
                        // Who stole? The higher player
                        if (p0.pos.y > p1.pos.y + 0.5) {
                            const stolen = Math.min(p1.rings, 10);
                            p1.rings -= stolen;
                            p0.rings += stolen;
                            showNotification("SONIC STOLE RINGS!");
                        } else if (p1.pos.y > p0.pos.y + 0.5) {
                            const stolen = Math.min(p0.rings, 10);
                            p0.rings -= stolen;
                            p1.rings += stolen;
                            showNotification("TAILS STOLE RINGS!");
                        } else {
                            showNotification("BOUNCE!");
                        }
                        updateUI();
                    }
                }
            }
        }

        function render() {
            const w = window.innerWidth, h = window.innerHeight;
            if(!state.is2P) { follow(cam1, players[0]); renderer.setViewport(0,0,w,h); renderer.render(scene, cam1); }
            else {
                renderer.setScissorTest(true);
                follow(cam1, players[0]); renderer.setViewport(0,0,w/2,h); renderer.setScissor(0,0,w/2,h); renderer.render(scene, cam1);
                follow(cam2, players[1]); renderer.setViewport(w/2,0,w/2,h); renderer.setScissor(w/2,0,w/2,h); renderer.render(scene, cam2);
            }
        }

        function follow(c, p) { c.position.lerp(p.pos.clone().add(new THREE.Vector3(-Math.sin(p.yaw)*20, 10, -Math.cos(p.yaw)*20)), 0.1); c.lookAt(p.pos); }
        function updateUI() { document.getElementById('p1-rings').innerText = players[0].rings; if(state.is2P) document.getElementById('p2-rings').innerText = players[1].rings; }
        function updateTimerUI() { const m = Math.floor(state.time/60), s = state.time%60; document.getElementById('timer-display').innerText = `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`; }
        function showNotification(t) { const n = document.getElementById('notification'); n.innerText = t; n.classList.add('active'); setTimeout(() => n.classList.remove('active'), 2000); }
        function endGame() { state.started = false; showNotification("GAME OVER"); setTimeout(() => location.reload(), 3000); }
        init();
    </script>
</body>
