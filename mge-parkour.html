<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parkour Runner - Mr. Gonzalez Experiments</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
        }

        #game-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .ui-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
        }

        .ui-panel {
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 1.5rem;
            margin: 1rem;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            border: 3px solid;
            pointer-events: auto;
            color: white;
        }

        .stats-panel {
            position: fixed;
            top: 1rem;
            left: 1rem;
            width: 280px;
            border-color: #4ecdc4;
            padding: 1rem;
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            margin: 0.5rem 0;
            font-size: 1rem;
        }

        .stat-label {
            opacity: 0.8;
        }

        .stat-value {
            font-weight: 800;
            color: #4ecdc4;
        }

        .controls-panel {
            position: fixed;
            bottom: 1rem;
            right: 1rem;
            width: 250px;
            border-color: #9c27b0;
            padding: 1rem;
        }

        .controls-panel h2 {
            font-size: 1rem;
            margin-bottom: 0.75rem;
            text-align: center;
            color: #9c27b0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .control-item {
            margin: 0.5rem 0;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .control-key {
            display: inline-block;
            background: linear-gradient(135deg, #9c27b0, #e91e63);
            color: white;
            padding: 0.4rem 0.6rem;
            border-radius: 8px;
            font-weight: 700;
            min-width: 40px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(156, 39, 176, 0.5);
        }

        .game-over {
            position: fixed;
            top: 2rem; /* Move to top */
            left: 50%;
            transform: translate(-50%, 0); /* Centered horizontally at top */
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(30px);
            border-radius: 30px;
            padding: 2rem; /* Slightly more compact */
            text-align: center;
            border: 4px solid #9c27b0;
            box-shadow: 0 0 50px rgba(156, 39, 176, 0.8);
            z-index: 100;
            display: none;
            color: white;
        }

        .game-over.show {
            display: block;
            animation: slideDown 0.5s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translate(-50%, -100%) scale(0.8);
            }

            to {
                opacity: 1;
                transform: translate(-50%, 0) scale(1);
            }
        }

        .game-over h2 {
            font-size: 3rem;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, #4ecdc4, #9c27b0, #e91e63);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .game-over button {
            margin-top: 1.5rem;
            padding: 1rem 2rem;
            background: linear-gradient(135deg, #9c27b0, #e91e63);
            color: white;
            border: none;
            border-radius: 15px;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 20px rgba(156, 39, 176, 0.5);
        }

        .game-over button:hover {
            transform: scale(1.1);
            box-shadow: 0 8px 30px rgba(156, 39, 176, 0.8);
        }

        .back-button {
            position: fixed;
            top: 1rem;
            right: 1rem;
            padding: 0.75rem 1.5rem;
            background: #000;
            color: white;
            text-decoration: none;
            border-radius: 12px;
            border: 2px solid #9c27b0;
            font-weight: 700;
            z-index: 2000; /* Extremely high z-index to stay above everything */
            transition: all 0.3s ease;
        }

        .back-button:hover {
            background: rgba(156, 39, 176, 0.3);
            transform: translateY(-2px);
        }

        .speed-indicator {
            position: fixed;
            bottom: 1rem;
            left: 1rem;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(20px);
            border-radius: 15px;
            padding: 0.75rem 1rem;
            border: 3px solid #ff9800;
            color: white;
            font-size: 0.9rem;
            font-weight: 700;
        }

        .speed-bar {
            width: 200px;
            height: 8px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            margin-top: 0.5rem;
            overflow: hidden;
        }

        .speed-fill {
            height: 100%;
            background: linear-gradient(90deg, #4caf50, #8bc34a, #cddc39, #ffeb3b, #ff9800, #f44336);
            transition: width 0.1s ease;
            border-radius: 4px;
        }
    </style>
</head>

<body>
    <a href="mge.html" class="back-button">← Back to Experiments</a>

    <div id="game-container"></div>

    <div class="ui-overlay">
        <div class="stats-panel ui-panel">
            <div class="stat-item">
                <span class="stat-label">Distance:</span>
                <span class="stat-value" id="distance">0m</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Score:</span>
                <span class="stat-value" id="score">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Coins:</span>
                <span class="stat-value" id="coins">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Time:</span>
                <span class="stat-value" id="time">0:00</span>
            </div>
        </div>

        <div class="speed-indicator">
            <div>Speed: <span id="speed-value">0</span> km/h</div>
            <div class="speed-bar">
                <div class="speed-fill" id="speed-fill" style="width: 0%;"></div>
            </div>
        </div>

        <div id="trick-notif"
            style="position: fixed; top: 50%; left: 50%; transform: translate(-50%, -100%); color: #ffeb3b; font-size: 3rem; font-weight: 900; text-shadow: 0 0 20px #ff9800; pointer-events: none; opacity: 0; transition: opacity 0.2s, transform 0.2s; z-index: 100;">
            FLIP!</div>

        <div class="controls-panel ui-panel">
            <h2>🎮 Controls</h2>
            <div class="control-item">
                <span class="control-key">A / D</span>
                <span>Move Lanes</span>
            </div>
            <div class="control-item">
                <span class="control-key">SPACE (Hit)</span>
                <span>Jump</span>
            </div>
            <div class="control-item">
                <span class="control-key">SPACE (Hold)</span>
                <span>Flip Trick</span>
            </div>
            <div class="control-item">
                <span class="control-key">S</span>
                <span>Slide</span>
            </div>
        </div>

        <div class="game-over" id="game-over">
            <h2>Game Over!</h2>
            <p style="font-size: 1.2rem; margin-top: 1rem;">Final Score: <span id="final-score">0</span></p>
            <p style="font-size: 1rem; margin-top: 0.5rem; opacity: 0.8;">Distance: <span id="final-distance">0m</span>
            </p>
            <button onclick="restartGame()">Play Again</button>
        </div>
    </div>

    <script>
        // Game state
        let scene, camera, renderer;
        let player;
        let keys = {};
        let gameRunning = true;
        let gameSpeed = 0.3;
        let distance = 0;
        let score = 0;
        let coins = 0;
        let gameTime = 0;
        let playerLane = 0; // -1 left, 0 center, 1 right
        let isJumping = false;
        let isSliding = false;
        let isFlipping = false;
        let flipRotation = 0;
        let trickScore = 0;
        let playerY = 1;
        let playerVelocityY = 0;
        let obstacles = [];
        let collectibles = [];
        let platforms = [];
        let lastObstacleZ = -10;
        let lastCollectibleZ = -5;
        let spacePressed = false;
        let spaceHoldStartTime = 0;

        // Lanes: left = -2, center = 0, right = 2
        const LANES = [-2, 0, 2];
        const GRAVITY = -0.5;
        const JUMP_FORCE = 0.4;
        const LANE_CHANGE_SPEED = 0.15;

        // Initialize Three.js scene
        function init() {
            const container = document.getElementById('game-container');
            const width = window.innerWidth;
            const height = window.innerHeight;

            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x050510);
            scene.fog = new THREE.Fog(0x050510, 15, 120);

            // Camera
            camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
            camera.position.set(0, 3, 5);
            camera.lookAt(0, 2, 0);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(width, height);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0x404040, 0.4);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0x4ecdc4, 0.6);
            directionalLight.position.set(10, 20, 10);
            directionalLight.castShadow = true;
            directionalLight.shadow.mapSize.width = 2048;
            directionalLight.shadow.mapSize.height = 2048;
            directionalLight.shadow.camera.near = 0.5;
            directionalLight.shadow.camera.far = 50;
            directionalLight.shadow.camera.left = -10;
            directionalLight.shadow.camera.right = 10;
            directionalLight.shadow.camera.top = 10;
            directionalLight.shadow.camera.bottom = -10;
            scene.add(directionalLight);

            // Create player
            createPlayer();

            // Create initial track
            createTrack();

            // Create background
            createBackground();

            // Event listeners
            window.addEventListener('resize', onWindowResize);
            document.addEventListener('keydown', onKeyDown);
            document.addEventListener('keyup', onKeyUp);

            // Start game loop
            animate();
        }

        function createPlayer() {
            const group = new THREE.Group();

            // Visual container for flipping
            const visuals = new THREE.Group();
            group.add(visuals);

            // Body
            const bodyGeometry = new THREE.BoxGeometry(0.6, 1, 0.6);
            const bodyMaterial = new THREE.MeshStandardMaterial({
                color: 0x4ecdc4,
                emissive: 0x4ecdc4,
                emissiveIntensity: 0.3,
                roughness: 0.3,
                metalness: 0.5
            });
            const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
            body.position.y = 0.5;
            body.castShadow = true;
            visuals.add(body);

            // Head
            const headGeometry = new THREE.SphereGeometry(0.3, 16, 16);
            const headMaterial = new THREE.MeshStandardMaterial({
                color: 0xffdbac,
                emissive: 0xffdbac,
                emissiveIntensity: 0.1
            });
            const head = new THREE.Mesh(headGeometry, headMaterial);
            head.position.y = 1.3;
            head.castShadow = true;
            visuals.add(head);

            // Eyes / Goggles for parkour look
            const eyeGeo = new THREE.BoxGeometry(0.4, 0.1, 0.1);
            const eyeMat = new THREE.MeshStandardMaterial({ color: 0x1a1a2e, emissive: 0x4ecdc4, emissiveIntensity: 1 });
            const eyes = new THREE.Mesh(eyeGeo, eyeMat);
            eyes.position.set(0, 1.35, 0.25);
            visuals.add(eyes);

            // Arms
            const armGeometry = new THREE.BoxGeometry(0.2, 0.6, 0.2);
            const armMaterial = new THREE.MeshStandardMaterial({ color: 0x4ecdc4 });
            const leftArm = new THREE.Mesh(armGeometry, armMaterial);
            leftArm.position.set(-0.4, 0.8, 0);
            leftArm.castShadow = true;
            visuals.add(leftArm);
            const rightArm = new THREE.Mesh(armGeometry, armMaterial);
            rightArm.position.set(0.4, 0.8, 0);
            rightArm.castShadow = true;
            visuals.add(rightArm);

            // Legs
            const legGeometry = new THREE.BoxGeometry(0.2, 0.6, 0.2);
            const legMaterial = new THREE.MeshStandardMaterial({ color: 0x333333 });
            const leftLeg = new THREE.Mesh(legGeometry, legMaterial);
            leftLeg.position.set(-0.2, -0.1, 0);
            leftLeg.castShadow = true;
            visuals.add(leftLeg);
            const rightLeg = new THREE.Mesh(legGeometry, legMaterial);
            rightLeg.position.set(0.2, -0.1, 0);
            rightLeg.castShadow = true;
            visuals.add(rightLeg);

            group.position.set(0, playerY, 0);
            scene.add(group);
            player = group;
            player.visuals = visuals;
        }

        function createTrack() {
            // Create ground segments
            for (let i = 0; i < 50; i++) {
                const segment = new THREE.Mesh(
                    new THREE.BoxGeometry(6, 0.2, 2),
                    new THREE.MeshStandardMaterial({
                        color: 0x888888,
                        metalness: 0.3,
                        roughness: 0.7
                    })
                );
                segment.position.z = -i * 2;
                segment.receiveShadow = true;
                scene.add(segment);
                platforms.push(segment);
            }

            // Create lane dividers
            for (let i = 0; i < 100; i++) {
                const divider = new THREE.Mesh(
                    new THREE.BoxGeometry(0.1, 0.1, 0.5),
                    new THREE.MeshStandardMaterial({
                        color: 0xffff00,
                        emissive: 0xffff00,
                        emissiveIntensity: 0.5
                    })
                );
                divider.position.set(0, 0.15, -i * 0.5);
                scene.add(divider);
            }
        }

        function createBackground() {
            // Sky gradient
            const skyGeometry = new THREE.SphereGeometry(200, 32, 32);
            const skyMaterial = new THREE.MeshBasicMaterial({
                color: 0x87ceeb,
                side: THREE.BackSide
            });
            const sky = new THREE.Mesh(skyGeometry, skyMaterial);
            scene.add(sky);

            // Buildings in background
            for (let i = 0; i < 40; i++) {
                const bHeight = 10 + Math.random() * 20;
                const building = new THREE.Mesh(
                    new THREE.BoxGeometry(
                        4 + Math.random() * 4,
                        bHeight,
                        4 + Math.random() * 4
                    ),
                    new THREE.MeshStandardMaterial({
                        color: new THREE.Color().setHSL(0.7, 0.4, 0.1 + Math.random() * 0.1)
                    })
                );
                building.position.set(
                    (Math.random() > 0.5 ? 1 : -1) * (15 + Math.random() * 20),
                    bHeight / 2,
                    -i * 15
                );
                building.castShadow = true;
                building.receiveShadow = true;
                scene.add(building);

                // Add windows (glowing boxes)
                const windowGeo = new THREE.BoxGeometry(0.5, 0.2, 0.1);
                const windowMat = new THREE.MeshStandardMaterial({
                    color: 0xffffff,
                    emissive: 0xffffff,
                    emissiveIntensity: 1
                });
                for (let j = 0; j < 10; j++) {
                    const win = new THREE.Mesh(windowGeo, windowMat);
                    win.position.set(
                        (Math.random() - 0.5) * 3,
                        (Math.random() - 0.5) * bHeight * 0.8,
                        2.01
                    );
                    building.add(win);
                }
            }
        }

        function spawnObstacle() {
            const laneIndex = Math.floor(Math.random() * 3);
            const lane = LANES[laneIndex];
            const obstacleType = Math.random() > 0.5 ? 'barrier' : 'wall';

            if (obstacleType === 'barrier') {
                const barrier = new THREE.Mesh(
                    new THREE.BoxGeometry(0.8, 1.5, 0.8),
                    new THREE.MeshStandardMaterial({
                        color: 0xf44336,
                        emissive: 0xf44336,
                        emissiveIntensity: 0.3
                    })
                );
                barrier.position.set(lane, 0.75, lastObstacleZ - 20);
                barrier.castShadow = true;
                scene.add(barrier);
                obstacles.push(barrier);
            } else {
                const wall = new THREE.Mesh(
                    new THREE.BoxGeometry(1, 2, 0.5),
                    new THREE.MeshStandardMaterial({
                        color: 0x9e9e9e
                    })
                );
                wall.position.set(lane, 1, lastObstacleZ - 20);
                wall.castShadow = true;
                scene.add(wall);
                obstacles.push(wall);
            }

            lastObstacleZ -= 20;
        }

        function spawnCollectible() {
            const laneIndex = Math.floor(Math.random() * 3);
            const lane = LANES[laneIndex];
            const height = Math.random() > 0.5 ? 1.5 : 0.5;

            const coin = new THREE.Mesh(
                new THREE.CylinderGeometry(0.3, 0.3, 0.1, 16),
                new THREE.MeshStandardMaterial({
                    color: 0xffd700,
                    emissive: 0xffd700,
                    emissiveIntensity: 0.8,
                    metalness: 0.9,
                    roughness: 0.1
                })
            );
            coin.rotation.x = Math.PI / 2;
            coin.position.set(lane, height, lastCollectibleZ - 15);
            coin.castShadow = true;
            coin.userData = { type: 'coin' };
            scene.add(coin);
            collectibles.push(coin);

            lastCollectibleZ -= 15;
        }

        function onKeyDown(event) {
            const key = event.key.toLowerCase();
            if (key === ' ' && !keys[' ']) {
                // Initial press of space
                if (!isJumping && playerY <= 1.1) {
                    playerVelocityY = JUMP_FORCE;
                    isJumping = true;
                }
                spaceHoldStartTime = Date.now();
            }
            keys[key] = true;
            if ([' ', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(key)) {
                event.preventDefault();
            }
        }

        function onKeyUp(event) {
            const key = event.key.toLowerCase();
            keys[key] = false;
            if (key === ' ') {
                isFlipping = false;
            }
        }

        function updatePlayer() {
            if (!gameRunning) return;

            // Lane movement
            let targetLane = playerLane;
            if (keys['a'] && playerLane > -1 && !isLaneChanging) {
                targetLane = playerLane - 1;
                isLaneChanging = true;
            } else if (keys['d'] && playerLane < 1 && !isLaneChanging) {
                targetLane = playerLane + 1;
                isLaneChanging = true;
            }

            if (!keys['a'] && !keys['d']) {
                isLaneChanging = false;
            }

            // Smooth lane transition
            const targetX = LANES[targetLane + 1];
            const currentX = player.position.x;
            if (Math.abs(currentX - targetX) > 0.1) {
                player.position.x += (targetX - currentX) * LANE_CHANGE_SPEED;
            } else {
                player.position.x = targetX;
                playerLane = targetLane;
            }

            // Flipping (Holding space while jumping)
            if (keys[' '] && isJumping) {
                const holdTime = Date.now() - spaceHoldStartTime;
                if (holdTime > 150) { // Threshold for "hold"
                    isFlipping = true;
                    flipRotation += 0.25;
                    score += 2; // Bonus for flipping

                    // Show trick notification
                    const notif = document.getElementById('trick-notif');
                    notif.style.opacity = '1';
                    notif.style.transform = 'translate(-50%, -150%) scale(1.2)';
                }
            } else {
                isFlipping = false;
                document.getElementById('trick-notif').style.opacity = '0';
                document.getElementById('trick-notif').style.transform = 'translate(-50%, -100%) scale(1)';
                // Gently return flip rotation to multiple of 2*PI or 0
                if (!isJumping) {
                    flipRotation = 0;
                }
            }

            player.visuals.rotation.x = flipRotation;

            // Sliding
            if (keys['s']) {
                isSliding = true;
                player.scale.y = 0.5;
                player.position.y = 0.25;
            } else {
                isSliding = false;
                player.scale.y = 1;
            }

            // Gravity
            playerVelocityY += GRAVITY * 0.016;
            playerY += playerVelocityY;

            // Ground collision
            if (playerY <= 1) {
                playerY = 1;
                playerVelocityY = 0;
                isJumping = false;
                flipRotation = 0;
            }

            player.position.y = playerY;

            // Running animation
            const time = Date.now() * 0.01;
            if (!isJumping && !isSliding) {
                if (player.visuals.children[4] && player.visuals.children[5]) { // Legs
                    player.visuals.children[4].rotation.x = Math.sin(time * 2) * 0.5;
                    player.visuals.children[5].rotation.x = -Math.sin(time * 2) * 0.5;
                }
            } else if (isJumping) {
                // Tucked position for jump/flip
                if (player.visuals.children[4] && player.visuals.children[5]) {
                    player.visuals.children[4].rotation.x = -1;
                    player.visuals.children[5].rotation.x = -1;
                }
            }
        }

        let isLaneChanging = false;

        function updateGame() {
            if (!gameRunning) return;

            // Move everything forward
            const moveDistance = gameSpeed;
            distance += moveDistance;
            gameTime += 0.016;

            // Update obstacles
            obstacles.forEach((obstacle, index) => {
                obstacle.position.z += moveDistance;

                // Check collision
                const distanceX = Math.abs(obstacle.position.x - player.position.x);
                const distanceZ = Math.abs(obstacle.position.z - player.position.z);
                const distanceY = Math.abs(obstacle.position.y - player.position.y);

                if (distanceX < 0.5 && distanceZ < 1 && distanceY < 1.5 && !isSliding) {
                    endGame();
                }

                // Remove old obstacles
                if (obstacle.position.z > 5) {
                    scene.remove(obstacle);
                    obstacles.splice(index, 1);
                }
            });

            // Update collectibles
            collectibles.forEach((collectible, index) => {
                collectible.rotation.y += 0.1;
                collectible.position.z += moveDistance;

                // Check collection
                const distanceX = Math.abs(collectible.position.x - player.position.x);
                const distanceZ = Math.abs(collectible.position.z - player.position.z);
                const distanceY = Math.abs(collectible.position.y - player.position.y);

                if (distanceX < 0.5 && distanceZ < 0.5 && distanceY < 1) {
                    coins++;
                    score += 10;
                    scene.remove(collectible);
                    collectibles.splice(index, 1);
                    createCollectEffect(collectible.position);
                }

                // Remove old collectibles
                if (collectible.position.z > 5) {
                    scene.remove(collectible);
                    collectibles.splice(index, 1);
                }
            });

            // Spawn new obstacles and collectibles
            if (lastObstacleZ > -distance - 50) {
                spawnObstacle();
            }
            if (lastCollectibleZ > -distance - 30) {
                spawnCollectible();
            }

            // Increase speed over time
            gameSpeed = Math.min(0.3 + distance * 0.001, 0.8);

            // Update UI
            updateUI();
        }

        function createCollectEffect(position) {
            for (let i = 0; i < 8; i++) {
                const particle = new THREE.Mesh(
                    new THREE.SphereGeometry(0.1, 8, 8),
                    new THREE.MeshStandardMaterial({
                        color: 0xffd700,
                        emissive: 0xffd700,
                        emissiveIntensity: 1
                    })
                );
                particle.position.set(position.x, position.y, position.z);
                scene.add(particle);

                const angle = (Math.PI * 2 * i) / 8;
                const speed = 0.2;
                const velocity = {
                    x: Math.cos(angle) * speed,
                    y: Math.sin(angle) * speed,
                    z: (Math.random() - 0.5) * 0.1
                };

                let frame = 0;
                const animate = () => {
                    frame++;
                    particle.position.x += velocity.x;
                    particle.position.y += velocity.y;
                    particle.position.z += velocity.z;
                    particle.material.opacity -= 0.05;
                    if (particle.material.opacity > 0 && frame < 20) {
                        requestAnimationFrame(animate);
                    } else {
                        scene.remove(particle);
                    }
                };
                animate();
            }
        }

        function updateUI() {
            document.getElementById('distance').textContent = Math.floor(distance) + 'm';
            document.getElementById('score').textContent = score + Math.floor(distance);
            document.getElementById('coins').textContent = coins;

            const minutes = Math.floor(gameTime / 60);
            const seconds = Math.floor(gameTime % 60);
            document.getElementById('time').textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;

            const speedKmh = Math.floor(gameSpeed * 100);
            document.getElementById('speed-value').textContent = speedKmh;
            document.getElementById('speed-fill').style.width = (gameSpeed / 0.8 * 100) + '%';
        }

        function endGame() {
            gameRunning = false;
            document.getElementById('final-score').textContent = score + Math.floor(distance);
            document.getElementById('final-distance').textContent = Math.floor(distance) + 'm';
            document.getElementById('game-over').classList.add('show');
        }

        function restartGame() {
            // Reset game state
            gameSpeed = 0.3;
            distance = 0;
            score = 0;
            coins = 0;
            gameTime = 0;
            playerLane = 0;
            isJumping = false;
            isSliding = false;
            isWallRunning = false;
            playerY = 1;
            playerVelocityY = 0;
            lastObstacleZ = -10;
            lastCollectibleZ = -5;

            // Remove all obstacles and collectibles
            obstacles.forEach(obstacle => scene.remove(obstacle));
            collectibles.forEach(collectible => scene.remove(collectible));
            obstacles = [];
            collectibles = [];

            // Reset player
            player.position.set(0, 1, 0);
            player.scale.y = 1;

            // Update UI
            updateUI();
            document.getElementById('game-over').classList.remove('show');
            gameRunning = true;

            // Spawn initial obstacles
            setTimeout(() => {
                spawnObstacle();
                spawnCollectible();
            }, 1000);
        }

        function animate() {
            requestAnimationFrame(animate);

            updatePlayer();
            updateGame();

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // Start the game
        init();
    </script>
</body>

</html>
