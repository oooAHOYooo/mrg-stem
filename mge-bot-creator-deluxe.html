<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bot Creator Deluxe!</title>
    <!-- Anime/Action style fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Teko:wght@500;700&family=Noto+Sans+JP:wght@700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/three@0.134.0/build/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/23.1.3/tween.umd.js"></script>
    
    <style>
        :root {
            --neon-pink: #ff007f;
            --neon-blue: #00f0ff;
            --neon-yellow: #ffe600;
            --neon-green: #39ff14;
            --dark-bg: #111;
            font-family: 'Teko', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--dark-bg);
            color: white;
            touch-action: manipulation;
        }

        #game-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Anime UI Overlay */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
        }

        /* Top HUD */
        #hud {
            position: absolute;
            top: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
            background: linear-gradient(180deg, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0) 100%);
        }

        .stat-box {
            background: rgba(17, 17, 17, 0.8);
            border: 4px solid var(--neon-blue);
            transform: skewX(-15deg);
            padding: 10px 30px;
            display: flex;
            align-items: center;
            box-shadow: 4px 4px 0px var(--neon-pink);
            pointer-events: auto;
        }

        .stat-box-inner {
            transform: skewX(15deg);
            font-size: 28px;
            letter-spacing: 2px;
            display: flex;
            gap: 15px;
            text-shadow: 1px 1px 0 #000;
        }

        .material-icon { color: var(--neon-yellow); }
        .point-icon { color: var(--neon-blue); }

        /* Screens */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            pointer-events: none;
            box-sizing: border-box;
            padding: 80px 20px 20px 20px;
        }

        .screen.active {
            display: flex;
        }

        /* Base Screen Bottom Bar */
        #base-controls {
            margin-top: auto;
            display: flex;
            justify-content: center;
            gap: 20px;
            pointer-events: none;
            flex-wrap: wrap;
            padding-bottom: 20px;
        }

        .anime-btn {
            background: var(--neon-pink);
            color: #fff;
            border: none;
            padding: 15px 40px;
            font-family: 'Bangers', cursive;
            font-size: 32px;
            letter-spacing: 3px;
            cursor: pointer;
            pointer-events: auto;
            transform: skewX(-15deg);
            box-shadow: -5px 5px 0px var(--neon-blue);
            transition: all 0.1s ease;
            text-transform: uppercase;
            position: relative;
            overflow: hidden;
        }
        
        .anime-btn span {
            display: inline-block;
            transform: skewX(15deg);
            text-shadow: 2px 2px 0 #000;
        }

        .anime-btn:active {
            transform: skewX(-15deg) translate(-2px, 2px);
            box-shadow: -2px 2px 0px var(--neon-blue);
        }

        .anime-btn::before {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 50%; height: 100%;
            background: rgba(255,255,255,0.3);
            transform: skewX(-20deg);
            transition: left 0.3s;
        }
        .anime-btn:hover::before {
            left: 150%;
        }

        .anime-btn-blue {
            background: var(--neon-blue);
            box-shadow: -5px 5px 0px var(--neon-pink);
        }

        .anime-btn-yellow {
            background: var(--neon-yellow);
            color: #111;
            box-shadow: -5px 5px 0px var(--neon-pink);
        }
        .anime-btn-yellow span { text-shadow: none; }

        .cost-text {
            display: block;
            font-size: 20px;
            font-family: 'Teko', sans-serif;
            margin-top: 5px;
            color: #ffe600;
            text-shadow: 1px 1px 0 #000;
        }
        .anime-btn-yellow .cost-text { color: #111; text-shadow: none;}

        /* Title / Message */
        .anime-title {
            font-family: 'Bangers', cursive;
            font-size: 80px;
            text-align: center;
            color: var(--neon-yellow);
            text-shadow: 4px 4px 0px var(--neon-pink), -2px -2px 0px var(--neon-blue);
            margin: 0;
            pointer-events: auto;
            animation: pulse 2s infinite;
        }
        .jp-sub {
            font-family: 'Noto Sans JP', sans-serif;
            display: block;
            font-size: 30px;
            color: white;
            text-shadow: 2px 2px 0px #000;
            letter-spacing: 5px;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        /* Battle UI */
        #battle-ui {
            width: 100%;
            height: 100%;
            position: relative;
        }

        .health-bar-container {
            position: absolute;
            width: 40%;
            height: 40px;
            background: #222;
            border: 4px solid white;
            transform: skewX(-20deg);
            pointer-events: auto;
            box-shadow: 0 0 15px rgba(0,0,0,0.8);
        }

        .health-bar-container-player {
            top: 20px; left: 20px;
            border-color: var(--neon-blue);
        }

        .health-bar-container-enemy {
            top: 20px; right: 20px;
            border-color: var(--neon-pink);
        }

        .health-bar-fill {
            height: 100%;
            width: 100%;
            background: var(--neon-green);
            transition: width 0.2s;
        }
        .health-bar-container-enemy .health-bar-fill{ background: var(--neon-pink); }

        .health-text {
            position: absolute;
            top: -10px;
            left: 10px;
            transform: skewX(20deg);
            font-size: 32px;
            color: white;
            text-shadow: 2px 2px 0 #000;
        }
        .health-bar-container-enemy .health-text {
            right: 10px; left: auto;
            text-align: right;
        }

        .attack-btn {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%) skewX(-15deg);
            font-size: 60px;
            padding: 20px 80px;
            background: linear-gradient(45deg, var(--neon-yellow), #ff7b00);
            box-shadow: -8px 8px 0px var(--neon-pink);
            animation: attackPulse 0.5s infinite alternate;
        }
        
        @keyframes attackPulse {
            0% { transform: translateX(-50%) skewX(-15deg) scale(1); box-shadow: -8px 8px 0px var(--neon-pink); }
            100% { transform: translateX(-50%) skewX(-15deg) scale(1.1); box-shadow: -15px 15px 0px var(--neon-pink); }
        }
        
        /* Combo UI */
        .combo-slots {
            position: absolute;
            bottom: 120px;
            display: flex;
            gap: 10px;
            pointer-events: none;
        }
        .combo-slots-p1 { left: 40px; }
        .combo-slots-p2 { right: 40px; }
        
        .combo-slot {
            width: 40px;
            height: 40px;
            background: rgba(0,0,0,0.5);
            border: 2px solid white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-family: 'Bangers';
            transform: skewX(-10deg);
        }
        .combo-slot.attack { border-color: var(--neon-pink); color: var(--neon-pink); }
        .combo-slot.heavy { border-color: var(--neon-yellow); color: var(--neon-yellow); }
        .combo-slot.block { border-color: var(--neon-blue); color: var(--neon-blue); }

        .energy-bar-container {
            position: absolute;
            bottom: 170px;
            width: 200px;
            height: 10px;
            background: #333;
            border: 2px solid white;
            transform: skewX(-20deg);
        }
        .energy-bar-p1 { left: 40px; }
        .energy-bar-p2 { right: 40px; }
        .energy-fill {
            height: 100%;
            width: 100%;
            background: var(--neon-yellow);
            transition: width 0.3s;
        }

        .controls-hint {
            position: absolute;
            top: 70px;
            padding: 10px;
            background: rgba(0,0,0,0.7);
            border: 2px solid white;
            font-size: 18px;
            letter-spacing: 1px;
            pointer-events: none;
            z-index: 5;
        }
        .hint-p1 { left: 20px; border-left: 8px solid var(--neon-blue); text-align: left; }
        .hint-p2 { right: 20px; border-right: 8px solid var(--neon-pink); text-align: right; }
        .hint-p1 b { color: var(--neon-blue); }
        .hint-p2 b { color: var(--neon-pink); }

        .damage-number {
            position: absolute;
            font-family: 'Bangers', cursive;
            font-size: 60px;
            color: red;
            text-shadow: -2px -2px 0 #fff, 2px -2px 0 #fff, -2px 2px 0 #fff, 2px 2px 0 #fff, 4px 4px 0 #000;
            pointer-events: none;
            z-index: 100;
            opacity: 1;
        }

        #battle-msg {
            position: absolute;
            top: 40%;
            width: 100%;
            text-align: center;
            font-family: 'Bangers', cursive;
            font-size: 100px;
            color: var(--neon-yellow);
            text-shadow: 5px 5px 0 var(--neon-pink), -2px -2px 0 #000;
            pointer-events: auto;
            display: none;
        }

        /* Modal Overlay */
        #modal-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            z-index: 50;
            backdrop-filter: blur(5px);
        }

        .modal-box {
            background: linear-gradient(135deg, var(--dark-bg), #222);
            border: 5px solid var(--neon-blue);
            transform: skewX(-5deg);
            padding: 40px;
            text-align: center;
            box-shadow: 10px 10px 0px var(--neon-pink);
        }

        .modal-box-inner {
            transform: skewX(5deg);
        }
        
        .reward-amount {
            font-family: 'Bangers';
            font-size: 50px;
            color: var(--neon-yellow);
            text-shadow: 2px 2px 0 #000;
            margin: 20px 0;
        }

        /* Speed lines background */
        .speed-lines {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: repeating-linear-gradient(
                90deg,
                transparent,
                transparent 49%,
                rgba(255, 255, 255, 0.1) 50%,
                transparent 51%
            );
            z-index: 0;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s;
        }

        /* Flash overlay */
        #flash-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: white;
            z-index: 999;
            pointer-events: none;
            opacity: 0;
        }

        .color-btn {
            width: 50px; height: 50px; 
            border: 3px solid white; 
            cursor: pointer; 
            transform: skewX(-10deg);
            transition: transform 0.2s;
        }
        .color-btn:hover { transform: skewX(-10deg) scale(1.1); }
        .color-btn.selected { border-color: var(--neon-pink); box-shadow: 0 0 10px var(--neon-pink); }

        @media (max-width: 768px) {
            .anime-btn { padding: 10px 20px; font-size: 20px; }
            .cost-text { font-size: 14px; }
            .health-bar-container { height: 25px; }
            .health-text { font-size: 20px; }
            .attack-btn { font-size: 40px; padding: 15px 40px; }
            .anime-title { font-size: 50px; }
            .stat-box-inner { font-size: 20px; }
            .color-btn { width: 40px; height: 40px; }
        }

    </style>
</head>
<body>

    <div class="speed-lines" id="speed-lines"></div>
    <div id="game-container"></div>
    <div id="flash-overlay"></div>

    <div id="ui-layer">
        <div id="hud">
            <div class="stat-box">
                <div class="stat-box-inner">
                    <span class="material-icon">⚙️</span>
                    <span id="player-materials">100</span>
                </div>
            </div>
            <div class="stat-box">
                <div class="stat-box-inner">
                    <span class="point-icon">⚡</span>
                    <span id="player-points">0</span>
                </div>
            </div>
        </div>

        <!-- Base Screen -->
        <div id="screen-base" class="screen active">
            <h1 class="anime-title">BOT CREATOR DELUXE<br><span class="jp-sub">ボットマスター</span></h1>
            
            <div id="base-controls">
                <button class="anime-btn btn-build" id="btn-build-car">
                    <span>BUILD CAR BOT<span class="cost-text">FREE</span></span>
                </button>
                <button class="anime-btn btn-build" id="btn-build-brawler">
                    <span>BUILD BRAWLER BOT<span class="cost-text">FREE</span></span>
                </button>
                <button class="anime-btn btn-build" id="btn-build-hawk">
                    <span>BUILD HAWK BOT<span class="cost-text">FREE</span></span>
                </button>
                <button class="anime-btn anime-btn-blue" id="btn-start-battle">
                    <span>BATTLE ENEMY ⚔️</span>
                </button>
                <button class="anime-btn btn-build" id="btn-start-versus" style="background: linear-gradient(to bottom, #ff00ff, #800080); color: white;">
                    <span>VERSUS MODE (2P) 🤜🤛</span>
                </button>
            </div>
        </div>

        <!-- Battle Screen -->
        <div id="screen-battle" class="screen">
            <div id="battle-ui">
                <div class="health-bar-container health-bar-container-player">
                    <div class="health-bar-fill" id="hp-player"></div>
                    <div class="health-text" id="hp-text-player">MY BOT: 100/100</div>
                </div>
                <div class="health-bar-container health-bar-container-enemy">
                    <div class="health-bar-fill" id="hp-enemy"></div>
                    <div class="health-text" id="hp-text-enemy">ENEMY: 100/100</div>
                </div>

                <!-- Controls Hints -->
                <div class="controls-hint hint-p1" id="hint-p1">
                    <b>P1 CONTROLS:</b><br>
                    [Q] LIGHT [W] HEAVY [E] BLOCK<br>
                    <b>[SPACE] DEPLOY COMBO!</b>
                </div>
                <div class="controls-hint hint-p2" id="hint-p2">
                    <b>P2 CONTROLS:</b><br>
                    [I] LIGHT [O] HEAVY [P] BLOCK<br>
                    <b>[ENTER] DEPLOY COMBO!</b>
                </div>

                <!-- Energy Bars -->
                <div class="energy-bar-container energy-bar-p1">
                    <div class="energy-fill" id="en-p1"></div>
                </div>
                <div class="energy-bar-container energy-bar-p2">
                    <div class="energy-fill" id="en-p2"></div>
                </div>

                <!-- Combo Slots -->
                <div class="combo-slots combo-slots-p1" id="combo-p1"></div>
                <div class="combo-slots combo-slots-p2" id="combo-p2"></div>

                <div id="battle-msg">FIGHT! 戦い!</div>

                <button class="anime-btn attack-btn" id="btn-player-attack">
                    <span>TAP TO ATTACK!!</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Modals -->
    <div id="modal-overlay">
        <div class="modal-box" id="modal-reward">
            <div class="modal-box-inner">
                <h2 class="anime-title" id="modal-title" style="font-size: 60px;">VICTORY! 勝訴!</h2>
                <div class="reward-amount" id="modal-reward-text">+50 ⚙️ | +100 ⚡</div>
                <button class="anime-btn anime-btn-yellow" id="btn-return-base">
                    <span>RETURN TO BASE</span>
                </button>
            </div>
        </div>
        <div class="modal-box" id="modal-wizard" style="display:none;">
            <div class="modal-box-inner">
                <h2 class="anime-title" style="font-size: 50px;">CUSTOMIZE BOT</h2>
                <div style="margin: 20px 0;">
                    <p style="font-size:30px; margin-bottom:10px;">SELECT COLOR</p>
                    <div id="color-options" style="display:flex; justify-content:center; gap:10px;">
                        <div class="color-btn" style="background:#00ffff;" id="btn-color-1"></div>
                        <div class="color-btn" style="background:#ff0044;" id="btn-color-2"></div>
                        <div class="color-btn" style="background:#ffe600;" id="btn-color-3"></div>
                        <div class="color-btn" style="background:#39ff14;" id="btn-color-4"></div>
                        <div class="color-btn" style="background:#ffffff;" id="btn-color-5"></div>
                    </div>
                </div>
                <button class="anime-btn anime-btn-blue" id="btn-confirm-build">
                    <span>CONFIRM CREATION</span>
                </button>
                <button class="anime-btn anime-btn-yellow" id="btn-cancel-wizard" style="margin-top:10px; display:block; margin-left:auto; margin-right:auto;">
                    <span>CANCEL</span>
                </button>
            </div>
        </div>
    </div>

<script>
    // System Variables
    let scene, camera, renderer, clock;
    let pointLight;
    let raycaster, mouse;
    let playerPos, enemyPos;
    let cameraTarget = new THREE.Vector3(0, 2, 0);
    let shakeIntensity = 0;
    let impactZoom = 0;
    let hitStopTimer = 0;


    
    // Game State
    let materials = 200;
    let points = 0;
    let gameState = 'BASE'; // BASE, BATTLE
    
    let army = []; // Array of bot groups
    let activeBot = null;
    let battleEnemyBot = null;

    const BOT_SPECS = {
        'CAR': { hp: 100, attack: 15, cost: 50, color: 0x00ffff },
        'HUMANOID': { hp: 150, attack: 25, cost: 100, color: 0xff0044 },
        'HAWK': { hp: 80, attack: 40, cost: 150, color: 0xffe600 }
    };

    let battleStats = {
        pMaxHp: 100, pHp: 100, pAttack: 10, pEnergy: 100, pCombo: [],
        eMaxHp: 100, eHp: 100, eAttack: 5, eEnergy: 100, eCombo: [],
        isActive: false, isVersus: false, isExecuting: { p1: false, p2: false }
    };

    // DOM elements and Listeners will be setup in init()

    function startApp() {
        console.log("Initializing Bot Creator Deluxe...");
        playerPos = new THREE.Vector3(-3, 0, 0);
        enemyPos = new THREE.Vector3(3, 0, 0);
        init();
        animate();
    }

    if (document.readyState === 'complete' || document.readyState === 'interactive') {
        startApp();
    } else {
        window.addEventListener('load', startApp);
    }

    let matEl, ptsEl, screenBase, screenBattle;
    let hpFillPlayer, hpTextPlayer, hpFillEnemy, hpTextEnemy;
    let battleMsg, modalOverlay, speedLines;

    function init() {
        console.log("Initializing Three.js scene...");
        
        // Grab elements
        matEl = document.getElementById('player-materials');
        ptsEl = document.getElementById('player-points');
        screenBase = document.getElementById('screen-base');
        screenBattle = document.getElementById('screen-battle');
        hpFillPlayer = document.getElementById('hp-player');
        hpTextPlayer = document.getElementById('hp-text-player');
        hpFillEnemy = document.getElementById('hp-enemy');
        hpTextEnemy = document.getElementById('hp-text-enemy');
        battleMsg = document.getElementById('battle-msg');
        modalOverlay = document.getElementById('modal-overlay');
        speedLines = document.getElementById('speed-lines');

        // Setup Listeners with arrow functions to handle deferred global scope
        document.getElementById('btn-build-car').onclick = () => window.openWizard('CAR');
        document.getElementById('btn-build-brawler').onclick = () => window.openWizard('HUMANOID');
        document.getElementById('btn-build-hawk').onclick = () => window.openWizard('HAWK');
        document.getElementById('btn-start-battle').onclick = () => window.startBattle(false);
        document.getElementById('btn-start-versus').onclick = () => window.startBattle(true);
        document.getElementById('btn-player-attack').onclick = () => window.playerAttack('P1', 'LIGHT');
        document.getElementById('btn-return-base').onclick = () => window.returnToBase();
        document.getElementById('btn-confirm-build').onclick = () => window.confirmBuild();
        document.getElementById('btn-cancel-wizard').onclick = () => window.closeWizard();

        document.getElementById('btn-color-1').onclick = function() { selectColor(0x00ffff, this); };
        document.getElementById('btn-color-2').onclick = function() { selectColor(0xff0044, this); };
        document.getElementById('btn-color-3').onclick = function() { selectColor(0xffe600, this); };
        document.getElementById('btn-color-4').onclick = function() { selectColor(0x39ff14, this); };
        document.getElementById('btn-color-5').onclick = function() { selectColor(0xffffff, this); };

        // Setup Three.js
        const container = document.getElementById('game-container');
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111111);

        // Grid helper
        const grid = new THREE.GridHelper(100, 50, 0x00f0ff, 0x222222);
        grid.position.y = -1;
        scene.add(grid);

        camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 15, 15);
        camera.lookAt(0, 0, -5);
        
        renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        pointLight = new THREE.PointLight(0xffffff, 1, 100);
        pointLight.position.set(5, 10, 5);
        scene.add(pointLight);
        
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(-10, 10, 5);
        scene.add(dirLight);

        clock = new THREE.Clock();
        raycaster = new THREE.Raycaster();
        mouse = new THREE.Vector2();

        // Handle resize
        window.addEventListener('resize', onWindowResize, false);
        window.addEventListener('pointerdown', onPointerDown, false);
        window.addEventListener('pointermove', onPointerMove, false);

        // Build a starter bot
        materials += 50; 
        buildBot('CAR', true);
        
        setBaseCamera();
        updateHUD();
        console.log("Ready!");
    }

    // --- Bot Generation Logic ---
    function makeAnimeMesh(geometry, colorStr) {
        const group = new THREE.Group();
        
        // Solid color cel-style
        const mat = new THREE.MeshToonMaterial({ 
            color: colorStr, 
            gradientMap: null // Default toon looks fine
        });
        const mesh = new THREE.Mesh(geometry, mat);
        
        // Anime Outline Effect (Backface culling)
        const outlineMat = new THREE.MeshBasicMaterial({ color: 0x000000, side: THREE.BackSide });
        const outline = new THREE.Mesh(geometry, outlineMat);
        outline.scale.setScalar(1.08); // Inflate for outline
        
        group.add(mesh);
        group.add(outline);
        return group;
    }

    function createBot(type, isEnemy = false, customColor = null) {
        const botGroup = new THREE.Group();
        const color = isEnemy ? 0xcc00ff : (customColor !== null ? customColor : BOT_SPECS[type].color); // Enemies are purple
        
        if (type === 'CAR') {
            // Main body
            const bodyGeo = new THREE.BoxGeometry(2, 1, 3);
            const body = makeAnimeMesh(bodyGeo, color);
            body.position.y = 0.5;
            botGroup.add(body);
            // Wheels
            const wheelGeo = new THREE.CylinderGeometry(0.5, 0.5, 0.5, 16);
            wheelGeo.rotateZ(Math.PI / 2);
            for(let i=0; i<4; i++) {
                const wheel = makeAnimeMesh(wheelGeo, 0x333333);
                wheel.position.set(i<2?-1.2:1.2, 0, i%2==0?-1:1);
                botGroup.add(wheel);
            }
        } 
        else if (type === 'HUMANOID') {
            // Torso
            const torsoGeo = new THREE.BoxGeometry(1.5, 2, 1);
            const torso = makeAnimeMesh(torsoGeo, color);
            torso.position.y = 2;
            botGroup.add(torso);
            // Head
            const headGeo = new THREE.BoxGeometry(1, 1, 1);
            const head = makeAnimeMesh(headGeo, 0xffffff);
            head.position.y = 3.5;
            botGroup.add(head);
            // Arms
            const armGeo = new THREE.BoxGeometry(0.5, 2, 0.5);
            const armL = makeAnimeMesh(armGeo, color);
            armL.position.set(-1.1, 2, 0);
            const armR = makeAnimeMesh(armGeo, color);
            armR.position.set(1.1, 2, 0);
            botGroup.add(armL, armR);
            // Legs
            const legGeo = new THREE.BoxGeometry(0.6, 1.5, 0.6);
            const legL = makeAnimeMesh(legGeo, 0x333333);
            legL.position.set(-0.4, 0.5, 0);
            const legR = makeAnimeMesh(legGeo, 0x333333);
            legR.position.set(0.4, 0.5, 0);
            botGroup.add(legL, legR);
        }
        else if (type === 'HAWK') {
            // Body
            const bodyGeo = new THREE.ConeGeometry(0.8, 3, 4);
            bodyGeo.rotateX(Math.PI / 2);
            const body = makeAnimeMesh(bodyGeo, color);
            body.position.y = 2;
            botGroup.add(body);
            // Wings
            const wingGeo = new THREE.BoxGeometry(4, 0.2, 1);
            const wing = makeAnimeMesh(wingGeo, color);
            wing.position.set(0, 2.2, 0);
            botGroup.add(wing);
            // Beak
            const beakGeo = new THREE.ConeGeometry(0.3, 1, 4);
            beakGeo.rotateX(-Math.PI / 2);
            const beak = makeAnimeMesh(beakGeo, 0xffaa00);
            beak.position.set(0, 2, 1.5);
            botGroup.add(beak);
        }

        // Add a pulsing selection ring under it if not enemy
        if (!isEnemy) {
            const ringGeo = new THREE.RingGeometry(1.5, 1.8, 32);
            ringGeo.rotateX(-Math.PI/2);
            const ringMat = new THREE.MeshBasicMaterial({ color: 0x00f0ff, side: THREE.DoubleSide, transparent: true, opacity: 0.5 });
            const ring = new THREE.Mesh(ringGeo, ringMat);
            ring.position.y = -0.9;
            ring.userData.isRing = true;
            botGroup.add(ring);
        } else { // Enemy ring
            const ringGeo = new THREE.RingGeometry(1.5, 1.8, 32);
            ringGeo.rotateX(-Math.PI/2);
            const ringMat = new THREE.MeshBasicMaterial({ color: 0xff0044, side: THREE.DoubleSide, transparent: true, opacity: 0.5 });
            const ring = new THREE.Mesh(ringGeo, ringMat);
            ring.position.y = -0.9;
            botGroup.add(ring);
        }

        // Bobbing animation data
        botGroup.userData = { type: type, startY: botGroup.position.y, bobOffset: Math.random() * Math.PI * 2 };
        
        return botGroup;
    }

    // --- State Logic ---
    function updateHUD() {
        matEl.innerText = materials;
        ptsEl.innerText = points;
    }

    window.buildBot = function(type, isFree = false, customColor = null) {
        // Free cost logic
        const bot = createBot(type, false, customColor);
        army.push(bot);
        scene.add(bot);
        
        // Pick as active BEFORE organizing
        activeBot = bot;
        
        organizeArmy();
        
        // Spawn animation
        bot.scale.set(0,0,0);
        if (typeof TWEEN !== 'undefined') {
            new TWEEN.Tween(bot.scale)
                .to({x:1, y:1, z:1}, 500)
                .easing(function(k) {
                    const s = 1.70158 * 1.525;
                    if ((k *= 2) < 1) return 0.5 * (k * k * ((s + 1) * k - s));
                    return 0.5 * ((k -= 2) * k * ((s + 1) * k + s) + 2);
                })
                .start();
        } else {
            bot.scale.set(1, 1, 1);
        }
            
        flashColor('var(--neon-blue)');
    };

    // --- Wizard Logic ---
    let wizardType = null;
    let wizardColor = null;

    window.openWizard = function(type) {
        wizardType = type;
        wizardColor = BOT_SPECS[type].color; // default color
        
        document.getElementById('modal-reward').style.display = 'none';
        document.getElementById('modal-wizard').style.display = 'block';
        modalOverlay.style.display = 'flex';
        
        // Reset color selections
        document.querySelectorAll('.color-btn').forEach(btn => btn.classList.remove('selected'));
    };

    window.selectColor = function(colorHex, element) {
        wizardColor = colorHex;
        document.querySelectorAll('.color-btn').forEach(btn => btn.classList.remove('selected'));
        if (element) {
            element.classList.add('selected');
        }
        flashColor('white', 0.1); 
    };

    window.closeWizard = function() {
        modalOverlay.style.display = 'none';
        document.getElementById('modal-wizard').style.display = 'none';
    };

    window.confirmBuild = function() {
        closeWizard();
        buildBot(wizardType, true, wizardColor);
    };

    function organizeArmy() {
        // Arrange army in a grid
        const cols = 5;
        army.forEach((bot, index) => {
            if(bot !== activeBot || gameState === 'BASE') {
                const x = (index % cols) * 5 - ((cols-1)*2.5);
                const z = -Math.floor(index / cols) * 5 - 5;
                
                new TWEEN.Tween(bot.position)
                    .to({x: x, z: z}, 500)
                    .easing(function(k) { return k * (2 - k); })
                    .start();
                    
                bot.rotation.y = 0;
            }
        });

        // Hide rings of non-active, show on active
        army.forEach(bot => {
            bot.children.forEach(c => {
                if (c.userData.isRing) c.visible = (bot === activeBot);
            });
        });
    }

    function setBaseCamera() {
        new TWEEN.Tween(camera.position)
            .to({x: 0, y: 15, z: 15}, 1000)
            .easing(function(k) { return k < 0.5 ? 4*k*k*k : (k-1)*(2*k-2)*(2*k-2)+1; })
            .start();
            
        // Look at center
        const target = {x: 0, y: 0, z: -5};
        const currentTarget = new THREE.Vector3(0,0,-5);
        new TWEEN.Tween(currentTarget)
            .to(target, 1000)
            .onUpdate(() => {
                camera.lookAt(currentTarget);
            })
            .start();
            
        speedLines.style.opacity = '0';
    }

    window.startBattle = function(isVersus = false) {
        if (army.length === 0) return;
        
        gameState = 'BATTLE';
        battleStats.isVersus = isVersus;
        screenBase.classList.remove('active');
        screenBattle.classList.add('active');
        
        speedLines.style.opacity = '1';

        // Choose enemy bot
        let eType;
        if (isVersus) {
            // Player 2 is a random bot from current specs for now, but purple
            const types = ['CAR', 'HUMANOID', 'HAWK'];
            eType = types[Math.floor(Math.random() * types.length)];
            battleEnemyBot = createBot(eType, true);
        } else {
            const types = ['CAR', 'HUMANOID', 'HAWK'];
            eType = types[Math.floor(Math.random() * types.length)];
            battleEnemyBot = createBot(eType, true);
        }
        scene.add(battleEnemyBot);

        // Position Active Bot and Enemy
        activeBot.position.copy(playerPos);
        activeBot.rotation.y = Math.PI / 2; // Face right
        
        battleEnemyBot.position.copy(enemyPos);
        battleEnemyBot.rotation.y = -Math.PI / 2; // Face left

        // Move others far away
        army.forEach(bot => {
            if (bot !== activeBot) {
                bot.position.y = -100; 
            }
        });

        // Battle Stats Setup
        const pSpec = BOT_SPECS[activeBot.userData.type];
        const eSpec = BOT_SPECS[eType];
        const eMulti = isVersus ? 1 : (1 + (points / 200));

        battleStats = {
            pMaxHp: pSpec.hp, pHp: pSpec.hp, pAttack: pSpec.attack, pEnergy: 100, pCombo: [],
            eMaxHp: isVersus ? eSpec.hp : Math.floor(eSpec.hp * eMulti),
            eHp: isVersus ? eSpec.hp : Math.floor(eSpec.hp * eMulti),
            eAttack: isVersus ? eSpec.attack : Math.floor(eSpec.attack * eMulti),
            eEnergy: 100, eCombo: [],
            isActive: true,
            isVersus: isVersus,
            isExecuting: { p1: false, p2: false }
        };

        updateHealthUI();
        updateComboUI();
        
        showBattleMessage(isVersus ? "VERSUS START!!" : "BATTLE START!!", 1000);

        // Camera to battle view (Initial snap, then animate will follow)
        new TWEEN.Tween(camera.position)
            .to({x: 0, y: 6, z: 14}, 800)
            .easing(TWEEN.Easing.Quadratic.Out)
            .start();
            
        cameraTarget.set(0, 2, 0);

        // Hide attack button for versus
        document.getElementById('btn-player-attack').style.display = isVersus ? 'none' : 'block';

        // Start Enemy Attack Loop only if NOT versus
        if (!isVersus) enemyAttackLoop();
    }

    function updateHealthUI() {
        const pPct = Math.max(0, battleStats.pHp) / battleStats.pMaxHp * 100;
        const ePct = Math.max(0, battleStats.eHp) / battleStats.eMaxHp * 100;

        hpFillPlayer.style.width = pPct + '%';
        hpFillEnemy.style.width = ePct + '%';

        hpTextPlayer.innerText = `${battleStats.isVersus ? 'P1' : 'MY BOT'}: ${Math.max(0, battleStats.pHp)}/${battleStats.pMaxHp}`;
        hpTextEnemy.innerText = `${battleStats.isVersus ? 'P2' : 'ENEMY'}: ${Math.max(0, battleStats.eHp)}/${battleStats.eMaxHp}`;

        if (pPct < 30) hpFillPlayer.style.background = 'red';
        else hpFillPlayer.style.background = 'var(--neon-green)';

        if (ePct < 30) hpFillEnemy.style.background = 'red';
        else hpFillEnemy.style.background = 'var(--neon-pink)';

        // Update Energy
        document.getElementById('en-p1').style.width = battleStats.pEnergy + '%';
        document.getElementById('en-p2').style.width = battleStats.eEnergy + '%';
    }

    function updateComboUI() {
        const c1 = document.getElementById('combo-p1');
        const c2 = document.getElementById('combo-p2');
        c1.innerHTML = '';
        c2.innerHTML = '';

        battleStats.pCombo.forEach(type => {
            const div = document.createElement('div');
            div.className = `combo-slot ${type.toLowerCase()}`;
            div.innerText = type[0];
            c1.appendChild(div);
        });

        battleStats.eCombo.forEach(type => {
            const div = document.createElement('div');
            div.className = `combo-slot ${type.toLowerCase()}`;
            div.innerText = type[0];
            c2.appendChild(div);
        });
    }

    function recordMove(player, type) {
        if (!battleStats.isActive) return;
        const combo = (player === 'P1') ? battleStats.pCombo : battleStats.eCombo;
        if (combo.length >= 5) return;
        
        combo.push(type);
        updateComboUI();
        flashColor(player === 'P1' ? 'var(--neon-blue)' : 'var(--neon-pink)', 0.05);
    }

    function createDamageText(x, y, text) {
        const el = document.createElement('div');
        el.className = 'damage-number';
        el.innerText = text;
        el.style.left = x + 'px';
        el.style.top = y + 'px';
        document.body.appendChild(el);

        let dy = 0;
        let op = 1;
        const interval = setInterval(() => {
            dy -= 2;
            op -= 0.02;
            el.style.transform = `translateY(${dy}px)`;
            el.style.opacity = op;
            if (op <= 0) {
                clearInterval(interval);
                el.remove();
            }
        }, 16);
    }

    function getScreenPos(vector3) {
        const v = vector3.clone();
        v.project(camera);
        const x = (v.x *  .5 + .5) * window.innerWidth;
        const y = (v.y * -.5 + .5) * window.innerHeight;
        return {x, y};
    }

    window.playerAttack = function(player = 'P1', type = 'LIGHT') {
        if (!battleStats.isActive) return;
        
        const isP1 = (player === 'P1');
        const attacker = isP1 ? activeBot : battleEnemyBot;
        const target = isP1 ? battleEnemyBot : activeBot;
        const targetPos = isP1 ? enemyPos : playerPos;
        const attackerPos = isP1 ? playerPos : enemyPos;

        // Energy Cost
        const cost = (type === 'HEAVY') ? 30 : (type === 'BLOCK' ? 10 : 15);
        if (isP1) {
            if (battleStats.pEnergy < cost) return;
            battleStats.pEnergy -= cost;
        } else {
            if (battleStats.eEnergy < cost) return;
            battleStats.eEnergy -= cost;
        }

        if (type === 'BLOCK') {
            // Visualize Block
            new TWEEN.Tween(attacker.scale)
                .to({x: 1.2, z: 1.2}, 100)
                .yoyo(true).repeat(1)
                .start();
            attacker.userData.isBlocking = true;
            setTimeout(() => attacker.userData.isBlocking = false, 500);
            return;
        }

        // Animate Dash
        const dashTime = (type === 'HEAVY') ? 300 : 150;
        const offset = isP1 ? -2 : 2;
        
        new TWEEN.Tween(attacker.position)
            .to({x: targetPos.x + offset}, dashTime)
            .yoyo(true).repeat(1)
            .easing(function(k) { return k * (2 - k); })
            .start();

        // Screen Shake & Hit Impact
        shakeIntensity = (type === 'HEAVY') ? 1.0 : 0.4;
        if (type === 'HEAVY') impactZoom = 3.0;

        // Smash Hit-Stop Effect (Pause briefly)
        hitStopTimer = (type === 'HEAVY') ? 10 : 5; // frames to skip


        // Damage calculation
        const baseAtk = isP1 ? battleStats.pAttack : battleStats.eAttack;
        const multiplier = (type === 'HEAVY') ? 2.5 : 1.0;
        const isCrit = Math.random() < (isP1 ? 0.2 : 0.1);
        
        let dmg = Math.floor(baseAtk * multiplier * (isCrit ? 2 : (0.8 + Math.random()*0.4)));
        
        // Target Block Check
        if (target.userData.isBlocking) {
            dmg = Math.floor(dmg * 0.2);
            showBattleMessage("BLOCKED!", 500);
        }

        if (isP1) battleStats.eHp -= dmg;
        else battleStats.pHp -= dmg;
        
        // Smash Flash
        if (type === 'HEAVY') {
            flashColor('white', 0.2);
            speedLines.style.opacity = '1';
            setTimeout(() => { if (gameState === 'BATTLE') speedLines.style.opacity = '1'; }, 100);
        }

        const sp = getScreenPos(target.position);
        createDamageText(sp.x + (Math.random()*50-25), sp.y - 100, isCrit ? `${dmg} CRIT!` : dmg);

        updateHealthUI();
        flashColor(isP1 ? 'white' : 'red', 0.1);

        if (battleStats.eHp <= 0) endBattle(true);
        else if (battleStats.pHp <= 0) endBattle(false);
    }

    async function deployCombo(player) {
        if (!battleStats.isActive) return;
        const isP1 = (player === 'P1');
        if (isP1 && battleStats.isExecuting.p1) return;
        if (!isP1 && battleStats.isExecuting.p2) return;
        
        const combo = isP1 ? battleStats.pCombo : battleStats.eCombo;
        if (combo.length === 0) return;

        if (isP1) battleStats.isExecuting.p1 = true; else battleStats.isExecuting.p2 = true;

        showBattleMessage(player + " COMBO!!", 500);

        for (const type of combo) {
            if (!battleStats.isActive) break;
            playerAttack(player, type);
            await new Promise(r => setTimeout(r, 400));
        }

        if (isP1) {
            battleStats.pCombo = [];
            battleStats.isExecuting.p1 = false;
        } else {
            battleStats.eCombo = [];
            battleStats.isExecuting.p2 = false;
        }
        updateComboUI();
    }

    function enemyAttackLoop() {
        if (!battleStats.isActive) return;

        setTimeout(() => {
            if (!battleStats.isActive) return;

            // Attack
            const dashTime = 200;
            new TWEEN.Tween(battleEnemyBot.position)
                .to({x: playerPos.x + 2}, dashTime)
                .yoyo(true).repeat(1)
                .easing(function(k) { return k * (2 - k); })
                .start();

            // Damage player
            const dmg = Math.floor(battleStats.eAttack * (0.8 + Math.random()*0.4));
            battleStats.pHp -= dmg;

            const sp = getScreenPos(activeBot.position);
            createDamageText(sp.x + (Math.random()*50-25), sp.y - 100, dmg);

            updateHealthUI();
            flashColor('red', 0.2);

            if (battleStats.pHp <= 0) {
                endBattle(false);
            } else {
                enemyAttackLoop(); // queue next attack
            }
        }, 1500 + Math.random() * 1000); // 1.5 to 2.5 seconds
    }

    function endBattle(playerWon) {
        battleStats.isActive = false;
        
        if (playerWon) {
            showBattleMessage("VICTORY!!", null);
            
            // Explode enemy setup
            shakeIntensity = 1.5;
            impactZoom = 6.0; // Zoom in for the killshot!
            
            new TWEEN.Tween(battleEnemyBot.scale)
                .to({x: 0, y: 0, z: 0}, 800)
                .easing(TWEEN.Easing.Back.In)
                .onComplete(() => {
                    scene.remove(battleEnemyBot);
                    battleEnemyBot = null;
                })
                .start();


            setTimeout(() => {
                const earnedMat = 30 + Math.floor(Math.random() * 40);
                const earnedPts = 100 + Math.floor(Math.random() * 50);
                
                materials += earnedMat;
                points += earnedPts;
                updateHUD();
                
                document.getElementById('modal-title').innerText = "VICTORY! 勝訴!";
                document.getElementById('modal-title').style.color = "var(--neon-yellow)";
                document.getElementById('modal-reward-text').innerText = `+${earnedMat} ⚙️ | +${earnedPts} ⚡`;
                modalOverlay.style.display = 'flex';
                
            }, 1000);

        } else {
            showBattleMessage("DEFEAT...", null);
            
            // Player explodes/falls
            new TWEEN.Tween(activeBot.rotation)
                .to({x: -Math.PI/2}, 500)
                .start();

            setTimeout(() => {
                scene.remove(activeBot);
                // remove from army
                army = army.filter(b => b !== activeBot);
                if (army.length > 0) {
                    activeBot = army[army.length-1]; // Pick another
                } else {
                    activeBot = null;
                }

                document.getElementById('modal-title').innerText = "DEFEAT! 敗北!";
                document.getElementById('modal-title').style.color = "red";
                // Consolation prize
                const earnedMat = 10;
                materials += earnedMat;
                updateHUD();
                document.getElementById('modal-reward-text').innerText = `+${earnedMat} ⚙️ (Consolation)`;
                modalOverlay.style.display = 'flex';

            }, 1500);
        }
    }

    window.returnToBase = function() {
        modalOverlay.style.display = 'none';
        screenBattle.classList.remove('active');
        screenBase.classList.add('active');
        battleMsg.style.display = 'none';
        gameState = 'BASE';

        if (battleEnemyBot) {
            scene.remove(battleEnemyBot);
            battleEnemyBot = null;
        }

        organizeArmy();
        setBaseCamera();
    }

    function showBattleMessage(text, duration) {
        battleMsg.innerText = text;
        battleMsg.style.display = 'block';
        battleMsg.style.transform = 'scale(0.1)';
        
        new TWEEN.Tween({s: 0.1})
            .to({s: 1.5}, 300)
            .easing(TWEEN.Easing.Elastic.Out)
            .onUpdate((obj) => {
                battleMsg.style.transform = `scale(${obj.s})`;
            })
            .start();

        if (duration) {
            setTimeout(() => { battleMsg.style.display = 'none'; }, duration);
        }
    }

    function flashColor(color, opacity=0.5) {
        const flash = document.getElementById('flash-overlay');
        flash.style.background = color;
        flash.style.opacity = opacity;
        setTimeout(() => { flash.style.opacity = 0; }, 100);
    }

    function onPointerDown(event) {
        if (modalOverlay.style.display === 'flex' || modalOverlay.style.display === 'block') return;

        mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

        if (gameState === 'BASE') {
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(army, true);
            if (intersects.length > 0) {
                let object = intersects[0].object;
                while (object.parent && !army.includes(object)) {
                    object = object.parent;
                }
                if (army.includes(object) && activeBot !== object) {
                    activeBot = object;
                    organizeArmy(); 
                    flashColor('var(--neon-green)', 0.1);
                    
                    new TWEEN.Tween(activeBot.position)
                        .to({y: activeBot.position.y + 2}, 200)
                        .yoyo(true).repeat(1)
                        .easing(function(k) { return k * (2 - k); })
                        .start();
                }
            }
        } else if (gameState === 'BATTLE' && !battleStats.isVersus) {
            if (!event.target.closest('.anime-btn') && battleStats.isActive) {
                playerAttack('P1', 'LIGHT');
            }
        }
    }

    function onPointerMove(event) {
        if (modalOverlay.style.display === 'flex' || modalOverlay.style.display === 'block') {
            document.body.style.cursor = 'default';
            return;
        }

        mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

        if (gameState === 'BASE') {
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(army, true);
            if (intersects.length > 0) {
                document.body.style.cursor = 'pointer';
            } else {
                document.body.style.cursor = 'default';
            }
        } else {
            document.body.style.cursor = 'crosshair';
        }
    }

    // Global Keyboard Support for Gameplay
    window.addEventListener('keydown', (e) => {
        if (modalOverlay.style.display === 'flex' || modalOverlay.style.display === 'block') return;
        
        if (gameState === 'BASE' && army.length > 0) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
                let currentIndex = army.indexOf(activeBot);
                if (e.key === 'ArrowRight') {
                    currentIndex = (currentIndex + 1) % army.length;
                } else {
                    currentIndex = (currentIndex - 1 + army.length) % army.length;
                }
                activeBot = army[currentIndex];
                organizeArmy();
                flashColor('var(--neon-green)', 0.1);
                
                new TWEEN.Tween(activeBot.position)
                    .to({y: activeBot.position.y + 2}, 200)
                    .yoyo(true).repeat(1)
                    .easing(function(k) { return k * (2 - k); })
                    .start();
            }
        } else if (gameState === 'BATTLE') {
            // PLAYER 1
            if (e.key.toLowerCase() === 'q') recordMove('P1', 'LIGHT');
            if (e.key.toLowerCase() === 'w') recordMove('P1', 'HEAVY');
            if (e.key.toLowerCase() === 'e') recordMove('P1', 'BLOCK');
            if (e.key === ' ') { e.preventDefault(); deployCombo('P1'); }

            // PLAYER 2 (Only in Versus)
            if (battleStats.isVersus) {
                if (e.key.toLowerCase() === 'i') recordMove('P2', 'LIGHT');
                if (e.key.toLowerCase() === 'o') recordMove('P2', 'HEAVY');
                if (e.key.toLowerCase() === 'p') recordMove('P2', 'BLOCK');
                if (e.key === 'Enter') deployCombo('P2');
            } else {
                if (e.key === 'Enter') deployCombo('P1'); // Fallback for single player
            }
        }
    });

    function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function updateBattleCamera() {
        if (!activeBot || !battleEnemyBot || gameState !== 'BATTLE') return;

        // Smash/Street Fighter style: Follow the midpoint
        const midpoint = new THREE.Vector3()
            .addVectors(activeBot.position, battleEnemyBot.position)
            .multiplyScalar(0.5);
        
        // Calculate distance for zooming
        const dist = activeBot.position.distanceTo(battleEnemyBot.position);
        
        // Target position based on midpoint and distance
        // Closer = Lower/Zoomed In, Farther = Higher/Zoomed Out
        const idealZ = Math.max(9, Math.min(22, dist + 6 - impactZoom));
        const idealY = Math.max(3, dist * 0.3 + 2.5);
        
        const targetPos = new THREE.Vector3(midpoint.x, idealY, idealZ);
        
        // Smoothly lerp camera position
        camera.position.lerp(targetPos, 0.08);
        
        // Target lookAt (Midpoint between bots)
        const lookTarget = midpoint.clone().add(new THREE.Vector3(0, 2, 0));
        cameraTarget.lerp(lookTarget, 0.1);
        camera.lookAt(cameraTarget);
        
        // Decay impact effects
        if (impactZoom > 0) impactZoom *= 0.9;
        
        // Apply Screen Shake
        if (shakeIntensity > 0) {
            camera.position.x += (Math.random() - 0.5) * shakeIntensity;
            camera.position.y += (Math.random() - 0.5) * shakeIntensity;
            shakeIntensity *= 0.85;
            if (shakeIntensity < 0.01) shakeIntensity = 0;
        }
    }

    function animate() {
        requestAnimationFrame(animate);
        
        // Smash Hit Stop logic - freeze moving parts but KEEP RENDERING
        if (hitStopTimer > 0) {
            hitStopTimer--;
            renderer.render(scene, camera);
            return;
        }

        TWEEN.update(performance.now());
        
        const t = clock.getElapsedTime();

        // Energy Regeneration
        if (gameState === 'BATTLE' && battleStats.isActive) {
            battleStats.pEnergy = Math.min(100, battleStats.pEnergy + 0.1);
            battleStats.eEnergy = Math.min(100, battleStats.eEnergy + 0.1);
            updateHealthUI();
        }

        // Bobbing animations for bots
        army.forEach(bot => {
            if (bot.userData.startY !== undefined) {
                bot.position.y = bot.userData.startY + Math.sin(t * 3 + bot.userData.bobOffset) * 0.2;
            }
        });
        if (battleEnemyBot) {
            battleEnemyBot.position.y = (battleEnemyBot.userData.startY || 0) + Math.sin(t * 3 + (battleEnemyBot.userData.bobOffset || 0)) * 0.2;
        }

        // Update Dynamic Camera in Battle
        if (gameState === 'BATTLE') {
            updateBattleCamera();
        }

        renderer.render(scene, camera);
    }
</script>
</body>
</html>
