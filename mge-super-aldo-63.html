<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Aldo 63 | MGE Castle World</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #facc15;
            --secondary: #a78bfa;
            --accent: #ef4444;
            --bg-deep: #0ea5e9;
            --ui-glass: rgba(15, 23, 42, 0.75);
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: 'Outfit', sans-serif;
            color: white;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }


        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 24px;
            box-sizing: border-box;
        }

        .hud-top {
            display: flex;
            justify-content: space-between;
            pointer-events: auto;
        }

        .badge {
            background: var(--ui-glass);
            backdrop-filter: blur(12px);
            padding: 10px 24px;
            border-radius: 99px;
            border: 2px solid var(--primary);
            font-weight: 950;
            color: var(--primary);
            text-transform: uppercase;
            box-shadow: 0 0 30px rgba(250, 204, 21, 0.4);
            text-decoration: none;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .controls-hint {
            background: var(--ui-glass);
            backdrop-filter: blur(10px);
            padding: 12px 24px;
            border-radius: 20px;
            font-size: 0.95rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            font-weight: 700;
            color: rgba(255,255,255,0.9);
        }

        /* Loading Screen */
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0ea5e9 0%, #0369a1 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .loader-content {
            text-align: center;
            animation: float 3s ease-in-out infinite;
        }

        .loader-logo {
            font-size: 5rem;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 20px rgba(255,255,255,0.4));
        }

        .loader-title {
            font-size: 2.5rem;
            font-weight: 900;
            letter-spacing: -1px;
            margin-bottom: 30px;
            text-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }

        .loader-bar-container {
            width: 320px;
            height: 12px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 99px;
            padding: 3px;
            border: 2px solid rgba(255,255,255,0.3);
            box-shadow: 0 0 30px rgba(0,0,0,0.2);
        }

        .loader-fill {
            width: 0%;
            height: 100%;
            background: var(--primary);
            border-radius: 99px;
            box-shadow: 0 0 15px var(--primary);
            transition: width 0.1s ease;
        }

        .loader-status {
            margin-top: 15px;
            font-weight: 700;
            color: rgba(255,255,255,0.8);
            letter-spacing: 1px;
            text-transform: uppercase;
            font-size: 0.8rem;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        /* Mobile Controls */
        .joystick-container {
            position: absolute;
            bottom: 50px;
            left: 50px;
            width: 120px;
            height: 120px;
            display: none;
            pointer-events: auto;
        }

        .jump-btn {
            position: absolute;
            bottom: 50px;
            right: 50px;
            width: 90px;
            height: 90px;
            background: var(--primary);
            color: #000;
            border-radius: 50%;
            display: none;
            justify-content: center;
            align-items: center;
            font-weight: 900;
            font-size: 1.2rem;
            box-shadow: 0 10px 40px rgba(250, 204, 21, 0.5);
            pointer-events: auto;
            user-select: none;
            border: 4px solid rgba(255,255,255,0.3);
        }

        /* STEM Facts */
        #stem-fact-popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            width: 450px;
            max-width: 95vw;
            background: var(--ui-glass);
            backdrop-filter: blur(30px);
            border: 4px solid var(--primary);
            padding: 40px;
            border-radius: 40px;
            text-align: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 500;
            pointer-events: auto;
        }

        #stem-fact-popup.visible {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, -50%) scale(1);
        }

        .close-btn {
            margin-top: 30px;
            padding: 12px 48px;
            background: var(--primary);
            color: #000;
            border-radius: 99px;
            font-weight: 900;
            cursor: pointer;
            display: inline-block;
            transition: transform 0.2s;
        }

        .close-btn:hover { transform: scale(1.05); }

        @media (max-width: 768px) {
            .joystick-container, .jump-btn { display: flex; }
        }
    </style>
</head>
<body>
    <!-- Loading Screen -->
    <div id="loading-screen">
        <div class="loader-content">
            <div class="loader-logo">🏰</div>
            <h1 class="loader-title">SUPER ALDO 63</h1>
            <div class="loader-bar-container">
                <div id="loading-bar" class="loader-fill" style="width: 10%"></div>
            </div>
            <p id="loading-text" class="loader-status">Downloading Assets...</p>
        </div>
    </div>
    <script>
        // Simulate progress until engine kicks in
        let initLoadingInterval = setInterval(() => {
            const bar = document.getElementById('loading-bar');
            if (bar && parseFloat(bar.style.width) < 85) {
                bar.style.width = (parseFloat(bar.style.width) + Math.random() * 10) + '%';
            }
        }, 400);
    </script>

    <div id="canvas-container"></div>
    
    <div id="ui-layer">
        <div class="hud-top">
            <div class="badge">🏰 SUPER ALDO 63</div>
            <a href="mge.html" class="badge" style="color: white; border-color: rgba(255,255,255,0.4)">🏠 HUB</a>
        </div>
        <div class="hud-bottom" style="display: flex; justify-content: center;">
            <div class="controls-hint">
                <span style="color: var(--primary)">WASD / ARROWS</span> Move • <span style="color: var(--primary)">SPACE</span> Jump • Bounce on Enemies!
            </div>
        </div>
    </div>

    <!-- Mobile UI -->
    <div class="joystick-container" id="joystick"></div>
    <div class="jump-btn" id="mobile-jump">JUMP</div>

    <!-- STEM Facts -->
    <div id="stem-fact-popup">
        <h2 style="color: var(--primary); margin-top: 0; font-weight: 900;">⭐ STEM POWER! ⭐</h2>
        <p id="fact-text" style="font-size: 1.3rem; line-height: 1.5; color: #fff;"></p>
        <div class="close-btn" id="close-popup">GOT IT!</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.10.1/nipplejs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <script>
        /**
         * SUPER ALDO 63 - CASTLE LEVEL
         * Powered by Three.js & Cannon.js
         */

        const CONFIG = {
            gravity: -30,
            jumpForce: 15,
            speed: 12,
            rotSpeed: 0.15,
            portals: [
                { name: "Sonic Speed", url: "mge-sonic-speed.html", icon: "🦔" },
                { name: "Storm Chaser", url: "mge-storm-chaser.html", icon: "🌪️" },
                { name: "Lunar Architect", url: "mge-lunar-architect.html", icon: "🚀" },
                { name: "FPS Striker", url: "mge-fps-striker.html", icon: "🎯" },
                { name: "Easter Hunt", url: "mge-easter-egg-hunt.html", icon: "🐰" },
                { name: "Minecraft", url: "mge-minecraft.html", icon: "⛏️" },
                { name: "Aqua Genesis", url: "mge-aqua-genesis.html", icon: "🌊" },
                { name: "Robot-Mon", url: "mge-robot-battler.html", icon: "🤖" },
                { name: "3D Paint", url: "mge-3d-paint.html", icon: "🎨" },
                { name: "Vibe Champion", url: "mge-vibe-champion.html", icon: "⌨️" }
            ],
            facts: [
                "Momentum = Mass × Velocity. Jump higher to land with more STOMP force!",
                "Potential Energy is stored when Aldo is at the top of a jump.",
                "In a vacuum, a hammer and a feather fall at the same rate!",
                "Friction between your feet and the ground is what starts you moving.",
                "Gravity pulls all objects toward the center of mass—on Earth, that's down!"
            ]
        };

        let scene, camera, renderer, clock = new THREE.Clock();
        let player, keys = {}, isPaused = false;
        let pLinks = [], enemies = [], joyData = null;
        let pVelocity = new THREE.Vector3();

        class EnemyEntity {
            constructor(x, z) {
                this.stomped = false;
                const mat = new THREE.MeshStandardMaterial({ color: 0x9333ea, flatShading: true });
                const mesh = new THREE.Mesh(new THREE.IcosahedronGeometry(1.2, 0), mat);
                mesh.castShadow = true;
                scene.add(mesh);
                
                // Cute angry eyes
                const eye = new THREE.Mesh(new THREE.BoxGeometry(0.3,0.3,0.3), new THREE.MeshBasicMaterial({color:0}));
                eye.position.set(0.5, 0.4, 0.8);
                mesh.add(eye);
                const eye2 = eye.clone(); eye2.position.x = -0.5;
                mesh.add(eye2);

                this.mesh = mesh;
                this.mesh.position.set(x, 1.2, z);
            }
            update(dt) {
                if(!this.stomped) {
                    this.mesh.rotation.y += dt;
                }
            }
            stomp() {
                if(this.stomped) return;
                this.stomped = true;
                gsap.to(this.mesh.scale, { y: 0.1, x: 2, z: 2, duration: 0.3, ease: "elastic.out(1,0.3)", onComplete: () => {
                    showFact();
                    gsap.to(this.mesh.scale, { x: 0, y: 0, z: 0, delay: 1.5, duration: 0.5, onComplete: () => scene.remove(this.mesh) });
                }});
            }
        }

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0ea5e9);
            scene.fog = new THREE.FogExp2(0x0ea5e9, 0.006);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
            camera.position.set(0, 20, 40);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // Lighting
            scene.add(new THREE.AmbientLight(0xffffff, 0.6));
            const sun = new THREE.DirectionalLight(0xffffff, 1.2);
            sun.position.set(50, 100, 50);
            sun.castShadow = true;
            sun.shadow.mapSize.set(2048, 2048);
            sun.shadow.camera.left = sun.shadow.camera.bottom = -100;
            sun.shadow.camera.right = sun.shadow.camera.top = 100;
            scene.add(sun);

            buildWorld();
            spawnPlayer();
            initControls();

            // Initial enemies
            for(let i=0; i<8; i++) enemies.push(new EnemyEntity((Math.random()-0.5)*100, (Math.random()-0.5)*100));

            animate();
            
            // Clear Loading Screen
            if (typeof initLoadingInterval !== 'undefined') clearInterval(initLoadingInterval);
            const bar = document.getElementById('loading-bar');
            const text = document.getElementById('loading-text');
            if(bar) bar.style.width = '100%';
            if(text) text.innerText = 'Ready!';
            
            setTimeout(() => {
                const ls = document.getElementById('loading-screen');
                if (ls) {
                    ls.style.opacity = '0';
                    setTimeout(() => ls.remove(), 500);
                }
            }, 600);
        }

        function buildWorld() {
            // Main Island
            const island = new THREE.Mesh(new THREE.CylinderGeometry(100, 105, 10, 32), new THREE.MeshStandardMaterial({ color: 0x22c55e, flatShading: true }));
            island.position.y = -5;
            island.receiveShadow = true; island.castShadow = true;
            scene.add(island);

            // Water
            const water = new THREE.Mesh(new THREE.CircleGeometry(500, 32), new THREE.MeshStandardMaterial({ color: 0x0369a1, roughness: 0.1, transparent: true, opacity: 0.8 }));
            water.rotation.x = -Math.PI / 2;
            water.position.y = -8;
            scene.add(water);

            // CASTLE
            buildCastle();

            // Portals
            const rad = 60;
            CONFIG.portals.forEach((p, i) => {
                const angle = (i/CONFIG.portals.length) * Math.PI * 2;
                createPedestal(Math.cos(angle)*rad, Math.sin(angle)*rad, p);
            });
        }

        function buildCastle() {
            const group = new THREE.Group();
            const stone = new THREE.MeshStandardMaterial({ color: 0xcbd5e1, flatShading: true });
            const roof = new THREE.MeshStandardMaterial({ color: 0xef4444, flatShading: true });

            // Keep
            const keep = new THREE.Mesh(new THREE.BoxGeometry(25, 20, 25), stone);
            keep.position.y = 10; keep.receiveShadow = true; keep.castShadow = true;
            group.add(keep);

            // 4 Towers
            const pos = [[12.5,12.5], [12.5,-12.5], [-12.5,12.5], [-12.5,-12.5]];
            pos.forEach(p => {
                const t = new THREE.Mesh(new THREE.CylinderGeometry(4, 4, 30, 12), stone);
                t.position.set(p[0], 15, p[1]); t.castShadow = true;
                group.add(t);
                const r = new THREE.Mesh(new THREE.ConeGeometry(5, 10, 12), roof);
                r.position.set(p[0], 35, p[1]);
                group.add(r);
            });

            // Drawbridge
            const bridge = new THREE.Mesh(new THREE.BoxGeometry(10, 1, 15), new THREE.MeshStandardMaterial({ color: 0x78350f }));
            bridge.position.set(0, 0.5, 20); bridge.rotation.x = 0.05;
            group.add(bridge);

            scene.add(group);
        }

        function createPedestal(x, z, data) {
            const p = new THREE.Group();
            const base = new THREE.Mesh(new THREE.CylinderGeometry(2, 3, 2, 8), new THREE.MeshStandardMaterial({ color: 0x334155 }));
            base.position.y = 1;
            p.add(base);

            const canvas = document.createElement('canvas'); canvas.width = 128; canvas.height = 128;
            const ctx = canvas.getContext('2d'); ctx.fillStyle = 'white'; ctx.font = '80px Arial'; ctx.textAlign = 'center';
            ctx.fillText(data.icon, 64, 95);
            
            const spr = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(canvas) }));
            spr.scale.set(6, 6, 1); spr.position.y = 6;
            p.add(spr);

            p.userData = { url: data.url };
            p.position.set(x, 0, z);
            scene.add(p);
            pLinks.push(p);
        }

        function spawnPlayer() {
            player = new THREE.Group();
            player.name = "Aldo_Character";
            
            const bodyGeo = new THREE.CylinderGeometry(0.6, 0.6, 1.2, 12);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0xef4444, flatShading: true });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 1.1; body.castShadow = true;
            player.add(body);
            
            const shoeGeo = new THREE.BoxGeometry(0.4, 0.3, 0.6);
            const shoeMat = new THREE.MeshStandardMaterial({ color: 0x78350f });
            const lShoe = new THREE.Mesh(shoeGeo, shoeMat);
            lShoe.position.set(-0.35, 0.15, 0.1); player.add(lShoe);
            const rShoe = lShoe.clone(); rShoe.position.x = 0.35;
            player.add(rShoe);

            const head = new THREE.Mesh(new THREE.SphereGeometry(0.55, 12, 12), new THREE.MeshStandardMaterial({ color: 0xffd1a4 }));
            head.position.y = 2.0;
            player.add(head);

            const mMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
            const m = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.1, 0.1), mMat);
            m.position.set(0, 1.85, 0.5);
            player.add(m);

            const hatBase = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.55, 0.2, 12), new THREE.MeshStandardMaterial({ color: 0xef4444 }));
            hatBase.position.y = 2.45;
            player.add(hatBase);
            const hatBrim = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.05, 0.4), new THREE.MeshStandardMaterial({ color: 0xef4444 }));
            hatBrim.position.set(0, 2.35, 0.4);
            player.add(hatBrim);

            scene.add(player);
            player.position.set(0, 0, 30);
        }

        function initControls() {
            window.addEventListener('keydown', e => keys[e.code] = true);
            window.addEventListener('keyup', e => keys[e.code] = false);

            const joy = nipplejs.create({ zone: document.getElementById('joystick'), mode: 'static', position: {left: '60px', bottom: '60px'}, color: 'white' });
            joy.on('move', (e, d) => joyData = d);
            joy.on('end', () => joyData = null);

            document.getElementById('mobile-jump').addEventListener('touchstart', e => { e.preventDefault(); keys['Space'] = true; });
            document.getElementById('mobile-jump').addEventListener('touchend', () => keys['Space'] = false);
            document.getElementById('close-popup').addEventListener('click', () => { isPaused = false; document.getElementById('stem-fact-popup').classList.remove('visible'); });
        }

        function showFact() {
            isPaused = true;
            document.getElementById('fact-text').innerText = CONFIG.facts[Math.floor(Math.random()*CONFIG.facts.length)];
            document.getElementById('stem-fact-popup').classList.add('visible');
        }

        function animate() {
            requestAnimationFrame(animate);
            const dt = Math.min(clock.getDelta(), 0.1);

            if(!isPaused) {
                let mx = 0, mz = 0;
                if(keys.KeyW || keys.ArrowUp) mz -= 1;
                if(keys.KeyS || keys.ArrowDown) mz += 1;
                if(keys.KeyA || keys.ArrowLeft) mx -= 1;
                if(keys.KeyD || keys.ArrowRight) mx += 1;
                if(joyData) { mx = joyData.vector.x; mz = -joyData.vector.y; }

                if(mx !== 0 || mz !== 0) {
                    const camYaw = camera.rotation.y;
                    const finalAngle = camYaw + Math.atan2(mx, mz);
                    pVelocity.x = Math.sin(finalAngle) * CONFIG.speed;
                    pVelocity.z = Math.cos(finalAngle) * CONFIG.speed;
                    
                    const diff = ((finalAngle - player.rotation.y) % (Math.PI * 2) + Math.PI * 3) % (Math.PI * 2) - Math.PI;
                    player.rotation.y += diff * CONFIG.rotSpeed;
                } else {
                    pVelocity.x *= 0.8; pVelocity.z *= 0.8;
                }

                // Custom constraints
                if(player.position.x > 90) player.position.x = 90;
                if(player.position.x < -90) player.position.x = -90;
                if(player.position.z > 90) player.position.z = 90;
                if(player.position.z < -90) player.position.z = -90;

                // Move Player Horizontally
                player.position.x += pVelocity.x * dt;
                player.position.z += pVelocity.z * dt;

                // Move Player Vertically
                pVelocity.y += CONFIG.gravity * dt;
                player.position.y += pVelocity.y * dt;

                if (player.position.y <= 0) {
                    player.position.y = 0;
                    if(pVelocity.y < 0) pVelocity.y = 0;
                    if(keys.Space) pVelocity.y = CONFIG.jumpForce;
                }
                
                // Smooth Third Person Camera
                const offsetDist = 20;
                const offsetHeight = 8;
                const sx = Math.sin(player.rotation.y);
                const sz = Math.cos(player.rotation.y);
                
                const idealPos = new THREE.Vector3(
                    player.position.x - sx * offsetDist,
                    player.position.y + offsetHeight,
                    player.position.z - sz * offsetDist
                );

                camera.position.lerp(idealPos, 0.08);

                const lookAtTarget = player.position.clone().add(new THREE.Vector3(0, 3, 0));
                if(!window.currentLookat) window.currentLookat = player.position.clone();
                window.currentLookat.lerp(lookAtTarget, 0.15);
                camera.lookAt(window.currentLookat);

                enemies.forEach(e => {
                    e.update(dt);
                    if(!e.stomped) {
                        const d = player.position.distanceTo(e.mesh.position);
                        if(d < 2 && player.position.y > e.mesh.position.y + 0.8 && pVelocity.y < 0) {
                            e.stomp(); pVelocity.y = CONFIG.jumpForce * 0.6;
                        }
                    }
                });

                pLinks.forEach(p => {
                    if (p.children[1]) {
                        p.children[1].rotation.y += dt * 3;
                        p.children[1].position.y = 6 + Math.sin(Date.now()*0.003) * 0.8;
                    }
                    if(player.position.distanceTo(p.position) < 4) window.location.href = p.userData.url;
                });
            }

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth/window.innerHeight; camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Auto-initialize robustly
        if (document.readyState === 'complete') {
            init();
        } else {
            window.addEventListener('load', init);
        }

    </script>
</body>
</html>
