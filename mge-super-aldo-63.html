<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Aldo 63 | MGE Castle World</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #facc15;
            --secondary: #a78bfa;
            --accent: #ef4444;
            --bg-deep: #0ea5e9;
            --ui-glass: rgba(15, 23, 42, 0.75);
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: 'Outfit', sans-serif;
            color: white;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 24px;
            box-sizing: border-box;
        }

        .hud-top {
            display: flex;
            justify-content: space-between;
            pointer-events: auto;
        }

        .badge {
            background: var(--ui-glass);
            backdrop-filter: blur(12px);
            padding: 10px 24px;
            border-radius: 99px;
            border: 2px solid var(--primary);
            font-weight: 950;
            color: var(--primary);
            text-transform: uppercase;
            box-shadow: 0 0 30px rgba(250, 204, 21, 0.4);
            text-decoration: none;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .controls-hint {
            background: var(--ui-glass);
            backdrop-filter: blur(10px);
            padding: 12px 24px;
            border-radius: 20px;
            font-size: 0.95rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            font-weight: 700;
            color: rgba(255,255,255,0.9);
        }

        /* Mobile Controls */
        .joystick-container {
            position: absolute;
            bottom: 50px;
            left: 50px;
            width: 120px;
            height: 120px;
            display: none;
            pointer-events: auto;
        }

        .jump-btn {
            position: absolute;
            bottom: 50px;
            right: 50px;
            width: 90px;
            height: 90px;
            background: var(--primary);
            color: #000;
            border-radius: 50%;
            display: none;
            justify-content: center;
            align-items: center;
            font-weight: 900;
            font-size: 1.2rem;
            box-shadow: 0 10px 40px rgba(250, 204, 21, 0.5);
            pointer-events: auto;
            user-select: none;
            border: 4px solid rgba(255,255,255,0.3);
        }

        /* STEM Facts */
        #stem-fact-popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            width: 450px;
            max-width: 95vw;
            background: var(--ui-glass);
            backdrop-filter: blur(30px);
            border: 4px solid var(--primary);
            padding: 40px;
            border-radius: 40px;
            text-align: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 500;
            pointer-events: auto;
        }

        #stem-fact-popup.visible {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, -50%) scale(1);
        }

        .close-btn {
            margin-top: 30px;
            padding: 12px 48px;
            background: var(--primary);
            color: #000;
            border-radius: 99px;
            font-weight: 900;
            cursor: pointer;
            display: inline-block;
            transition: transform 0.2s;
        }

        .close-btn:hover { transform: scale(1.05); }

        @media (max-width: 768px) {
            .joystick-container, .jump-btn { display: flex; }
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    
    <div id="ui-layer">
        <div class="hud-top">
            <div class="badge">🏰 SUPER ALDO 63</div>
            <a href="mge.html" class="badge" style="color: white; border-color: rgba(255,255,255,0.4)">🏠 HUB</a>
        </div>
        <div class="hud-bottom" style="display: flex; justify-content: center;">
            <div class="controls-hint">
                <span style="color: var(--primary)">WASD / ARROWS</span> Move • <span style="color: var(--primary)">SPACE</span> Jump • Bounce on Enemies!
            </div>
        </div>
    </div>

    <!-- Mobile UI -->
    <div class="joystick-container" id="joystick"></div>
    <div class="jump-btn" id="mobile-jump">JUMP</div>

    <!-- STEM Facts -->
    <div id="stem-fact-popup">
        <h2 style="color: var(--primary); margin-top: 0; font-weight: 900;">⭐ STEM POWER! ⭐</h2>
        <p id="fact-text" style="font-size: 1.3rem; line-height: 1.5; color: #fff;"></p>
        <div class="close-btn" id="close-popup">GOT IT!</div>
    </div>

    <!-- Legacy Scripts for Maximum Compatibility on file:/// -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.10.1/nipplejs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <script>
        /**
         * SUPER ALDO 63 - CASTLE LEVEL
         * Powered by Three.js & Cannon.js
         */

        const CONFIG = {
            gravity: -30,
            jumpForce: 15,
            speed: 12,
            rotSpeed: 0.15,
            portals: [
                { name: "Sonic Speed", url: "mge-sonic-speed.html", icon: "🦔" },
                { name: "Storm Chaser", url: "mge-storm-chaser.html", icon: "🌪️" },
                { name: "Lunar Architect", url: "mge-lunar-architect.html", icon: "🚀" },
                { name: "FPS Striker", url: "mge-fps-striker.html", icon: "🎯" },
                { name: "Easter Hunt", url: "mge-easter-egg-hunt.html", icon: "🐰" },
                { name: "Minecraft", url: "mge-minecraft.html", icon: "⛏️" },
                { name: "Aqua Genesis", url: "mge-aqua-genesis.html", icon: "🌊" },
                { name: "Robot-Mon", url: "mge-robot-battler.html", icon: "🤖" },
                { name: "3D Paint", url: "mge-3d-paint.html", icon: "🎨" },
                { name: "Vibe Champion", url: "mge-vibe-champion.html", icon: "⌨️" }
            ],
            facts: [
                "Momentum = Mass × Velocity. Jump higher to land with more STOMP force!",
                "Potential Energy is stored when Aldo is at the top of a jump.",
                "In a vacuum, a hammer and a feather fall at the same rate!",
                "Friction between your feet and the ground is what starts you moving.",
                "Gravity pulls all objects toward the center of mass—on Earth, that's down!"
            ]
        };

        let scene, camera, renderer, world, controls, clock = new THREE.Clock();
        let player, playerBody, keys = {}, isPaused = false;
        let pLinks = [], enemies = [], joyData = null;

        class EnemyEntity {
            constructor(x, z) {
                this.stomped = false;
                const mat = new THREE.MeshStandardMaterial({ color: 0x9333ea, flatShading: true });
                const mesh = new THREE.Mesh(new THREE.IcosahedronGeometry(1.2, 0), mat);
                mesh.castShadow = true;
                scene.add(mesh);
                
                // Cute angry eyes
                const eye = new THREE.Mesh(new THREE.BoxGeometry(0.3,0.3,0.3), new THREE.MeshBasicMaterial({color:0}));
                eye.position.set(0.5, 0.4, 0.8);
                mesh.add(eye);
                const eye2 = eye.clone(); eye2.position.x = -0.5;
                mesh.add(eye2);

                this.mesh = mesh;
                this.body = new CANNON.Body({ mass: 0.2, position: new CANNON.Vec3(x, 10, z), shape: new CANNON.Sphere(1.2) });
                world.addBody(this.body);
            }
            update() {
                if(!this.stomped) {
                    this.mesh.position.copy(this.body.position);
                    this.mesh.quaternion.copy(this.body.quaternion);
                }
            }
            stomp() {
                if(this.stomped) return;
                this.stomped = true;
                world.remove(this.body);
                gsap.to(this.mesh.scale, { y: 0.1, x: 2, z: 2, duration: 0.3, ease: "elastic.out(1,0.3)", onComplete: () => {
                    showFact();
                    gsap.to(this.mesh.scale, { x: 0, y: 0, z: 0, delay: 1.5, duration: 0.5, onComplete: () => scene.remove(this.mesh) });
                }});
            }
        }

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0ea5e9);
            scene.fog = new THREE.FogExp2(0x0ea5e9, 0.006);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
            camera.position.set(0, 20, 40);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            world = new CANNON.World();
            world.gravity.set(0, CONFIG.gravity, 0);

            // Lighting
            scene.add(new THREE.AmbientLight(0xffffff, 0.6));
            const sun = new THREE.DirectionalLight(0xffffff, 1.2);
            sun.position.set(50, 100, 50);
            sun.castShadow = true;
            sun.shadow.mapSize.set(2048, 2048);
            sun.shadow.camera.left = sun.shadow.camera.bottom = -100;
            sun.shadow.camera.right = sun.shadow.camera.top = 100;
            scene.add(sun);

            buildWorld();
            spawnPlayer();
            initControls();

            // Initial enemies
            for(let i=0; i<8; i++) enemies.push(new EnemyEntity((Math.random()-0.5)*100, (Math.random()-0.5)*100));

            animate();
        }

        function buildWorld() {
            // Main Island
            const island = new THREE.Mesh(new THREE.CylinderGeometry(100, 105, 10, 32), new THREE.MeshStandardMaterial({ color: 0x22c55e, flatShading: true }));
            island.position.y = -5;
            island.receiveShadow = true; island.castShadow = true;
            scene.add(island);

            const groundBody = new CANNON.Body({ mass: 0, shape: new CANNON.Cylinder(100, 105, 10, 32) });
            groundBody.position.y = -5;
            groundBody.quaternion.setFromAxisAngle(new CANNON.Vec3(1,0,0), -Math.PI/2);
            world.addBody(groundBody);

            // Water
            const water = new THREE.Mesh(new THREE.CircleGeometry(500, 32), new THREE.MeshStandardMaterial({ color: 0x0369a1, roughness: 0.1, transparent: true, opacity: 0.8 }));
            water.rotation.x = -Math.PI / 2;
            water.position.y = -8;
            scene.add(water);

            // CASTLE
            buildCastle();

            // Portals
            const rad = 60;
            CONFIG.portals.forEach((p, i) => {
                const angle = (i/CONFIG.portals.length) * Math.PI * 2;
                createPedestal(Math.cos(angle)*rad, Math.sin(angle)*rad, p);
            });
        }

        function buildCastle() {
            const group = new THREE.Group();
            const stone = new THREE.MeshStandardMaterial({ color: 0xcbd5e1, flatShading: true });
            const roof = new THREE.MeshStandardMaterial({ color: 0xef4444, flatShading: true });

            // Keep
            const keep = new THREE.Mesh(new THREE.BoxGeometry(25, 20, 25), stone);
            keep.position.y = 10; keep.receiveShadow = true; keep.castShadow = true;
            group.add(keep);
            world.addBody(new CANNON.Body({ mass: 0, position: new CANNON.Vec3(0, 10, 0), shape: new CANNON.Box(new CANNON.Vec3(12.5, 10, 12.5)) }));

            // 4 Towers
            const pos = [[12.5,12.5], [12.5,-12.5], [-12.5,12.5], [-12.5,-12.5]];
            pos.forEach(p => {
                const t = new THREE.Mesh(new THREE.CylinderGeometry(4, 4, 30, 12), stone);
                t.position.set(p[0], 15, p[1]); t.castShadow = true;
                group.add(t);
                const r = new THREE.Mesh(new THREE.ConeGeometry(5, 10, 12), roof);
                r.position.set(p[0], 35, p[1]);
                group.add(r);
                world.addBody(new CANNON.Body({ mass: 0, position: new CANNON.Vec3(p[0], 15, p[1]), shape: new CANNON.Cylinder(4, 4, 30, 12) }));
            });

            // Drawbridge
            const bridge = new THREE.Mesh(new THREE.BoxGeometry(10, 1, 15), new THREE.MeshStandardMaterial({ color: 0x78350f }));
            bridge.position.set(0, 0.5, 20); bridge.rotation.x = 0.05;
            group.add(bridge);
            const brB = new CANNON.Body({ mass: 0, position: new CANNON.Vec3(0, 0.5, 20), shape: new CANNON.Box(new CANNON.Vec3(5, 0.5, 7.5)) });
            brB.quaternion.setFromAxisAngle(new CANNON.Vec3(1,0,0), 0.05);
            world.addBody(brB);

            scene.add(group);
        }

        function createPedestal(x, z, data) {
            const p = new THREE.Group();
            const base = new THREE.Mesh(new THREE.CylinderGeometry(2, 3, 2, 8), new THREE.MeshStandardMaterial({ color: 0x334155 }));
            base.position.y = 1;
            p.add(base);

            const canvas = document.createElement('canvas'); canvas.width = 128; canvas.height = 128;
            const ctx = canvas.getContext('2d'); ctx.fillStyle = 'white'; ctx.font = '80px Arial'; ctx.textAlign = 'center';
            ctx.fillText(data.icon, 64, 95);
            
            const spr = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(canvas) }));
            spr.scale.set(6, 6, 1); spr.position.y = 6;
            p.add(spr);

            p.userData = { url: data.url };
            p.position.set(x, 0, z);
            scene.add(p);
            pLinks.push(p);
            world.addBody(new CANNON.Body({ mass: 0, position: new CANNON.Vec3(x, 1, z), shape: new CANNON.Cylinder(3, 3, 2, 8) }));
        }

        function spawnPlayer() {
            player = new THREE.Group();
            player.name = "Aldo_Character";
            const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.6, 1.2, 8, 8), new THREE.MeshStandardMaterial({ color: 0xef4444 }));
            body.position.y = 1.2; body.castShadow = true;
            player.add(body);
            const head = new THREE.Mesh(new THREE.SphereGeometry(0.5, 8, 8), new THREE.MeshStandardMaterial({ color: 0xffd1a4 }));
            head.position.y = 2.4;
            player.add(head);

            scene.add(player);
            playerBody = new CANNON.Body({ mass: 1, position: new CANNON.Vec3(0, 10, 30), shape: new CANNON.Box(new CANNON.Vec3(0.6, 1.2, 0.6)), fixedRotation: true });
            world.addBody(playerBody);
        }

        function initControls() {
            window.addEventListener('keydown', e => keys[e.code] = true);
            window.addEventListener('keyup', e => keys[e.code] = false);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enablePan = false; controls.maxPolarAngle = Math.PI / 2.1;
            controls.minDistance = 10; controls.maxDistance = 40;

            const joy = nipplejs.create({ zone: document.getElementById('joystick'), mode: 'static', position: {left: '60px', bottom: '60px'}, color: 'white' });
            joy.on('move', (e, d) => joyData = d);
            joy.on('end', () => joyData = null);

            document.getElementById('mobile-jump').addEventListener('touchstart', e => { e.preventDefault(); keys['Space'] = true; });
            document.getElementById('mobile-jump').addEventListener('touchend', () => keys['Space'] = false);
            document.getElementById('close-popup').addEventListener('click', () => { isPaused = false; document.getElementById('stem-fact-popup').classList.remove('visible'); });
        }

        function showFact() {
            isPaused = true;
            document.getElementById('fact-text').innerText = CONFIG.facts[Math.floor(Math.random()*CONFIG.facts.length)];
            document.getElementById('stem-fact-popup').classList.add('visible');
        }

        function animate() {
            requestAnimationFrame(animate);
            const dt = Math.min(clock.getDelta(), 0.1);

            if(!isPaused) {
                world.step(1/60, dt);

                let mx = 0, mz = 0;
                if(keys.KeyW || keys.ArrowUp) mz += 1;
                if(keys.KeyS || keys.ArrowDown) mz -= 1;
                if(keys.KeyA || keys.ArrowLeft) mx += 1;
                if(keys.KeyD || keys.ArrowRight) mx -= 1;
                if(joyData) { mx = joyData.vector.x; mz = joyData.vector.y; }

                if(mx !== 0 || mz !== 0) {
                    const camYaw = Math.atan2(camera.position.x - player.position.x, camera.position.z - player.position.z);
                    const moveAngle = camYaw + Math.atan2(mx, mz);
                    playerBody.velocity.x = Math.sin(moveAngle) * CONFIG.speed;
                    playerBody.velocity.z = Math.cos(moveAngle) * CONFIG.speed;
                    player.rotation.y = THREE.MathUtils.lerp(player.rotation.y, moveAngle, CONFIG.rotSpeed);
                } else {
                    playerBody.velocity.x *= 0.8; playerBody.velocity.z *= 0.8;
                }

                if(keys.Space && Math.abs(playerBody.velocity.y) < 0.5) playerBody.velocity.y = CONFIG.jumpForce;

                // Sync
                player.position.set(playerBody.position.x, playerBody.position.y - 1.2, playerBody.position.z);
                controls.target.copy(player.position).add(new THREE.Vector3(0, 2, 0));
                controls.update();

                enemies.forEach(e => {
                    e.update();
                    if(!e.stomped) {
                        const d = player.position.distanceTo(e.mesh.position);
                        if(d < 2 && player.position.y > e.mesh.position.y + 0.8 && playerBody.velocity.y < -1) {
                            e.stomp(); playerBody.velocity.y = CONFIG.jumpForce * 0.6;
                        }
                    }
                });

                pLinks.forEach(p => {
                    p.children[1].rotation.y += dt * 3;
                    p.children[1].position.y = 6 + Math.sin(Date.now()*0.003) * 0.8;
                    if(player.position.distanceTo(p.position) < 4) window.location.href = p.userData.url;
                });

                if(playerBody.position.y < -30) playerBody.position.set(0, 10, 30);
            }

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth/window.innerHeight; camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Auto-initialize robustly
        if (document.readyState === 'complete') {
            init();
        } else {
            window.addEventListener('load', init);
        }

    </script>
</body>
</html>
