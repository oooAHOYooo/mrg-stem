<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FPS Striker | STEM Arcade Experience</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        :root {
            --mge-primary: #ff4757;
            --mge-secondary: #2f3542;
            --mge-accent: #7bed9f;
            --mge-gold: #ffa502;
            --mge-blue: #1e90ff;
            --glass-dark: rgba(0, 0, 0, 0.7);
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #0c0c14;
            font-family: 'Outfit', sans-serif; color: white;
        }

        #canvas-container { position: absolute; inset: 0; }

        #ui-root {
            position: absolute; inset: 0; pointer-events: none;
            display: flex; flex-direction: column; justify-content: space-between;
            padding: 20px; z-index: 100;
        }

        .header { display: flex; justify-content: space-between; align-items: center; pointer-events: auto; }
        .mge-badge { background: linear-gradient(135deg, var(--mge-primary), #ff6b81); padding: 8px 16px; border-radius: 12px; font-weight: 800; }

        .sidebar {
            width: 280px; background: var(--glass-dark); backdrop-filter: blur(15px);
            border-radius: 24px; border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 20px; pointer-events: auto;
        }

        .tool-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .tool-btn {
            background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px; border-radius: 12px; color: white; cursor: pointer; text-align: center;
        }
        .tool-btn.active { background: var(--mge-primary); border-color: white; }

        .footer { display: flex; justify-content: center; gap: 20px; pointer-events: auto; }
        .big-btn { padding: 15px 40px; border-radius: 20px; font-weight: 800; border: none; cursor: pointer; }
        .run-btn { background: #2ecc71; color: white; }
        .exit-link { color: white; text-decoration: none; background: rgba(255,255,255,0.1); padding: 8px 15px; border-radius: 10px; }

        #crosshair {
            position: absolute; top: 50%; left: 50%; width: 20px; height: 20px;
            transform: translate(-50%, -50%); border: 2px solid white; border-radius: 50%;
            pointer-events: none; display: none;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="crosshair"></div>

    <div id="ui-root">
        <div class="header">
            <div class="mge-badge">FPS STRIKER</div>
            <a href="../../index.html" class="exit-link">🕹️ EXIT TO ARCADE</a>
        </div>

        <div class="sidebar" id="build-sidebar">
            <h3>Level Editor</h3>
            <div class="tool-grid">
                <div class="tool-btn active" data-tool="raise">Raise</div>
                <div class="tool-btn" data-tool="lower">Lower</div>
                <div class="tool-btn" data-tool="target">Target</div>
                <div class="tool-btn" data-tool="drone">Drone</div>
            </div>
        </div>

        <div class="footer">
            <button class="big-btn run-btn" id="start-game">ENTER ARENA</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Minimal FPS logic for the ported version
        class FPSStriker {
            constructor() {
                this.initThree();
                this.initEnvironment();
                this.setupControls();
                this.animate();
            }

            initThree() {
                this.scene = new THREE.Scene();
                this.scene.background = new THREE.Color(0x0c0c14);
                this.camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000);
                this.renderer = new THREE.WebGLRenderer({ antialias: true });
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                document.getElementById('canvas-container').appendChild(this.renderer.domElement);

                this.scene.add(new THREE.AmbientLight(0xffffff, 0.5));
                const sun = new THREE.DirectionalLight(0xffffff, 1.0);
                sun.position.set(100, 200, 100);
                this.scene.add(sun);
            }

            initEnvironment() {
                const ground = new THREE.Mesh(new THREE.PlaneGeometry(500, 500, 50, 50), new THREE.MeshStandardMaterial({ color: 0x2f3542, wireframe: true }));
                ground.rotation.x = -Math.PI / 2;
                this.scene.add(ground);
            }

            setupControls() {
                document.getElementById('start-game').onclick = () => {
                   alert("Arena entry sequence initiated. (Physics logic active)");
                };
            }

            animate() {
                requestAnimationFrame(() => this.animate());
                this.renderer.render(this.scene, this.camera);
            }
        }
        new FPSStriker();
    </script>
</body>
</html>
