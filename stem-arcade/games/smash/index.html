<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Smash Fighters | STEM Arcade Experience</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root {
            --mge-primary: #ff1744;
            --mge-secondary: #00e5ff;
            --mge-dark: #0a0a1a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--mge-dark); color: white; overflow: hidden; height: 100vh; }
        #canvas-container { position: absolute; inset: 0; }

        .ui-overlay { position: absolute; inset: 0; pointer-events: none; padding: 20px; }
        .back-link { position: absolute; top: 20px; left: 20px; pointer-events: auto; color: white; text-decoration: none; font-weight: 800; border: 2px solid var(--mge-primary); padding: 5px 15px; border-radius: 8px; }

        .health-hud { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 30px; background: rgba(0,0,0,0.8); padding: 15px 30px; border-radius: 20px; border: 2px solid var(--mge-primary); }
        .player-info { text-align: center; }
        .health-bar { width: 150px; height: 20px; background: #333; border-radius: 10px; overflow: hidden; margin-top: 5px; }
        .health-fill { width: 100%; height: 100%; transition: width 0.3s; }

        #p1-health { background: #ff1744; }
        #p2-health { background: #00e5ff; }

        .controls-hint { position: absolute; bottom: 20px; right: 20px; background: rgba(0,0,0,0.8); padding: 15px; border-radius: 15px; font-size: 0.8rem; border: 1px solid #9c27b0; }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div class="ui-overlay">
        <a href="../../index.html" class="back-link">🕹️ EXIT TO ARCADE</a>

        <div class="health-hud">
            <div class="player-info">
                <div>PLAYER 1</div>
                <div class="health-bar"><div id="p1-health" class="health-fill"></div></div>
            </div>
            <div class="player-info">
                <div>PLAYER 2</div>
                <div class="health-bar"><div id="p2-health" class="health-fill"></div></div>
            </div>
        </div>

        <div class="controls-hint">
            <div>P1: WASD + SPACE</div>
            <div>P2: ARROWS + ENTER</div>
        </div>
    </div>

    <script>
        class SmashFighters {
            constructor() {
                this.initThree();
                this.initScene();
                this.animate();
            }

            initThree() {
                this.scene = new THREE.Scene();
                this.scene.background = new THREE.Color(0x0f0f1f);
                this.camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
                this.camera.position.set(0, 10, 30);
                this.camera.lookAt(0,0,0);

                this.renderer = new THREE.WebGLRenderer({ antialias: true });
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                document.getElementById('canvas-container').appendChild(this.renderer.domElement);

                this.scene.add(new THREE.AmbientLight(0xffffff, 0.5));
                const light = new THREE.DirectionalLight(0xffffff, 1);
                light.position.set(10, 20, 10);
                this.scene.add(light);
            }

            initScene() {
                // Platform
                const stage = new THREE.Mesh(new THREE.BoxGeometry(30, 2, 10), new THREE.MeshStandardMaterial({ color: 0x222244 }));
                stage.position.y = -1;
                this.scene.add(stage);

                // Players
                this.p1 = new THREE.Mesh(new THREE.BoxGeometry(2, 2, 2), new THREE.MeshStandardMaterial({ color: 0xff1744 }));
                this.p1.position.set(-10, 1, 0);
                this.scene.add(this.p1);

                this.p2 = new THREE.Mesh(new THREE.BoxGeometry(2, 2, 2), new THREE.MeshStandardMaterial({ color: 0x00e5ff }));
                this.p2.position.set(10, 1, 0);
                this.scene.add(this.p2);
            }

            animate() {
                requestAnimationFrame(() => this.animate());
                this.renderer.render(this.scene, this.camera);
            }
        }
        new SmashFighters();
    </script>
</body>
</html>
